<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Guide Quest Arcade</title>
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#1F4D3A;--gold:#F2C14E;--cream:#FFF8E8;--ink:#17231C;--glass:rgba(16,24,20,.78);--line:rgba(255,255,255,.14);--font:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0E1612;color:#fff;font:16px/1.4 var(--font);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none}
.scr[hidden]{display:none}
.scr > *{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 8px}
.top h1{flex:1;margin:0;font:900 20px/1.1 var(--font);text-shadow:0 2px 8px rgba(0,0,0,.45)}
.ib{min-width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;font-size:19px;padding:0 10px;backdrop-filter:blur(8px)}
.ib.txt{font:800 14px var(--font)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet{margin-top:auto;max-height:66vh;overflow:auto;padding:16px 16px max(16px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;width:100%;max-width:560px;align-self:center;touch-action:pan-y}
.cards{display:grid;gap:10px}
.gcard{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;gap:2px 12px;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.07)}
.gcard .gi{grid-row:span 2;font-size:34px;display:grid;place-items:center;background:rgba(242,193,78,.16);border-radius:14px}
.gcard b{font:800 17px var(--font)} .gcard small{color:#C9D6CC;font-size:13px}
.hero{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hero .gi{font-size:38px;width:58px;height:58px;display:grid;place-items:center;background:rgba(242,193,78,.18);border-radius:16px}
.hero h2{margin:0;font:900 24px/1.1 var(--font)} .hero p{margin:2px 0 0;color:#C9D6CC;font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);text-align:left;min-height:92px}
.mode span{font-size:24px} .mode b{font:800 16px var(--font)} .mode small{color:#C9D6CC;font-size:12.5px;line-height:1.3}
.mode[data-mode=endless]{background:linear-gradient(135deg,rgba(242,193,78,.28),rgba(255,255,255,.06))}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.lv{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv b{font:900 20px var(--font)} .lv small{font-size:10px;color:var(--gold);letter-spacing:-1px} .lv small s{color:rgba(255,255,255,.25);text-decoration:none}
.lv.lock{opacity:.45}
h4{margin:14px 0 6px;font:800 13px var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.board{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.board li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.board li.me{background:rgba(242,193,78,.25)} .board b{color:var(--gold)} .board em{font-style:normal;font-weight:800}
.mute{color:#AEBDB2;font-size:13.5px;margin:6px 0}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);font:800 15px var(--font);padding:0 14px}
.btn.go{background:var(--gold);color:#2A1C00;border-color:var(--gold)}
/* loading */
#s-load{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2B5C46,#0E1612)}
.loadbox{width:min(320px,80vw);text-align:center}
.loadbox .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin:14px 0 8px}
#load-bar{height:100%;width:5%;background:var(--gold);transition:width .3s}
/* HUD */
#s-hud{pointer-events:none}
.hudtop{display:flex;align-items:flex-start;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 0;pointer-events:none}
.hudtop > *{pointer-events:auto}
.sc{background:var(--glass);border-radius:14px;padding:6px 12px;min-width:96px;border:1px solid var(--line)}
.sc b{display:block;font:900 22px/1 var(--font)} .sc small{font-size:12px;color:#E9DCB9}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
#h-hearts{font-size:20px;letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.4)} #h-hearts s{opacity:.25;text-decoration:none} #h-hearts .inf{font:800 13px var(--font);background:var(--glass);padding:4px 10px;border-radius:10px}
#h-mode{font:800 11px var(--font);text-transform:uppercase;letter-spacing:.08em;background:var(--glass);padding:3px 8px;border-radius:8px;color:var(--gold)}
.prog{width:min(220px,46vw);height:6px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden} #h-prog{height:100%;width:0;background:var(--gold)}
#h-dist{font:700 12px var(--font);text-shadow:0 1px 4px rgba(0,0,0,.6)}
#h-power{display:flex;gap:6px;justify-content:center;margin-top:4px} #h-power span{background:var(--glass);border-radius:10px;padding:3px 8px;font:800 13px var(--font)}
#h-badges{display:flex;gap:4px;justify-content:center;margin-top:4px} #h-badges span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.4);font-size:15px;filter:grayscale(1);opacity:.55;border:2px solid transparent}
#h-badges span.on{filter:none;opacity:1;border-color:var(--gold);background:var(--g)}
#h-q{margin:8px auto 0;width:min(560px,calc(100vw - 16px));padding:10px 10px 8px;text-align:center;animation:pop .3s ease}
#h-q p{margin:0 0 8px;font:800 15.5px/1.3 var(--font)}
.qopts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.qo{border-radius:12px;background:color-mix(in srgb,var(--c) 85%,black);padding:6px;font:700 12.5px/1.25 var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:2px solid rgba(255,255,255,.35)}
.qo i{font-style:normal;font:900 16px var(--font);background:rgba(255,255,255,.25);border-radius:8px;padding:0 7px}
.qo.none{background:transparent;border:none;color:#C9D6CC}
#h-q small{display:block;margin-top:5px;color:#C9D6CC;font-size:11.5px}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
#h-quest{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 84px);max-width:min(270px,62vw);padding:8px 11px;font:700 12.5px/1.35 var(--font);display:flex;flex-direction:column;gap:3px;pointer-events:none;opacity:.95}
#h-quest[hidden]{display:none!important} #h-quest b{font:900 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)} #h-quest span{color:#D8E2DC} #h-quest span.now{color:#fff;font-weight:900} #h-quest span.more{opacity:.6}
#h-timing{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:min(360px,92vw);padding:12px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;z-index:3;font:700 13px var(--font);color:#fff;transition:background .15s}
#h-timing[hidden]{display:none!important} #h-timing b{font:900 14px var(--font)} #h-timing small{opacity:.75;font:800 12px var(--font)} #h-timing.ok{background:rgba(46,125,79,.92)} #h-timing.no{background:rgba(160,40,40,.92)}
#h-timing .tbar{position:relative;width:100%;height:22px;border-radius:11px;background:rgba(255,255,255,.18);overflow:hidden} #h-timing .tz{position:absolute;top:0;bottom:0;background:#5FD08A;border-radius:11px} #h-timing .tm{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 6px rgba(0,0,0,.5)}
#h-timing button{font:900 18px var(--font);background:var(--gold);color:#2A1C00;border:0;border-radius:16px;padding:13px 34px;box-shadow:0 5px 14px rgba(0,0,0,.35)} #h-timing button:disabled{opacity:.6}
#h-sash{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 66px);padding:7px 8px;display:grid;grid-template-columns:repeat(3,30px);gap:5px;background:linear-gradient(135deg,#2E7D4F,#1F5A38);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none} #h-sash[hidden]{display:none!important}
#h-sash i{width:30px;height:30px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);display:grid;place-items:center;font-style:normal;font-size:16px} #h-sash i.got{border:2px solid #F2C14E;background:#FFF8E1;animation:pop .3s ease}
#h-rq{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);width:min(420px,94vw);padding:9px 11px 8px;display:flex;flex-direction:column;gap:6px;z-index:3;font:700 13px/1.3 var(--font);color:#fff}
#h-rq[hidden]{display:none!important} #h-rq .rq-tag{font:900 10.5px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)} #h-rq b{font:900 14.5px/1.3 var(--font)} #h-rq small{opacity:.7;font:800 11px var(--font)}
#h-rq .rq-opts{display:flex;flex-direction:column;gap:5px} #h-rq button{display:flex;align-items:center;gap:8px;text-align:left;font:800 13px/1.25 var(--font);color:#fff;background:rgba(255,255,255,.1);border:2px solid var(--c);border-radius:11px;padding:6px 8px}
#h-rq button i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:900 12px var(--font);font-style:normal}
#h-lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,92vw);max-height:86vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;z-index:4;font:700 14px var(--font);color:#fff}
#h-lobby[hidden]{display:none!important} #h-lobby .lb-t{font:900 17px var(--font)} #h-lobby label{display:flex;flex-direction:column;gap:5px;font:800 12px var(--font);color:#D8E2DC}
#h-lobby input{font:800 17px var(--font);padding:11px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;width:100%;box-sizing:border-box} #h-lobby #lb-code{text-transform:uppercase;letter-spacing:.2em;text-align:center}
#h-lobby button{font:900 15px var(--font);border:0;border-radius:13px;padding:12px;background:rgba(255,255,255,.14);color:#fff} #h-lobby .lb-go{background:var(--gold);color:#2A1C00;font-size:17px}
#h-lobby .lb-or{text-align:center;opacity:.7;font-size:12px} #h-lobby .lb-join{display:flex;gap:8px} #h-lobby .lb-join button{flex:none;padding:0 18px}
#h-lobby .lb-msg{min-height:18px;margin:0;color:#FFD27A} #h-lobby .lb-note{margin:0;opacity:.7;font-size:12px}
#h-lobby .lb-code{font:900 40px/1 var(--font);letter-spacing:.18em;text-align:center;color:var(--gold);padding:6px 0}
#h-lobby .lb-list{display:flex;flex-wrap:wrap;gap:6px} #h-lobby .lb-p{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 10px} #h-lobby .lb-p.me{outline:2px solid var(--gold)}
#h-lobby .lb-p i{width:10px;height:10px;border-radius:50%} #h-lobby .lb-p em{font-style:normal;color:#FFD27A}
#h-lobby .lb-chat{display:grid;grid-template-columns:repeat(4,1fr);gap:5px} #h-lobby .lb-chat button{padding:8px 4px;font-size:12px} #h-lobby .lb-leave{background:transparent;opacity:.75;font-size:13px}
#h-act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:3}
#h-act button{font:900 17px var(--font);background:var(--gold);color:#2A1C00;border:0;border-radius:18px;padding:15px 24px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:pop .25s ease;white-space:nowrap}
#h-joy{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(0,0,0,.14);pointer-events:none}
#h-joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.82)}
#h-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5} #h-flash.go{animation:flash .6s ease-out} @keyframes flash{0%{opacity:.95}100%{opacity:0}}
#h-card .cd-photo{display:block;width:100%;max-width:360px;aspect-ratio:3/2;object-fit:cover;border-radius:12px;margin:10px auto 2px;border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.35);transform:rotate(-1.2deg)}
#h-toasts{position:fixed;left:0;right:0;top:46%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:min(520px,90vw);background:var(--glass);border-radius:14px;padding:8px 14px;font:800 15px/1.3 var(--font);text-align:center;animation:pop .25s ease;transition:opacity .4s,transform .4s;border:1px solid var(--line)}
.toast.good{border-color:#5FD08A} .toast.bad{border-color:#F07A6A} .toast.go{font:900 40px var(--font);background:none;border:none;color:var(--gold);text-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast.out{opacity:0;transform:translateY(-10px)}
#h-fact{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(520px,calc(100vw - 20px));padding:10px 14px;background:rgba(60,16,16,.86);border:1px solid rgba(255,140,120,.4);border-radius:16px;transition:opacity .4s}
#h-fact.out{opacity:0} #h-fact b{font:900 16px var(--font)} #h-fact p{margin:3px 0 0;font-size:14px;line-height:1.35}
#h-hint{position:fixed;left:50%;top:60%;transform:translateX(-50%);background:var(--gold);color:#2A1C00;font:900 18px var(--font);padding:10px 16px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .3s ease;white-space:nowrap}
#h-tap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22vh;pointer-events:auto}
#h-tap div{background:var(--glass);padding:14px 20px;border-radius:18px;text-align:center;font:800 16px var(--font);border:1px solid var(--line);animation:pulse 1.4s infinite}
#h-tap small{display:block;font-weight:600;color:#C9D6CC;margin-top:4px;font-size:13px}
@keyframes pulse{50%{transform:scale(1.04)}}
/* pause and end */
#s-pause{align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#s-pause .panel{padding:20px;width:min(340px,86vw);text-align:center}
#s-end{align-items:center;justify-content:flex-end}
#s-end .panel{width:min(560px,100vw);max-height:78vh;overflow:auto;padding:16px 16px max(16px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;touch-action:pan-y}
.end-top{text-align:center} .end-top h2{margin:2px 0 6px;font:900 26px var(--font)}
.stars{font-size:38px;color:var(--gold);letter-spacing:4px} .stars s{opacity:.25;text-decoration:none;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 4px} .stats b{display:block;font:900 18px var(--font)} .stats small{font-size:11.5px;color:#C9D6CC}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips span{background:rgba(95,208,138,.18);border:1px solid rgba(95,208,138,.45);border-radius:999px;padding:4px 10px;font:700 13px var(--font)}
.facts{margin:0;padding-left:18px;font-size:13.5px;color:#E3ECE5} .facts li{margin:4px 0}
.new{color:var(--gold);font:900 18px var(--font);text-align:center;margin:8px 0}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap} .btns .btn{min-width:30%}
/* customise */
.seg{display:flex;gap:6px;flex-wrap:wrap} .seg button{min-height:42px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.08);font:800 14px var(--font)}
.seg button.on{border-color:var(--gold);background:rgba(242,193,78,.2)} .seg.sw button{width:44px;padding:0;border-radius:50%}
.custom-sheet{max-height:56vh}
/* train games */
#h-tq{margin:8px auto 0;width:min(560px,calc(100vw - 16px));padding:12px 12px 10px;text-align:center;animation:pop .3s ease;pointer-events:auto}
#h-tq p{margin:0 0 8px;font:800 17px/1.3 var(--font)}
.tq-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin:0 0 10px} .tq-bar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .2s linear}
#h-tq.urgent .tq-bar i{background:#F07A6A} #h-tq.urgent{border-color:#F07A6A}
.tq-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tq-opts button{display:flex;align-items:center;gap:8px;min-height:58px;border-radius:14px;border:3px solid transparent;background:color-mix(in srgb,var(--c) 80%,black);padding:8px 10px;font:800 14px/1.25 var(--font);text-align:left}
.tq-opts button:last-child{flex-direction:row-reverse;text-align:right}
.tq-opts button i{font-style:normal;font-size:20px} .tq-opts button.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
#h-tq small{display:block;margin-top:7px;color:#C9D6CC;font-size:12px}
#h-tres{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));width:min(520px,calc(100vw - 20px));padding:12px 16px;border-radius:18px;animation:pop .3s ease}
#h-tres.good{background:rgba(20,70,40,.92);border:1px solid #5FD08A} #h-tres.bad{background:rgba(80,18,18,.92);border:1px solid #F07A6A}
#h-tres b{font:900 18px var(--font)} #h-tres p{margin:4px 0 0;font-size:14.5px;line-height:1.35}
/* cards for the adventures (questions, people talking, choices) */
#h-card{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(540px,calc(100vw - 16px));max-height:72vh;overflow:auto;padding:14px 14px 12px;pointer-events:auto;animation:pop .3s ease;touch-action:pan-y}
#h-card .cd-tag{display:inline-block;font:800 11px var(--font);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#2A1C00;padding:4px 8px;border-radius:8px;margin-bottom:8px}
#h-card .cd-head{display:flex;gap:10px;align-items:center} #h-card .cd-ic{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:14px;flex:none}
#h-card .cd-head small{display:block;color:var(--gold);font:800 12px var(--font);text-transform:uppercase;letter-spacing:.05em} #h-card .cd-head b{font:900 18px/1.25 var(--font)}
#h-card p{margin:10px 0 4px;font-size:15.5px;line-height:1.45;color:#EEF3EF}
.cd-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px} .cd-opts.col{grid-template-columns:1fr}
.cd-opts button{min-height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.12);font:800 15px/1.25 var(--font);padding:8px 12px;text-align:center}
.cd-opts button.go{background:var(--gold);color:#2A1C00;border-color:var(--gold)} .cd-opts button:disabled{opacity:.55}
#h-card.ok{border-color:#5FD08A} #h-card.no{border-color:#F07A6A} .cd-fb{font-weight:700} #h-card.ok .cd-fb{color:#8BE3AC} #h-card.no .cd-fb{color:#FFB0A4}
#h-banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;animation:pop .35s ease}
