<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Quest · Counsellors</title>
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#F2F4EC; --surface:#FFFFFF; --surface2:#E6EBDF; --ink:#17231C; --muted:#526057; --line:#D2D9CA;
  --pine:#1F4D3A; --pine-ink:#FFFFFF; --gold:#E9A91C; --gold-ink:#17231C;
  --good:#1E7A46; --good-ink:#FFFFFF; --good-soft:#DDF0E3; --bad:#B3261E; --bad-soft:#FBE4E1;
  --m1:#C4452C; --m1-ink:#FFFFFF; --m1-text:#A63A24; --m1-soft:#F8E3DC;
  --m2:#0E7373; --m2-ink:#FFFFFF; --m2-text:#0A5E5E; --m2-soft:#D9EEEC;
  --m3:#6A3D9A; --m3-ink:#FFFFFF; --m3-text:#5A3188; --m3-soft:#ECE3F5;
  --m4:#2E6A3E; --m4-ink:#FFFFFF; --m4-text:#245633; --m4-soft:#DDEBDD;
  --m5:#E9A91C; --m5-ink:#17231C; --m5-text:#7A5300; --m5-soft:#FBEFCB;
  --base:#24407A; --base-ink:#FFFFFF; --base-text:#24407A; --base-soft:#DFE6F5;
  --shadow:0 1px 2px rgba(23,35,28,.07), 0 6px 18px rgba(23,35,28,.06);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1612; --surface:#16211B; --surface2:#223029; --ink:#E9EFE6; --muted:#A7B4AA; --line:#2E3D34;
    --pine:#86CFA0; --pine-ink:#0E1612; --gold:#F2C14E; --gold-ink:#17231C;
    --good:#62D092; --good-ink:#0E1612; --good-soft:#173826; --bad:#FF8F84; --bad-soft:#3A1A17;
    --m1:#F0826A; --m1-ink:#1B0E0A; --m1-text:#F59C87; --m1-soft:#3A1F18;
    --m2:#48C1BD; --m2-ink:#07201F; --m2-text:#6FD0CC; --m2-soft:#12302F;
    --m3:#B793E6; --m3-ink:#1B1027; --m3-text:#C7A9EE; --m3-soft:#2A2038;
    --m4:#74C58F; --m4-ink:#0C1F12; --m4-text:#8FD3A6; --m4-soft:#18301F;
    --m5:#F2C14E; --m5-ink:#1F1600; --m5-text:#F5CD6E; --m5-soft:#3A2F12;
    --base:#98B2F0; --base-ink:#0D1730; --base-text:#AFC3F4; --base-soft:#1B2540;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1612; --surface:#16211B; --surface2:#223029; --ink:#E9EFE6; --muted:#A7B4AA; --line:#2E3D34;
  --pine:#86CFA0; --pine-ink:#0E1612; --gold:#F2C14E; --gold-ink:#17231C;
  --good:#62D092; --good-ink:#0E1612; --good-soft:#173826; --bad:#FF8F84; --bad-soft:#3A1A17;
  --m1:#F0826A; --m1-ink:#1B0E0A; --m1-text:#F59C87; --m1-soft:#3A1F18;
  --m2:#48C1BD; --m2-ink:#07201F; --m2-text:#6FD0CC; --m2-soft:#12302F;
  --m3:#B793E6; --m3-ink:#1B1027; --m3-text:#C7A9EE; --m3-soft:#2A2038;
  --m4:#74C58F; --m4-ink:#0C1F12; --m4-text:#8FD3A6; --m4-soft:#18301F;
  --m5:#F2C14E; --m5-ink:#1F1600; --m5-text:#F5CD6E; --m5-soft:#3A2F12;
  --base:#98B2F0; --base-ink:#0D1730; --base-text:#AFC3F4; --base-soft:#1B2540;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:580px;margin:0 auto;padding-inline:16px;padding-block:10px 56px;display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}

/* ---- counsellor dashboard ---- */
.cwrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:10px 72px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-weight:800;font-size:22px;color:var(--pine);display:flex;align-items:center;gap:8px}
.wordmark small{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.live.busy i{background:var(--gold)}
.live.err i{background:var(--bad)}
.chipme{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--pine);color:var(--pine-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.btn{min-height:44px;white-space:nowrap;border-radius:12px;padding:0 16px;font-weight:800;font-size:14px;border:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn-primary{background:var(--pine);color:var(--pine-ink)}
.btn-ghost{background:var(--surface);border-color:var(--line)}
.btn-danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn-wa{background:#1F8F4E;color:#FFFFFF}
.btn-small{min-height:38px;padding:0 12px;font-size:13px}
.btn-block{width:100%}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px;max-width:100%;overflow-x:auto;width:max-content}
.tab{min-height:40px;padding:0 16px;border-radius:10px;border:none;background:transparent;font-weight:800;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat.hl{border-color:var(--gold);background:var(--m5-soft)}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--gold);border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;width:100%}
.pcard:hover{border-color:var(--pine)}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-name{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.2}
.pc-score{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;border:1.5px solid var(--c);color:var(--ct);display:inline-flex;align-items:center;gap:3px}
.pip.full{background:var(--c);color:var(--ci)}
.ready{font-size:12px;font-weight:800;color:var(--m5-text);background:var(--m5-soft);border-radius:999px;padding:3px 9px;width:max-content}
.gridwrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:16px}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.grid th,.grid td{padding:0;text-align:center;border-bottom:1px solid var(--line)}
.grid .nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:6px 12px;min-width:150px;border-right:1px solid var(--line)}
.grid .nm button{background:none;border:none;padding:6px 0;font-weight:800;font-size:14px;cursor:pointer;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.grid .grp th{background:var(--c);color:var(--ci);font-size:11px;font-weight:800;padding:6px 6px;white-space:nowrap;border-left:2px solid var(--surface)}
.grid .codes th{font-size:11px;font-weight:800;color:var(--ct);padding:6px 2px;background:var(--cs)}
.grid td.sc{font-weight:800;padding:0 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell{width:36px;height:40px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:auto;padding:0}
.cell .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent}
.cell.on .box{background:var(--c);border-color:var(--c);color:var(--ci)}
.cell.signed .box{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:5px;border:2px solid var(--line);display:inline-block}
.lg.on{background:var(--pine);border-color:var(--pine)}
.lg.signed{background:var(--pine);border-color:var(--pine);box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--gold)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:19px}
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.act:first-child{border-top:none}
.act time{color:var(--muted);font-size:13px;font-weight:600}
.back{min-height:44px;padding:0 14px 0 6px;border-radius:12px;border:none;background:transparent;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;width:max-content}
.dhead{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dhead h1{font-size:30px;line-height:1.05;color:var(--pine)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1 1 auto;min-width:0}
input[type=text],input[type=password],textarea{width:100%;max-width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--ground);color:var(--ink);padding:10px 12px;font:16px var(--body)}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:var(--pine);outline:none;box-shadow:0 0 0 3px var(--surface2)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:14px;font-weight:700}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--pine)}
.mblocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.mblock{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.mblock-h{background:var(--c);color:var(--ci);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mblock-h b{font-family:var(--display);font-size:17px}
.reqrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border:none;border-top:1px solid var(--line);width:100%;background:none;text-align:left;cursor:pointer;min-height:52px}
.mblock-h+.reqrow{border-top:none}
.tick{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent}
.reqrow[aria-pressed="true"] .tick{background:var(--c);border-color:var(--c);color:var(--ci)}
.rc{font-weight:800;font-size:13px;color:var(--ct);width:40px;flex-shrink:0}
.rt{font-size:14px;flex:1;line-height:1.3}
.signbar{padding:12px 16px;border-top:2px dashed var(--c);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--cs)}
.signbar p{font-size:14px;font-weight:700}
.signbar .ok{color:var(--good);display:flex;align-items:center;gap:6px}
.ans{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.ans:first-of-type{border-top:none}
.ans b{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.04em}
.ans p{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.card{background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);max-width:440px;width:100%;margin:28px auto 0}
.card h1{font-size:28px;line-height:1.1;color:var(--pine)}
.err{color:var(--bad);font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--line)}
.mtable td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.mtable td.num{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;width:120px}
.mtag{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--c);color:var(--ci);white-space:nowrap}
.sechead td{background:var(--surface2);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.schip{font-size:12px;font-weight:700;color:var(--ink);background:var(--surface2);border-radius:999px;padding:3px 9px;width:max-content;max-width:100%}
.sd2ok{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--good);font-weight:800}
.qa{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.qa:first-child{border-top:none}
.qa-top{display:flex;gap:10px;font-size:15px;font-weight:600}
.qa-top b{color:var(--muted);flex-shrink:0}
.qa p{font-size:14px;padding-left:34px}
.qa.no p b:first-child{color:var(--bad)}
.markrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-left:34px}
.mbtn{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.mbtn.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.mbtn.bad.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qcard.off{opacity:.7}
.qtext2{font-size:17px;font-weight:700;line-height:1.35}
.qopts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.qopts li{padding:6px 10px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;gap:6px}
.qopts li b{color:var(--muted)}
.qopts li.ok{background:var(--good-soft);color:var(--good);font-weight:700}
.qopt{display:flex;gap:10px;align-items:center}
.qopt .check{flex-shrink:0;gap:6px}
.qopt input[type=text]{flex:1 1 auto;min-width:0}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rrow:first-child{border-top:none}
.rrow .nm{flex:1 1 160px;font-weight:800}
.rrow .sc{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.tchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tchip small{font-weight:700;opacity:.75}
@media (max-width:560px){.act{grid-template-columns:minmax(0,1fr)}.mblocks{grid-template-columns:minmax(0,1fr)}.dhead h1{font-size:26px}}
/* ---- assistant ---- */
.aiwrap{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.aihead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.aihead h2{font-size:22px;display:flex;align-items:center;gap:8px}
.aihead p{font-size:14px}
.aimsgs{display:flex;flex-direction:column;gap:12px}
.aimsg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.aimsg.me{align-items:flex-end}
.aibub{border-radius:18px;padding:12px 15px;font-size:15px;line-height:1.55;max-width:100%;overflow-wrap:anywhere}
.aimsg.me .aibub{background:var(--pine);color:var(--pine-ink);border-bottom-right-radius:6px;max-width:88%;white-space:pre-wrap}
.aimsg.bot .aibub{background:var(--surface);border:1.5px solid var(--line);border-bottom-left-radius:6px}
.aimsg.err .aibub{background:var(--bad-soft);border:1.5px solid var(--bad);color:var(--ink)}
.aibub p{margin:0 0 8px}
.aibub p:last-child,.aibub ul:last-child,.aibub ol:last-child,.aibub .aitable:last-child{margin-bottom:0}
.aibub ul,.aibub ol{margin:0 0 8px;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.aibub h4{font-family:var(--display);font-size:17px;margin:10px 0 6px}
.aibub h4:first-child{margin-top:0}
.aibub code{background:var(--surface2);border-radius:6px;padding:1px 5px;font-size:14px}
.aitable{overflow-x:auto;margin:0 0 8px}
.aitable table{border-collapse:collapse;font-size:14px;min-width:100%}
.aitable th,.aitable td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.aitable th{background:var(--surface2)}
.aiacts{display:flex;flex-direction:column;gap:6px}
.aiact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--good-soft);border:1.5px solid var(--good);border-radius:14px;padding:8px 10px 8px 12px;font-weight:700;font-size:14px}
.aiact span{flex:1 1 200px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.aiact.undone{background:var(--surface2);border-color:var(--line)}
.aiact.undone span{text-decoration:line-through;color:var(--muted)}
.aitools{display:flex;gap:6px;flex-wrap:wrap}
.aitool{min-height:34px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--muted);text-decoration:none}
.aitool[aria-pressed="true"]{border-color:var(--pine);color:var(--pine)}
.aiwelcome{display:flex;flex-direction:column;gap:12px}
.aiwelcome ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.aichips{display:flex;flex-wrap:wrap;gap:8px}
.aichip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);text-align:left}
.aichip:hover{border-color:var(--pine)}

  function mDone(p, m){ return m.tasks.filter(function(c){ return p.done[idx(c)]; }).length; }
  function mComplete(p, m){ return mDone(p, m) === m.tasks.length; }
  function readyList(p){ return MISSIONS.filter(function(m){ return mComplete(p, m) && !p.signs[m.id]; }); }
  function linkFor(p){ return S.data && S.data.url ? S.data.url + '?t=' + p.t : ''; }
  function waFor(p){ return 'https://wa.me/?text=' + encodeURIComponent('Hi ' + p.name + '! Here is your Guide Quest link. Keep it private: ' + linkFor(p)); }
  function find(t){ var a = S.data ? S.data.pathfinders : []; for (var i=0;i<a.length;i++) if (a[i].t === t) return a[i]; return null; }
  function saveCreds(){ try { if (S.remember) localStorage.setItem(KEY, JSON.stringify({pin:S.pin, who:S.who})); else localStorage.removeItem(KEY); } catch(e){} }

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    if (!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 3200);
  }

  /* ---------- server calls ---------- */
  var ERR = {'bad-pin':'That PIN didn’t work.','locked':'Too many wrong tries. Wait 15 minutes and try again.','no-pin':'','weak-pin':'Use 6 to 20 letters or numbers.','pin-exists':'A PIN has already been set. Enter it below.','not-found':'That Pathfinder was removed or has a new link. Refreshing…'};
  function call(fn, args, ok, fail){
    S.busy++; paintLive();
    var r = google.script.run
      .withSuccessHandler(function(res){ S.busy--; S.err = false; paintLive(); if (ok) ok(res); })
      .withFailureHandler(function(e){
        S.busy--; S.err = true; paintLive();
        var m = String(e && e.message || e);
        var code = (m.match(/bad-pin|locked|no-pin|weak-pin|pin-exists|not-found/) || [''])[0];
        if (S.data && (code === 'bad-pin' || code === 'locked')){ lockOut(ERR[code]); return; }
        if (fail) fail(code, m);
      });
    r[fn].apply(r, args);
  }
  function paintLive(){
    var el = document.getElementById('live'); if (!el) return;
    el.className = 'live' + (S.busy ? ' busy' : (S.err ? ' err' : ''));
    el.lastChild.textContent = S.busy ? 'Updating…' : (S.err ? 'Not connected' : 'Live · ' + (S.lastSync ? new Date(S.lastSync).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : ''));
  }
  function loadOverview(quiet){
    call('c_overview', [S.pin], function(res){
      S.data = res; if (!S.data.extras) S.data.extras = {}; S.lastSync = Date.now(); rvNotify();
      if (S.open && !find(S.open)) S.open = null;
      var a = document.activeElement;
      if (quiet && (S.qEdit || (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')))) { paintLive(); return; }
      rerender();
    }, function(code){ if (!quiet) toast('Couldn’t load the class. Check your connection.'); });
  }
  function lockOut(msg){
    S.pin = ''; S.data = null; S.open = null; S.mode = 'login'; S.msg = msg || '';
    try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv){ sv.pin = ''; localStorage.setItem(KEY, JSON.stringify(sv)); } } catch(e){}
    render();
  }
  setInterval(function(){ if (S.data && !S.busy && !document.hidden) loadOverview(true); }, 20000);

  /* ---------- views ---------- */
  function renderLogin(){
    var create = S.mode === 'create';
    var h = '<div class="cwrap"><div class="topbar"><div class="wordmark">'+COMPASS+'Guide Quest <small>Counsellors</small></div></div>';
    h += '<form class="card" id="loginform" autocomplete="off">';
    if (create){
      h += '<span class="eyebrow muted">First time here</span><h1>Create the club PIN</h1><p class="muted">You and the other counsellor will use this PIN to open the dashboard. No email needed. Use at least 6 digits and keep it away from Pathfinders.</p>'
        + '<label class="field"><span>New PIN</span><input type="password" id="pin" inputmode="numeric" maxlength="20" autocomplete="new-password"></label>'
        + '<label class="field"><span>Type it again</span><input type="password" id="pin2" inputmode="numeric" maxlength="20" autocomplete="new-password"></label>';
    } else {
      h += '<span class="eyebrow muted">Counsellor dashboard</span><h1>Enter the club PIN</h1><p class="muted">No email or password needed. Pathfinders use their own personal links instead.</p>'
        + '<label class="field"><span>Club PIN</span><input type="password" id="pin" inputmode="numeric" maxlength="20" autocomplete="current-password"></label>';
    }
    h += '<label class="field"><span>Your initials (shown on sign-offs)</span><input type="text" id="who" maxlength="12" value="'+esc(S.who)+'" placeholder="e.g. JB"></label>'
      + '<label class="check"><input type="checkbox" id="remember"'+(S.remember?' checked':'')+'>Stay signed in on this phone</label>'
      + (S.msg ? '<p class="err" role="alert">'+esc(S.msg)+'</p>' : '')
      + '<button class="btn btn-primary btn-block" type="submit">'+(create ? 'Save PIN and open' : 'Open dashboard')+'</button></form></div>';
    return h;
  }

  function topbar(){
    return '<div class="topbar"><div class="wordmark">'+COMPASS+'Guide Quest <small>Counsellors</small></div>'
      + '<div class="tb-right"><span id="live" class="live"><i></i><span></span></span>'
      + '<span class="chipme"><span class="avatar">'+initials(S.who || 'C')+'</span>'+esc(S.who || 'Counsellor')+'</span>'
      + '<button class="btn btn-ghost btn-small" data-act="lock">'+LOCK+'Lock</button></div></div>';
  }
  function tabs(){
    var t = [['class','Class'],['meet','Meetings & Plan'],['explorers','Explorers'],['report','Report'],['ai','Assistant'],['roster','Links']];
    var cur = S.tab === 'map' ? 'class' : (['sanct','lab','questions','games','gems'].indexOf(S.tab) > -1 ? 'explorers' : S.tab);
    var nrv = reviews().length;
    return '<div class="tabsbox"><div class="tabs main" role="tablist" id="maintabs">' + t.map(function(x){ return '<button class="tab" role="tab" data-tab="'+(x[0] === 'explorers' ? (S.lastX || 'lab') : x[0])+'" aria-selected="'+(cur === x[0] && !S.open)+'">'+x[1]+(x[0] === 'class' && nrv ? ' <span class="tbadge" aria-label="'+nrv+' to review">'+nrv+'</span>' : '')+'</button>'; }).join('') + '</div></div>';
  }

  function renderClass(){
    var list = S.data.pathfinders, n = list.length, h = '';
    var avg = n ? (list.reduce(function(s,p){ return s + score(p); }, 0) / n) : 0;
    var full = list.filter(function(p){ return score(p) === TOTAL; }).length;
    var ready = list.reduce(function(s,p){ return s + readyList(p).length; }, 0);
    h += evalBanner();
    h += reviewPanelHTML(reviews(), false);
    h += '<div class="stats">'
      + '<div class="stat"><b>'+n+'</b><span>Pathfinders</span></div>'
      + '<div class="stat"><b>'+avg.toFixed(1)+'</b><span>Class average out of 24</span></div>'
      + '<div class="stat"><b>'+full+'</b><span>Fully complete</span></div>'
      + '<div class="stat'+(ready?' hl':'')+'"><b>'+ready+'</b><span>Missions ready to sign</span></div></div>';
    if (!n){
      h += '<div class="panel"><h2>No Pathfinders yet</h2><p class="muted">Add your class on the Links tab, then send each one their link.</p><button class="btn btn-primary" data-tab="roster" style="width:max-content">Add Pathfinders</button></div>';
      return h;
    }
    var isMap = S.tab === 'map';
    h += '<div class="row"><div class="tabs"><button class="tab" data-tab="class" data-view="cards" aria-selected="'+(!isMap && S.view==='cards')+'">Cards</button><button class="tab" data-tab="class" data-view="grid" aria-selected="'+(!isMap && S.view==='grid')+'">Grid</button><button class="tab" data-tab="map" aria-selected="'+isMap+'">Quest Map</button></div>'
      + '<div class="legend"><span><i class="lg"></i>Not done</span><span><i class="lg wait"></i>Waiting for you</span><span><i class="lg on"></i>Signed off</span><span><i class="lg signed"></i>Mission signed</span></div></div>';
    if (isMap) return h + renderMap();
    h += S.view === 'grid' ? renderGrid(list) : renderCards(list);
    h += renderActivity();
    return h;
  }

  function renderCards(list){
    var sorted = list.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    return '<div class="cards">' + sorted.map(function(p){
      var sc = score(p), rl = readyList(p);
      return '<button class="pcard" data-open="'+esc(p.t)+'"><span class="pc-top"><span class="pc-name">'+esc(p.name)+'</span><span class="pc-score">'+sc+'/24</span></span>'
        + '<span class="bar"><span style="width:'+Math.round(100*sc/TOTAL)+'%"></span></span>'
        + '<span class="pips">' + MISSIONS.map(function(m){ var d = mDone(p,m), full = d === m.tasks.length, sg = p.signs[m.id];
            return '<span class="pip'+(full?' full':'')+'" style="'+mvars(m.id)+'">'+(sg?CHECK:'')+(m.n ? 'M'+m.n : 'Base')+' '+d+'/'+m.tasks.length+'</span>'; }).join('') + '</span>'
        + (reviewsFor(p.t).length ? '<span class="ready wait">⏳ '+reviewsFor(p.t).length+' waiting for you</span>' : '')
        + (rl.length ? '<span class="ready">Ready to sign: '+rl.map(function(m){ return m.n ? 'M'+m.n : 'Base'; }).join(', ')+'</span>' : '')
        + (p.sanct && (p.sanct.attempts || p.sanct.explored) ? '<span class="schip">Sanctuary: '+p.sanct.explored+'/'+(S.data.parts||12)+' explored'+(p.sanct.attempts ? ' · best '+p.sanct.best+(p.sanct.last ? '/'+p.sanct.last.total : '') : '')+'</span>' : '')
        + (p.learn && Object.keys(p.learn).length ? '<span class="schip">Learning Lab: '+Object.keys(p.learn).length+' explorer'+(Object.keys(p.learn).length === 1 ? '' : 's')+' started</span>' : '')
        + (S.data.meetingsTotal ? '<span class="schip">Came to '+attOf(p).came+' of '+S.data.meetingsTotal+' meetings</span>' : '')
        + (advDone(p) ? '<span class="schip">Advanced complete</span>' : (advCount(p) || advReady(p)) ? '<span class="schip">Advanced '+advCount(p)+'/6'+(advReady(p) ? ' · '+advReady(p)+' to sign' : '')+'</span>' : '')
        + '</button>';
    }).join('') + '</div>';
  }

  function renderGrid(list){
    var sorted = list.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    var h = '<div class="gridwrap"><table class="grid"><thead><tr class="grp"><th class="nm" rowspan="2">Pathfinder</th><th rowspan="2" style="background:var(--surface);color:var(--muted);font-size:11px">DONE</th>';
    MISSIONS.forEach(function(m){ h += '<th colspan="'+m.tasks.length+'" style="'+mvars(m.id)+'">'+(m.n ? 'M'+m.n+' · ' : '')+esc(m.name)+'</th>'; });
    h += '</tr><tr class="codes">';
    MISSIONS.forEach(function(m){ m.tasks.forEach(function(c){ h += '<th style="'+mvars(m.id)+'" title="'+esc(REQ[c])+'">'+fmt(c)+'</th>'; }); });
    h += '</tr></thead><tbody>';
    sorted.forEach(function(p){
      h += '<tr><td class="nm"><button data-open="'+esc(p.t)+'">'+esc(p.name)+'</button></td><td class="sc">'+score(p)+'/24</td>';
      MISSIONS.forEach(function(m){
        var sg = !!p.signs[m.id];
        m.tasks.forEach(function(c){
          var on = !!p.done[idx(c)];
          h += '<td style="'+mvars(m.id)+'"><button class="cell'+(on?' on':'')+(on&&sg?' signed':'')+(!on && waiting(p.t, c)?' wait':'')+'" data-tog="'+esc(p.t)+'|'+c+'" aria-pressed="'+on+'" aria-label="'+esc(p.name)+', '+fmt(c)+(on?', done':', not done')+'"><span class="box">'+CHECK+'</span></button></td>';
        });
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div><p class="muted" style="font-size:13px">Tap a box to tick or untick it. Tap a name to open that Pathfinder.</p>';
  }

  function renderActivity(){
    var a = S.data.activity || [];
    if (!a.length) return '';
    return fold('activity', '<h2>Recent activity</h2>', '<div class="acts">' + a.map(function(x){
      return '<div class="act"><time>'+esc(when(x.when))+'</time><span><b>'+esc(x.name)+'</b> · '+esc(x.what)+'</span></div>';
    }).join('') + '</div>', false);
  }

  function renderDetail(p){
    var sc = score(p), link = linkFor(p), conf = S.confirm, wl = reviewsFor(p.t), rn = ((S.data.revnotes || {})[p.t]) || {};
    var h = '<button class="back" data-back="1">'+BACK+'Class</button>';
    h += '<section class="dhead"><span class="eyebrow muted">Pathfinder</span><h1>'+esc(p.name)+'</h1>'
      + '<div class="row"><b>'+sc+' of 24 signed off</b><span class="muted" style="font-size:13px">'+(p.updated ? 'Last active '+esc(when(p.updated)) : 'Not started yet')+'</span></div>'
      + '<span class="bar"><span style="width:'+Math.round(100*sc/TOTAL)+'%"></span></span>'
      + '<div class="gchips">'+(wl.length ? '<span class="schip wait">⏳ '+wl.length+' waiting for you</span>' : '')+'<span class="schip">'+signedCount(p)+' of 6 missions signed</span>'+(S.data.meetingsTotal ? '<span class="schip">Came to '+attOf(p).came+' of '+S.data.meetingsTotal+' meetings</span>' : '')+(advDone(p) ? '<span class="schip">Advanced complete</span>' : '')+'</div>'
      + '<label class="field"><span>Personal link</span><span class="linkrow"><input type="text" id="plink" readonly value="'+esc(link)+'"><button class="btn btn-ghost btn-small" data-copy="'+esc(link)+'">Copy</button></span></label>'
      + '<div class="actions"><a class="btn btn-wa btn-small" href="'+esc(waFor(p))+'" target="_blank" rel="noopener">Send on WhatsApp</a>'
      + '<button class="btn '+(conf==='new'?'btn-danger':'btn-ghost')+' btn-small" data-act="newlink">'+(conf==='new' ? 'Tap again: old link stops working' : 'New link')+'</button>'
      + '<button class="btn '+(conf==='remove'?'btn-danger':'btn-ghost')+' btn-small" data-act="remove">'+(conf==='remove' ? 'Tap again to remove '+esc(p.name) : 'Remove')+'</button></div></section>';
    h += reviewPanelHTML(wl, true);
    h += '<h2 class="dsec">Missions</h2><div class="mblocks">';
    MISSIONS.forEach(function(m){
      var d = mDone(p,m), sg = p.signs[m.id], wn = m.tasks.filter(function(c){ return !p.done[idx(c)] && waiting(p.t, c); }).length;
      var meta = sg ? 'Signed' : d === m.tasks.length ? 'Ready to sign' : wn ? '⏳ '+wn+' waiting' : '';
      var head = '<b class="mft">'+(m.n ? 'Mission '+m.n+' · ' : '')+esc(m.name)+'</b><span class="fmeta">'+(sg ? CHECK : '')+d+'/'+m.tasks.length+(meta ? ' · '+meta : '')+'</span>';
      h += fold('d:'+m.id, head, function(){
        var b = '';
        m.tasks.forEach(function(c){
          var on = !!p.done[idx(c)], w = !on && waiting(p.t, c), note = !on && !w ? rn[c] : '';
          b += '<button class="reqrow" data-tog="'+esc(p.t)+'|'+c+'" aria-pressed="'+on+'"><span class="tick">'+CHECK+'</span><span class="rc">'+fmt(c)+'</span><span class="rt">'+esc(REQ[c])
            + (w ? '<small class="rwait">⏳ They asked you to check this. Tap to sign it off.</small>' : note ? '<small class="rnote">Sent back: '+esc(note)+'</small>' : '') + '</span></button>';
        });
        b += '<div class="signbar">' + (sg
          ? '<p class="ok">'+CHECK+'Signed · '+esc(sg)+'</p><button class="btn btn-ghost btn-small" data-sign="'+m.id+'|0">Remove</button>'
          : '<p>'+(d === m.tasks.length ? 'Ready to sign off' : 'Not every part is signed off yet')+'</p><button class="btn btn-primary btn-small" data-sign="'+m.id+'|1">Sign off as '+esc(S.who || 'Counsellor')+'</button>')
          + '</div>';
        return b;
      }, false, 'mblock', mvars(m.id));
    });
    h += '</div><h2 class="dsec">More</h2>';
    h += detailExtrasHTML(p);
    var ans = S.answers[p.t];
    h += fold('d:answers', '<h2>Their answers</h2>'+(ans ? '<span class="fmeta">'+ans.length+'</span>' : ''), function(){
      if (!ans){ loadAnswers(p.t); return '<p class="muted">Loading…</p>'; }
      return (ans.length ? ans.map(function(a){ return '<div class="ans"><b>'+esc(fmtAny(a.code))+' · '+esc(a.q)+'</b><p>'+esc(a.a)+'</p></div>'; }).join('') : '<p class="muted">Nothing typed yet.</p>')
        + '<div class="actions"><button class="btn btn-ghost btn-small" data-act="answers">Refresh</button></div><p class="muted" style="font-size:13px">To change an answer, edit it in the Google Sheet’s Answers tab.</p>';
    }, false);
    return h;
  }

      h += '<tr class="sechead"><td colspan="4">'+esc(sec[1])+'</td></tr>';

      }).join('') + '</div></section>';

  /* ---------- Sanctuary: scores, marking ---------- */
  function effScore(ans){ return ans.filter(function(a){ return a.override === true || (a.override !== false && a.right); }).length; }
  function findAttempt(id){ for (var t in S.attempts){ var l = S.attempts[t] || []; for (var i=0;i<l.length;i++) if (l[i].id === id) return l[i]; } return null; }
  function loadAttempts(t){ call('c_attempts', [S.pin, t], function(res){ S.attempts[t] = res || []; if (S.sanctOpen === t) rerender(); }, function(){ toast('Couldn’t load the challenge results.'); }); }
  function sanctLink(p){ return S.data && S.data.url ? S.data.url + '?t=' + p.t + '&p=s' : ''; }
  function classLinkHTML(pub){
    var msg = 'Guide Quest for our Guide class: missions, the Sanctuary and Learning Lab explorers, and Advanced. Open this link, type your full name once, and your phone remembers you: ' + pub;
    return '<section class="panel" style="border-color:var(--pine)"><h2>Guide Quest · one link for the whole class</h2>'

      + '<span class="linkrow"><input type="text" id="publink" readonly value="'+esc(pub)+'" aria-label="Class link"><button class="btn btn-ghost btn-small" data-copy="'+esc(pub)+'">Copy</button></span>'

  }

  function renderSanct(){
    var p = S.sanctOpen ? find(S.sanctOpen) : null;
    if (p) return renderSanctDetail(p);
    var list = S.data.pathfinders.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    var parts = S.data.parts || 12;
    var took = list.filter(function(x){ return x.sanct && x.sanct.attempts; });
    var avg = took.length ? took.reduce(function(s,x){ return s + x.sanct.best; }, 0) / took.length : 0;
    var pub = S.data.url || '';
    var h = '<div class="stats">'
      + '<div class="stat"><b>'+took.length+'<span style="font-size:16px;color:var(--muted)"> / '+list.length+'</span></b><span>Took the challenge</span></div>'
      + '<div class="stat"><b>'+avg.toFixed(1)+'</b><span>Average best score</span></div>'
      + '<div class="stat"><b>'+list.filter(function(x){ return x.sanct && x.sanct.explored >= parts; }).length+'</b><span>Explored every part</span></div>'

  function aiInline(t){
    return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?![*\w])/g, '$1<i>$2</i>').replace(/\x60([^\x60]+)\x60/g, '<code>$1</code>');
  }
  function aiMd(src){
    var lines = String(src || '').replace(/\r/g, '').split('\n'), out = '', list = '', para = [], table = [];
    function flushPara(){ if (para.length){ out += '<p>' + para.map(aiInline).join('<br>') + '</p>'; para = []; } }
    function flushList(){ if (list){ out += '</' + list + '>'; list = ''; } }
    function flushTable(){
      if (!table.length) return;
      var rows = table.filter(function(r){ return !/^\s*\|?\s*:?-{2,}/.test(r); }).map(function(r){ return r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|'); });
      out += '<div class="aitable"><table>' + rows.map(function(c, i){ var tag = i === 0 ? 'th' : 'td'; return '<tr>' + c.map(function(x){ return '<' + tag + '>' + aiInline(x.trim()) + '</' + tag + '>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
      table = [];
    }
    lines.forEach(function(l){
      var m;
      if (/^\s*\|.*\|\s*$/.test(l)){ flushPara(); flushList(); table.push(l); return; }
      flushTable();
      if (!l.trim()){ flushPara(); flushList(); return; }
      if ((m = l.match(/^\s*#{1,6}\s+(.*)$/))){ flushPara(); flushList(); out += '<h4>' + aiInline(m[1]) + '</h4>'; return; }
      if ((m = l.match(/^\s*[-*•]\s+(.*)$/))){ flushPara(); if (list !== 'ul'){ flushList(); out += '<ul>'; list = 'ul'; } out += '<li>' + aiInline(m[1]) + '</li>'; return; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushPara(); if (list !== 'ol'){ flushList(); out += '<ol>'; list = 'ol'; } out += '<li>' + aiInline(m[1]) + '</li>'; return; }
      flushList(); para.push(l);
    });
    flushPara(); flushList(); flushTable();
    return out;

  function aiSend(text){

  var aiRec = null;
  function aiStopMic(){ if (aiRec){ try { aiRec.stop(); } catch(e){} } aiRec = null; S.ai.listening = false; }
  function aiMic(){
    if (S.ai.listening){ aiStopMic(); rerender(); return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var input = document.getElementById('aiinput');
    if (!SR || S.ai.micBlocked){ S.ai.help = true; rerender(); var t0 = document.getElementById('aiinput'); if (t0) t0.focus(); return; }
    var base = S.ai.draft ? S.ai.draft.replace(/\s*$/, ' ') : '';
    try {
      aiRec = new SR();
      aiRec.lang = navigator.language || 'en-US';
      aiRec.interimResults = true; aiRec.continuous = true;
      aiRec.onresult = function(e){
        var fin = '', interim = '';
        for (var i = 0; i < e.results.length; i++){ if (e.results[i].isFinal) fin += e.results[i][0].transcript; else interim += e.results[i][0].transcript; }
        S.ai.draft = base + fin + interim;
        var t = document.getElementById('aiinput'); if (t){ t.value = S.ai.draft; aiGrow(); }
      };
      aiRec.onerror = function(e){
        if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)){ S.ai.micBlocked = true; S.ai.help = true; }
        aiStopMic(); rerender();
      };
      aiRec.onend = function(){ if (S.ai.listening){ S.ai.listening = false; aiRec = null; rerender(); } };
      aiRec.start();
      S.ai.listening = true; rerender();

  }

  function aiSpeak(i){

  function aiClick(ds){
    if (ds.aisend){ var t = document.getElementById('aiinput'); aiSend(t ? t.value : S.ai.draft); return true; }
    if (ds.aiprompt !== undefined){
      var p = AI_PROMPTS[+ds.aiprompt]; if (!p) return true;
      if (p[2]){ aiSend(p[1]); return true; }
      S.ai.draft = p[1]; rerender();

      if (ta){ ta.focus(); var at = ta.value.indexOf('['); if (at > -1) ta.setSelectionRange(at, ta.value.indexOf(']', at) + 1); aiGrow(); }
      return true;
    }
    if (ds.aimic){ aiMic(); return true; }
    if (ds.aihelp !== undefined){ S.ai.help = ds.aihelp === '1'; rerender(); return true; }
    if (ds.airetry){ S.ai.msgs = S.ai.msgs.filter(function(m){ return m.role !== 'error'; }); rerender(); aiAsk(); rerender(); aiScrollEnd(); return true; }
    if (ds.ainew){ aiStopMic(); if (window.speechSynthesis) window.speechSynthesis.cancel(); S.ai.msgs = []; S.ai.speaking = -1; aiSaveChat(); rerender(); return true; }
    if (ds.aispeak !== undefined){ aiSpeak(+ds.aispeak); return true; }

      var mc = S.ai.msgs[+ds.aicopy]; if (!mc) return true;
      try { navigator.clipboard.writeText(aiPlain(mc.text)).then(function(){ toast('Copied'); }, function(){ toast('Couldn’t copy on this device.'); }); } catch(e){ toast('Couldn’t copy on this device.'); }
      return true;
    }
    if (ds.aiundo){
      var parts = ds.aiundo.split('|'), mu = S.ai.msgs[+parts[0]], a = mu && mu.actions && mu.actions[+parts[1]];
      if (!a || a.undone || a.undoing) return true;
      a.undoing = true; rerender();
      call('c_aiUndo', [S.pin, a.undo, S.who], function(){ a.undoing = false; a.undone = true; aiSaveChat(); toast('Undone'); rerender(); loadOverview(true); },
        function(code, m){ a.undoing = false; rerender(); toast(AI_ERR[aiCode(m)] || 'Couldn’t undo. Try again.'); });
      return true;
    }
    if (ds.aisetup !== undefined){ S.ai.setup = ds.aisetup === '1'; S.ai.keyMsg = ''; rerender(); return true; }
    if (ds.aisave){
      var k = (document.getElementById('aikey') || {}).value || '';
      if (!k.trim()){ S.ai.keyMsg = 'Paste the key first.'; rerender(); return true; }
      S.ai.saving = true; S.ai.keyMsg = ''; rerender();

      return true;
    }
    if (ds.aioff){
      if (S.confirm !== 'aioff'){ S.confirm = 'aioff'; toast('Tap “Switch the Assistant off” again to confirm.'); return true; }
      S.confirm = null;
      call('c_clearAiKey', [S.pin, S.who], function(){ S.ai.status = { ready: false }; toast('The Assistant is switched off'); rerender(); }, function(){ toast('Couldn’t switch it off. Try again.'); });
      return true;
    }
    return false;
  }

        + '<div class="actions"><button class="btn btn-primary btn-small" data-act="pfsave"'+(f.saving ? ' disabled' : '')+'>'+(f.saving ? 'Saving…' : (f.id ? 'Save changes' : 'Add to the plan'))+'</button><button class="btn btn-ghost btn-small" data-act="pfcancel">Cancel</button></div></div>';
    }
    if (!list) h += '<p class="muted">Loading the programme…</p>';
    else {
      var up = list.filter(function(x){ return x.date >= today; }), past = list.filter(function(x){ return x.date < today; }).slice(-3);
      if (!up.length) h += '<p class="muted">Nothing planned yet.</p>';
      h += up.concat(past.length ? [] : []).map(planItemHTML).join('');
      if (past.length) h += '<details><summary class="muted" style="font-size:14px;cursor:pointer">Recent past ('+past.length+')</summary>' + past.map(planItemHTML).join('') + '</details>';
    }

  function planItemHTML(x){

      + (x.bring ? '<p class="needs"><b>Bring:</b> '+esc(x.bring)+'</p>' : '') + (x.notes ? '<p class="needs"><b>Notes:</b> '+esc(x.notes)+'</p>' : '')
      + '<div class="actions"><button class="btn btn-ghost btn-small" data-pfedit="'+esc(x.id)+'">Edit</button><button class="btn btn-ghost btn-small" data-pflog="'+esc(x.id)+'">Log it as a meeting</button>'
      + '<button class="btn '+(S.confirm === 'pfdel:'+x.id ? 'btn-danger' : 'btn-ghost')+' btn-small" data-pfdel="'+esc(x.id)+'">'+(S.confirm === 'pfdel:'+x.id ? 'Tap again to delete' : 'Delete')+'</button></div></div>';

  function savePlan(){
    var f = S.pf; if (!f) return;

      S.pf = null; toast('Saved to the programme'); loadProgramme();

  /* Meetings */
  function mfInit(){ if (!S.mf) S.mf = { date: todayYMD(), title: '', codes: {}, present: {}, tick: true, notes: '', saving: false }; return S.mf; }
  function loadMeetings(){ call('c_meetings', [S.pin], function(res){ S.meets = res || []; if (S.tab === 'meet' && !S.open) rerender(); }, function(){ toast('Couldn’t load the meetings.'); }); }
  function renderMeet(){
    var f = mfInit(), list = S.data.pathfinders.slice().sort(byName), h = '';
    var tokens = list.map(function(p){ return p.t; });
    var nP = list.filter(function(p){ return f.present[p.t]; }).length;
    var picked = Object.keys(REQ).filter(function(c){ return f.codes[c]; });
    h += '<section class="panel" id="logmeeting"><h2>Log a meeting</h2><p class="muted">Write down what the class did and who came. If the box near the bottom is ticked, the requirements you pick are ticked for everyone who came.</p>'
      + '<div class="frow"><label class="field"><span>Date</span><input type="date" id="mf-date" value="'+esc(f.date)+'"></label>'
      + '<label class="field grow"><span>What we did</span><input type="text" id="mf-title" maxlength="200" value="'+esc(f.title)+'" placeholder="e.g. Visited Sister Brown and sang for her"></label></div>'
      + '<div class="field"><span>Requirements covered '+(picked.length ? '· '+picked.length+' picked' : '(optional)')+'</span>' + codePickHTML(f.codes, 'data-mfcode') + '</div>';
    h += '<div class="field"><span>Who came · '+nP+' of '+list.length+'</span>'
      + (list.length ? '<div class="actions"><button class="btn btn-ghost btn-small" data-mfall="1">Everyone</button><button class="btn btn-ghost btn-small" data-mfall="0">No one</button></div><div class="whogrid">'
        + list.map(function(p){ return '<label class="check"><input type="checkbox" data-mfp="'+esc(p.t)+'"'+(f.present[p.t] ? ' checked' : '')+'>'+esc(p.name)+'</label>'; }).join('') + '</div>'
        : '<p class="muted">Add your Guides on the Links tab first.</p>') + '</div>';
    h += '<label class="check"><input type="checkbox" id="mf-tick"'+(f.tick ? ' checked' : '')+'>Tick the picked requirements for everyone who came</label>'
      + '<label class="field"><span>Minutes / notes (optional)</span><textarea id="mf-notes" maxlength="1000" placeholder="e.g. Ben left early. Bring the lashing poles next week.">'+esc(f.notes)+'</textarea></label>'
      + '<p class="muted" style="font-size:13px">'+(f.tick && picked.length && nP ? 'Saving ticks '+picked.map(fmt).join(', ')+' for the '+nP+' Guide'+(nP === 1 ? '' : 's')+' who came.' : 'Saving records the meeting and who came.')+'</p>'
      + '<button class="btn btn-primary" data-act="mfsave" style="width:max-content"'+(f.saving ? ' disabled' : '')+'>'+(f.saving ? 'Saving…' : 'Save the meeting')+'</button></section>';
    var total = S.data.meetingsTotal || 0;
    if (total && list.length){
      var att = list.slice().sort(function(a, b){ return attOf(a).came - attOf(b).came || byName(a, b); });
      h += '<section class="panel"><h2>Attendance · '+total+' meeting'+(total === 1 ? '' : 's')+' logged</h2><div class="acts">' + att.map(function(p){
        var a = attOf(p), pc = Math.round(100 * a.came / total);
        return '<div class="rrow"><span class="nm">'+esc(p.name)+'</span><span class="sc">'+a.came+' of '+total+' · '+pc+'%</span><span class="bar" style="flex:1 1 100%"><span style="width:'+pc+'%"></span></span></div>';
      }).join('') + '</div></section>';
    }
    h += '<section class="panel"><h2>Past meetings</h2>';
    if (!S.meets) h += '<p class="muted">Loading meetings…</p>';
    else if (!S.meets.length) h += '<p class="muted">No meetings logged yet. Your first one will show here.</p>';
    else h += '<div class="acts">' + S.meets.map(function(m){
      var cnt = m.present.filter(function(t){ return tokens.indexOf(t) > -1; }).length || m.present.length;
      return '<div class="meet"><div class="row"><b>'+esc(fmtDay(m.date))+' · '+esc(m.title)+'</b><span class="sc">'+cnt+' came</span></div>'
        + (m.codes.length ? '<div class="gchips">' + m.codes.map(function(c){ var ms = missionOf(c); return '<span class="mtag" style="'+mvars(ms ? ms.id : 'base')+'">'+fmt(c)+'</span>'; }).join('') + '</div>' : '')
        + (m.names ? '<p class="needs">'+esc(m.names)+'</p>' : '')
        + (m.notes ? '<p class="needs"><b>Minutes:</b> '+esc(m.notes)+'</p>' : '')
        + '<div class="row"><span class="muted" style="font-size:12px">Logged by '+esc(m.by || 'a counsellor')+'</span><button class="btn '+(S.confirm === 'mdel:'+m.id ? 'btn-danger' : 'btn-ghost')+' btn-small" data-mdel="'+esc(m.id)+'">'+(S.confirm === 'mdel:'+m.id ? 'Tap again to delete (ticks stay)' : 'Delete')+'</button></div></div>';
    }).join('') + '</div>';
    return h + '</section>';
  }
  function saveMeeting(){
    var f = mfInit();
    var d = document.getElementById('mf-date'), ti = document.getElementById('mf-title'), no = document.getElementById('mf-notes'), tk = document.getElementById('mf-tick');
    if (d) f.date = d.value; if (ti) f.title = ti.value; if (no) f.notes = no.value; if (tk) f.tick = tk.checked;
    if (!ymdDate(f.date)){ toast('Pick the date of the meeting.'); return; }
    if (!f.title.trim()){ toast('Write what the class did first.'); if (ti) ti.focus(); return; }
    var present = S.data.pathfinders.filter(function(p){ return f.present[p.t]; }).map(function(p){ return p.t; });
    if (!present.length){ toast('Tick who came first.'); return; }
    var codes = Object.keys(REQ).filter(function(c){ return f.codes[c]; });
    f.saving = true; rerender();
    call('c_saveMeeting', [S.pin, { date: f.date, title: f.title, codes: codes, present: present, tick: f.tick, notes: f.notes }, S.who], function(res){
      S.mf = null;
      toast('Meeting saved. ' + (res.ticked ? 'Ticked ' + res.ticked + ' box' + (res.ticked === 1 ? '' : 'es') + ' for ' + res.people + ' Guide' + (res.people === 1 ? '' : 's') + '.' : res.present + ' came.'));
      S.meets = null; loadMeetings(); loadOverview(false);
    }, function(code, m){ f.saving = false; rerender(); toast(/bad-date/.test(m) ? 'Pick a valid date.' : /no-title/.test(m) ? 'Write what the class did first.' : 'Couldn’t save the meeting. Try again.'); });
  }

  /* Report */
  function needList(list){
    return Object.keys(REQ).filter(function(c){ return PAPER.indexOf(c) < 0; }).map(function(c){ return { c: c, who: list.filter(function(p){ return !p.done[idx(c)]; }) }; })
      .filter(function(x){ return x.who.length; })
      .sort(function(a, b){ return b.who.length - a.who.length || Object.keys(REQ).indexOf(a.c) - Object.keys(REQ).indexOf(b.c); });
  }
  function classStats(list){
    var n = list.length, total = S.data.meetingsTotal || 0;
    return { n: n, avg: n ? list.reduce(function(s, p){ return s + score(p); }, 0) / n : 0,
      full: list.filter(function(p){ return score(p) === TOTAL; }).length,
      adv: list.filter(advDone).length,
      att: total && n ? Math.round(100 * list.reduce(function(s, p){ return s + attOf(p).came; }, 0) / (total * n)) : null };
  }
  function reportText(){
    var list = S.data.pathfinders.slice().sort(byName), st = classStats(list), L2 = [];
    L2.push('Guide class report · ' + fmtDay(todayYMD(), true));
    if (S.data.evalDate) L2.push('Evaluation: ' + fmtDay(S.data.evalDate, true) + ' (' + untilText(daysUntil(S.data.evalDate)) + ')');
    L2.push(st.n + ' Guides · class average ' + st.avg.toFixed(1) + ' of 24 · ' + st.full + ' finished all 24 · ' + st.adv + ' finished all of Advanced' + (st.att !== null ? ' · attendance ' + st.att + '%' : ''));
    var need = needList(list);
    if (need.length){
      L2.push(''); L2.push('Still needed (most first):');
      need.slice(0, 12).forEach(function(x){ L2.push('• ' + fmt(x.c) + ' ' + REQ[x.c] + ': ' + x.who.length + ' (' + x.who.map(function(p){ return p.name; }).join(', ') + ')'); });
    }
    var pw = PAPER.map(function(c){ return { c: c, n: list.filter(function(p){ return !p.done[idx(c)]; }).length }; }).filter(function(x){ return x.n; });
    if (pw.length){ L2.push(''); L2.push('Paperwork to check and file: ' + pw.map(function(x){ return fmt(x.c) + ' (' + x.n + ')'; }).join(', ')); }
    L2.push(''); L2.push('Each Guide:');
    list.forEach(function(p){
      var a = attOf(p), ms = missing(p), av = advCount(p);
      L2.push('• ' + p.name + ': ' + score(p) + '/24, ' + signedCount(p) + ' of 6 missions signed' + (a.total ? ', came to ' + a.came + ' of ' + a.total + ' meetings' : '')
        + (av ? ', Advanced ' + av + ' of 6' : '') + (ms.length ? '. Still needs ' + ms.map(fmt).join(', ') + '.' : '. All 24 done.'));
    });
    return L2.join('\n');
  }
  function renderReport(){
    var list = S.data.pathfinders.slice().sort(byName), e = S.data.evalDate, h = '';
    h += '<section class="panel"><h2>Evaluation date</h2>' + (e ? '<p><b>'+esc(fmtDay(e, true))+'</b> · '+esc(untilText(daysUntil(e)))+'</p>' : '<p class="muted">Set the date of the class evaluation or investiture. The Class tab then counts down to it.</p>')
      + '<div class="frow"><label class="field"><span>Date</span><input type="date" id="evaldate" value="'+esc(e || '')+'"></label><button class="btn btn-primary btn-small" data-act="evalsave">Save date</button>'
      + (e ? '<button class="btn btn-ghost btn-small" data-act="evalclear">Clear</button>' : '') + '</div></section>';
    if (!list.length) return h + '<section class="panel"><h2>No Guides yet</h2><p class="muted">Add your class on the Links tab first.</p></section>' + foldSections(recordPanelHTML(), 'rec', false);
    var st = classStats(list), phTotal = 0; Object.keys(S.data.photos || {}).forEach(function(k){ phTotal += S.data.photos[k]; });
    h += '<div class="stats"><div class="stat"><b>'+st.avg.toFixed(1)+'</b><span>Class average out of 24</span></div>'
      + '<div class="stat"><b>'+st.full+'<span style="font-size:16px;color:var(--muted)"> / '+st.n+'</span></b><span>Finished all 24</span></div>'
      + '<div class="stat"><b>'+(st.att === null ? '–' : st.att + '%')+'</b><span>'+(st.att === null ? 'Log meetings to see attendance' : 'Average attendance')+'</span></div>'
      + '<div class="stat"><b>'+phTotal+'</b><span>Photos of evidence</span></div></div>';
    h += '<div class="actions"><button class="btn btn-primary btn-small" data-act="repcopy">Copy the report</button>'
      + '<a class="btn btn-wa btn-small" href="https://wa.me/?text='+encodeURIComponent(reportText())+'" target="_blank" rel="noopener">Send the report on WhatsApp</a>'
      + '<button class="btn btn-ghost btn-small" data-act="recjump">Record sheets</button></div>';
    var need = needList(list), showAll = isOpen('needall', false);
    h += fold('r:needs', '<h2>What the class still needs</h2><span class="fmeta">'+need.length+'</span>', function(){
      if (!need.length) return '<p class="ok">'+CHECK+'Every Guide has every lesson requirement signed off.</p>';
      var shown = showAll ? need : need.slice(0, 5);
      return '<p class="muted">Most-needed first. Plan your next meetings from the top of this list. Paperwork is in “Check and file” below.</p><div class="acts">' + shown.map(function(x){
          return '<div class="needrow"><span><b>'+fmt(x.c)+'</b> '+esc(REQ[x.c])+'</span><span class="ncnt">'+x.who.length+' of '+list.length+'</span><span class="nwho">'+x.who.map(function(p){ return esc(p.name); }).join(', ')+'</span></div>';
        }).join('') + '</div>' + (need.length > 5 ? '<button class="btn btn-ghost btn-small" data-fold="needall" aria-expanded="'+showAll+'">'+(showAll ? 'Show the top 5 only' : 'See all '+need.length)+'</button>' : '');
    }, true);
    var pl = paperLeft(list);
    h += fold('r:paper', '<h2>Check and file</h2><span class="fmeta">'+(pl ? pl+' to check' : CHECK+'all filed')+'</span>', function(){ return paperHTML(list); }, true);
    var order = list.slice().sort(function(a, b){ return missing(a).length - missing(b).length || byName(a, b); });
    h += fold('r:guides', '<h2>Each Guide</h2><span class="fmeta">'+list.length+'</span>', function(){ return '<p class="muted">Closest to finishing first. Tap a name to open their page.</p><div class="acts">' + order.map(function(p){
      var a = attOf(p), ms = missing(p), s = p.sanct || {}, l = p.learn || {}, labN = Object.keys(l).filter(function(k){ return l[k].attempts; }).length, av = advCount(p), ar = advReady(p), np = (S.data.photos || {})[p.t] || 0, wn = reviewsFor(p.t).length;
      return '<div class="gitem"><div class="row"><button class="linkish" data-open="'+esc(p.t)+'">'+esc(p.name)+'</button><span class="sc">'+score(p)+'/24</span></div>'
        + '<span class="bar"><span style="width:'+Math.round(100 * score(p) / TOTAL)+'%"></span></span>'
        + '<div class="gchips">'+(wn ? '<span class="schip wait">⏳ '+wn+' waiting for you</span>' : '')+'<span class="schip">'+signedCount(p)+' of 6 missions signed</span>'
        + (a.total ? '<span class="schip">Came to '+a.came+' of '+a.total+'</span>' : '')
        + (av || ar ? '<span class="schip">Advanced '+av+'/6'+(ar ? ' · '+ar+' to sign' : '')+'</span>' : '')
        + (np ? '<span class="schip">'+np+' photo'+(np === 1 ? '' : 's')+'</span>' : '')
        + (s.attempts ? '<span class="schip">Sanctuary best '+s.best+(s.last ? '/'+s.last.total : '')+'</span>' : '')
        + (labN ? '<span class="schip">'+labN+' explorer challenge'+(labN === 1 ? '' : 's')+'</span>' : '') + '</div>'
        + (ms.length ? '<p class="needs"><b>Still needs:</b> '+ms.map(fmt).join(', ')+'</p>' : '<p class="ok">'+CHECK+'All 24 done</p>') + '</div>';
    }).join('') + '</div>'; }, false);
    return h + foldSections(recordPanelHTML(), 'rec', false);
  }

  /* Record sheets */

      + '<div class="frow"><label class="field grow"><span>Guide</span><select id="recwho"><option value="">The whole class ('+list.length+')</option>'

  function openRecord(t, photos){
    S.print = { t: t, photos: photos, data: null, err: '' }; render(); window.scrollTo(0, 0);
    call('c_record', [S.pin, t], function(res){ if (!S.print) return; S.print.data = res; render(); if (photos) loadPrintPhotos(); },
      function(){ if (S.print){ S.print.err = 'Couldn’t load the record sheet. Try again.'; render(); } });
  }
  function loadPrintPhotos(){
    if (!S.print || !S.print.data) return;
    var ids = []; S.print.data.guides.forEach(function(g){ g.photos.forEach(function(x){ if (!S.phData[x.id]) ids.push(x.id); }); });
    S.print.left = ids.length;
    function next(){
      if (!S.print || !ids.length){ if (S.print){ S.print.left = 0; render(); } return; }
      var id = ids.shift();
      call('c_photo', [S.pin, id], function(res){ S.phData[id] = res.data; S.print && (S.print.left = ids.length); render(); next(); }, function(){ next(); });
    }
    next(); next();
  }

      + '<span class="muted" style="font-size:13px">'+(P.err ? esc(P.err) : !d ? 'Loading…' : P.left ? 'Loading photos… '+P.left+' left' : 'Ready to print')+'</span></div>';

    if (!d.guides.length) return h + '<p class="muted">No Guides yet.</p>';

      var n = Object.keys(g.done).filter(function(c){ return g.done[c]; }).length;

        + '<div class="recsum"><b>'+n+' of 24</b> requirements · '+signedCountMap(g.signs)+' of 6 missions signed'+(g.total ? ' · came to '+g.came+' of '+g.total+' meetings' : '')+(d.evalDate ? '<br>Evaluation: '+esc(fmtDay(d.evalDate, true)) : '')+'</div></header>';

        cs.forEach(function(c){ var w = g.when[c]; h += '<tr><td><b>'+fmt(c)+'</b> '+esc(REQ[c])+'</td><td class="rc2">'+(g.done[c] ? '✓' : '')+'</td><td>'+(g.done[c] && w ? esc(fmtMs(w.date)) : '')+'</td><td>'+(g.done[c] && w ? esc(w.by) : '')+'</td></tr>'; });
      });
      h += '</tbody></table>';
      h += '<div class="rgrid"><div><h3>Mission sign-offs</h3>' + MISSIONS.map(function(m){ return '<p>'+(m.n ? 'Mission '+m.n+' · ' : '')+esc(m.name)+': <b>'+esc(g.signs[m.id] || '—')+'</b></p>'; }).join('') + '</div>'
        + '<div><h3>Advanced (optional)</h3>' + ADVC.map(function(c){ var a = g.adv[c] || {}; return '<p>'+esc(ADVN[c][0])+' · '+esc(ADVSHORT[c])+': <b>'+(a.sign ? esc(a.sign) : a.done ? 'done, not signed' : '—')+'</b></p>'; }).join('') + '</div></div>';
      if (P.photos && g.photos.length){
        h += '<h3>Evidence photos</h3><div class="rphotos">' + g.photos.map(function(x){ return '<figure>'+(S.phData[x.id] ? '<img src="'+S.phData[x.id]+'" alt="">' : '<div class="rphold"></div>')+'<figcaption>'+fmtAny(x.code)+(x.caption ? ' · '+esc(x.caption) : '')+'</figcaption></figure>'; }).join('') + '</div>';
      }
      h += '<div class="rsigns">' + (rs.titles || []).map(function(tt){ return '<div class="rsign"><span class="rline"></span><span>'+esc(tt)+'</span><span class="rline short"></span><span>Date</span></div>'; }).join('')
        + '<div class="rsign"><span class="rline"></span><span>Date invested</span></div></div></article>';
    });

      if (S.confirm !== 'remove'){ S.confirm = 'remove'; rerender(); return; }
      S.confirm = null;
      call('c_remove', [S.pin, pr.t, S.who], function(){ S.data.pathfinders = S.data.pathfinders.filter(function(x){ return x !== pr; }); S.open = null; render(); toast(pr.name + ' was removed.'); },
        function(){ toast('Couldn’t remove. Try again.'); rerender(); });
      return;
    }
    if (act === 'add'){
      var ta = document.getElementById('addnames');
      var names = (ta && ta.value || '').split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
      if (!names.length){ if (ta) ta.focus(); toast('Type at least one name.'); return; }
      S.adding = true; rerender();
      call('c_add', [S.pin, names, S.who], function(res){
        S.adding = false;
        toast(res.full ? 'Added ' + res.added + '. The class list is full (150).' : 'Added ' + res.added + ' Pathfinder' + (res.added === 1 ? '' : 's') + '.');
        var t2 = document.getElementById('addnames'); if (t2) t2.value = '';
        loadOverview(false);
      }, function(){ S.adding = false; rerender(); toast('Couldn’t add them. Try again.'); });
      return;
    }
  });

  if (S.pin){
    call('c_login', [S.pin], function(){ loadOverview(false); }, function(code){ S.pin = ''; S.msg = code === 'no-pin' ? '' : (ERR[code] || ''); if (code === 'no-pin') S.mode = 'create'; render(); });
    app.innerHTML = '<div class="cwrap"><div class="topbar"><div class="wordmark">'+COMPASS+'Guide Quest <small>Counsellors</small></div></div><p class="muted">Opening the dashboard…</p></div>';
  } else {
    render();
    call('c_status', [], function(res){ if (res && !res.hasPin){ S.mode = 'create'; render(); } });
  }
})();
</script>

</body>
</html>
