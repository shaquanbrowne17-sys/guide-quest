    return h;
  }

  /* compass bearing trainer */
  var POINTS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  var NAMES = {N:'North',NE:'North-east',E:'East',SE:'South-east',S:'South',SW:'South-west',W:'West',NW:'North-west'};
  function newCompass(){ var t = shuffle([0,45,90,135,180,225,270,315,30,60,120,150,210,240,300,330]).slice(0,5); return { targets: t, round: 0, deg: 0, score: 0, result: '' }; }
  function pointOf(d){ return POINTS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16]; }
  function compassHTML(g){
    if (g.round >= g.targets.length){
      return '<p class="endscore">'+g.score+'<span style="font-size:24px;color:var(--muted)"> / '+g.targets.length+'</span></p><p class="fb'+(g.score===g.targets.length?' ok':'')+'">'+(g.score===g.targets.length?'Spot on every time!':'Practise a few more, then try again.')+'</p><div class="btnrow"><button class="btn btn-ghost" data-act="greset">Play again</button><button class="btn btn-primary" data-tab="challenge">Take the challenge</button></div>';
    }
    var tgt = g.targets[g.round], label = NAMES[pointOf(tgt)] ? NAMES[pointOf(tgt)] + ' (' + tgt + '°)' : tgt + '°';
    var ticks = '';
    for (var a = 0; a < 360; a += 10){ var r1 = a % 90 === 0 ? 108 : a % 30 === 0 ? 114 : 118; var rad = (a - 90) * Math.PI / 180; ticks += '<line x1="'+(150+r1*Math.cos(rad)).toFixed(1)+'" y1="'+(150+r1*Math.sin(rad)).toFixed(1)+'" x2="'+(150+124*Math.cos(rad)).toFixed(1)+'" y2="'+(150+124*Math.sin(rad)).toFixed(1)+'" stroke="currentColor" stroke-width="'+(a%90===0?3:1.5)+'"/>'; }
    var labels = [['N',0],['NE',45],['E',90],['SE',135],['S',180],['SW',225],['W',270],['NW',315]].map(function(p){ var rad = (p[1]-90)*Math.PI/180, r = p[0].length > 1 ? 88 : 92; return '<text x="'+(150+r*Math.cos(rad)).toFixed(1)+'" y="'+(150+r*Math.sin(rad)+6).toFixed(1)+'" text-anchor="middle" font-family="Figtree,sans-serif" font-weight="800" font-size="'+(p[0].length>1?14:20)+'" fill="'+(p[0]==='N'?'#B3202A':'currentColor')+'">'+p[0]+'</text>'; }).join('');
    var h = '<p class="qtext">Point to '+esc(label)+'</p><div class="compass">'
      + '<svg viewBox="0 0 300 300" role="img" aria-label="Compass dial"><circle cx="150" cy="150" r="128" fill="var(--surface2)" stroke="currentColor" stroke-width="3"/>'+ticks+labels
      + '<g id="arrow" transform="rotate('+g.deg+' 150 150)"><path d="M150 46 L164 150 L150 140 L136 150 Z" fill="var(--c)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M150 254 L164 150 L150 160 L136 150 Z" fill="var(--muted)" opacity=".5"/></g><circle cx="150" cy="150" r="7" fill="currentColor"/></svg>'
      + '<span class="deg" id="degread">'+g.deg+'° '+pointOf(g.deg)+'</span>'
      + '<input type="range" min="0" max="359" step="1" value="'+g.deg+'" id="dial" aria-label="Turn the dial">'
      + '<p class="help">Round '+(g.round+1)+' of '+g.targets.length+' · score '+g.score+'</p></div>';
    if (g.result) h += '<div class="feedback '+(g.result==='ok'?'ok':'no')+'"><b>'+(g.result==='ok'?'On target!':'Not quite.')+'</b><p>'+(g.result==='ok'?'That is '+tgt+'°.':'You pointed to '+g.last+'°. '+esc(label)+' is '+(tgt - g.last > 0 && tgt - g.last < 180 || tgt - g.last < -180 ? 'further clockwise' : 'further anticlockwise')+'.')+'</p></div><button class="btn btn-primary" data-act="cnext">Next</button>';
    else h += '<button class="btn btn-primary" data-act="ccheck">Check</button>';
    return h;
  }

  /* ======================= CHALLENGE ======================= */
  function startChallenge(k){
    var pool = shuffle(BANK.filter(function(q){ return q.topic === k; })).slice(0, 8);
    S.ch = { topic: k, qs: pool.map(function(b){ return { b: b, order: shuffle([0,1,2,3].filter(function(i){ return !!b.opts[i]; })) }; }), i: 0, score: 0, answered: false, chosen: null, right: false, done: false, log: [], save: '' };
  }
  function challengeHTML(k){
    if (!S.ch || S.ch.topic !== k) startChallenge(k);
    var ch = S.ch, total = ch.qs.length;
    if (!total) return '<h2>No questions yet</h2><p class="help">Your counsellor hasn’t switched on any questions for this explorer.</p>';
    if (ch.done){
      var pct = ch.score / total, title = ch.score === total ? 'Perfect score!' : pct >= .75 ? 'Great work!' : pct >= .5 ? 'Good start' : 'Keep learning';
      var save = '';
      if (TOKEN) save = ch.save === 'saving' ? '<p class="think">Saving your score…</p>' : ch.save === 'saved' ? '<p class="think" style="color:var(--good)"><b>Saved.</b> Your counsellor can see this score.</p>' : ch.save === 'error' ? '<p class="think" style="color:var(--bad)">Couldn’t save your score. <button class="btn btn-ghost" data-act="resave">Try again</button></p>' : '';
      else if (B.join) save = '<p class="think"><b>Want your counsellor to see this score?</b> Type your name in the box at the top and it saves straight away.</p>';
      var b = best[k];
      return '<span class="eyebrow">Challenge complete</span><div class="endscore">'+ch.score+'<span style="font-size:24px;color:var(--muted)"> / '+total+'</span></div><h2>'+title+'</h2>'+save
        + (b && b.total ? '<p class="think">Your best: <b>'+b.best+' / '+b.total+'</b></p>' : '')
        + '<div class="btnrow"><button class="btn btn-primary btn-grow" data-act="again">Play again</button><button class="btn btn-ghost btn-grow" data-tab="learn">Review the pictures</button></div>';
    }
    var q = ch.qs[ch.i], dis = ch.answered ? ' disabled' : '';
    var h = '<div class="qhead"><span class="eyebrow">Question '+(ch.i+1)+' of '+total+'</span><span class="pill">Score '+ch.score+'</span></div><span class="bar"><span style="width:'+Math.round(100*ch.i/total)+'%"></span></span>';
    h += '<p class="qtext">'+esc(q.b.q)+'</p><div class="opts">' + q.order.map(function(oi, n){
      var cls = ''; if (ch.answered){ if (oi === q.b.correct) cls = ' right'; else if (String(oi) === String(ch.chosen)) cls = ' wrong'; }
      var pid = k === 'pioneers' ? PIDX[q.b.opts[oi]] : '';
      return '<button class="opt'+cls+'" data-ans="'+oi+'"'+dis+'><span class="k">'+'ABCD'[n]+'</span>'+(pid ? pimg(pid, 'ophoto') : '')+esc(q.b.opts[oi])+'</button>';
    }).join('') + '</div>';
    if (ch.answered){
      h += '<div class="feedback '+(ch.right?'ok':'no')+'"><b>'+(ch.right?'Correct!':'Not quite.')+'</b>'+(ch.right?'':'<p>The answer is: <b>'+esc(q.b.opts[q.b.correct])+'</b></p>')+(q.b.why?'<p>'+esc(q.b.why)+'</p>':'')+'</div>'
        + '<button class="btn btn-primary" data-act="next">'+(ch.i+1 < total ? 'Next question' : 'See my score')+'</button>';
    }
    return h;
  }
  function answer(oi){
    var ch = S.ch, q = ch.qs[ch.i]; if (ch.answered) return;
    var right = String(oi) === String(q.b.correct);
    ch.answered = true; ch.chosen = oi; ch.right = right; if (right) ch.score++;
    ch.log.push({ type:'bank', qid: q.b.id, q: q.b.q, chosenIndex: Number(oi), chosen: q.b.opts[Number(oi)], correct: q.b.opts[q.b.correct], right: right });
    render();
  }
  function submitScore(){
    var ch = S.ch; if (!TOKEN || !hasRun() || !ch) return;
    ch.save = 'saving'; render();
    google.script.run
      .withSuccessHandler(function(res){ ch.save = 'saved'; var b = best[ch.topic]; if (res && (!b || res.best > b.best || !b.total)) best[ch.topic] = { best: res.best, total: ch.qs.length }; render(); })
      .withFailureHandler(function(){ ch.save = 'error'; render(); })
      .l_submit(TOKEN, ch.topic, { answers: ch.log });
  }

  /* ======================= GAME KIT (version 14) =======================
     Shared by every new game: hearts, clock, score, stars, sound, dragging,
     and the class top-scores board. Each game is one self-contained panel. */
  var GK_SOUND = true;
  try { GK_SOUND = localStorage.getItem('gq-sound') !== 'off'; } catch (e) {}
  var gkAC = null;
  function gkTone(f1, f2, d, type, vol){
    if (!GK_SOUND) return;
    try {
      gkAC = gkAC || new (window.AudioContext || window.webkitAudioContext)();
      if (gkAC.state === 'suspended') gkAC.resume();
      var o = gkAC.createOscillator(), g = gkAC.createGain(), t = gkAC.currentTime;
      o.type = type || 'triangle'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d);
      g.gain.setValueAtTime(vol || 0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(gkAC.destination); o.start(t); o.stop(t + d + 0.02);

    var host = document.getElementById('gkhost');
    if (host && S.topic && NGAMES[S.topic]) {
      var g = GKI[S.topic] || (GKI[S.topic] = NGAMES[S.topic]());
      host.appendChild(g.el);
    }
    if (!(S.topic && S.big)) stStop();
  }

  /* ======================= RENDER + EVENTS ======================= */
  function render(){
    app.innerHTML = S.topic ? topicHTML(S.topic) : hubHTML();
    document.body.classList.toggle('lock', !!(S.topic && S.big && S.tab === 'learn'));
    afterRender();
  }
  function goTopic(k){ S.topic = k; S.tab = 'learn'; S.sel = ''; S.big = false; S.viaHub = true; render(); window.scrollTo(0, 0); }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && S.big){ S.big = false; render(); } });

  app.addEventListener('click', function(e){
    var w = e.target.closest('[data-w]');
    if (w){ var gm = gstate(S.topic); gm.shown[w.getAttribute('data-w')] = true; render(); return; }
    var b = e.target.closest('button'); if (!b) return;
    var d = b.dataset;
    if (d.topic){ goTopic(d.topic); return; }
    if (d.tab){ S.big = false; S.tab = d.tab; if (d.tab === 'challenge' && S.ch && S.ch.done) startChallenge(S.topic); render(); window.scrollTo(0, 0); return; }
    if (d.card){ S.sel = d.card; S.big = true; S.tab = 'learn'; markSeen(S.topic, d.card); render(); return; }
    if (d.face){ var fg = S.face; if (!fg || fg.pick) return; fg.pick = d.face; if (d.face === fg.r[fg.i].id) fg.score++; render(); return; }
    if (d.find){
      var ff = S.find[S.topic]; if (!ff || ff.hit) return;
      if (d.find === ff.order[ff.i]){
        ff.hit = d.find; ff.wrong = ''; if (!ff.missed) ff.score++; render();
        setTimeout(function(){ ff.hit = ''; ff.missed = false; ff.i++; if (S.tab === 'game') render(); }, 700);
      } else { ff.wrong = d.find; ff.missed = true; render(); }
      return;
    }
    if (d.ans !== undefined){ answer(d.ans); return; }
    if (d.order !== undefined){
      var G = L[S.topic].game, g = gstate(S.topic), next = G.items[g.done.length];
      if (d.order === next){ g.done.push(next); g.wrong = ''; } else g.wrong = d.order;
      render(); return;
    }
    if (d.pack !== undefined){ var gp = gstate(S.topic); gp.picked[d.pack] = !gp.picked[d.pack]; gp.checked = false; render(); return; }
    if (d.mem !== undefined){ var gmm = gstate(S.topic); gmm.level = +d.mem; gmm.shown = {}; render(); return; }
    switch (d.act){
      case 'hub': S.topic = ''; S.ch = null; S.big = false; render(); window.scrollTo(0, 0); break;
      case 'findagain': S.find[S.topic] = newFind(S.topic); render(); break;
      case 'close': S.big = false; render(); break;
      case 'facenext': S.face.i++; S.face.pick = ''; render(); break;
      case 'faceagain': S.face = newFace(); render(); break;
      case 'greset': S.game[S.topic] = newGame(S.topic); if (L[S.topic].game.type === 'memorise') S.game[S.topic].level = gstate(S.topic).level; render(); break;
      case 'packcheck': gstate(S.topic).checked = true; render(); break;
      case 'ccheck':
        var gc = gstate(S.topic), tgt = gc.targets[gc.round], diff = Math.abs(((gc.deg - tgt) % 360 + 540) % 360 - 180);
        gc.last = gc.deg; gc.result = diff <= 7 ? 'ok' : 'no'; if (gc.result === 'ok') gc.score++; render(); break;
      case 'cnext': var gn = gstate(S.topic); gn.round++; gn.result = ''; render(); break;
      case 'next':
        S.ch.i++; S.ch.answered = false; S.ch.chosen = null; S.ch.right = false;
        if (S.ch.i >= S.ch.qs.length){ S.ch.done = true; submitScore(); }
        render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
      case 'again': startChallenge(S.topic); render(); break;
      case 'resave': submitScore(); break;
      case 'nojoin': joinShown = false; render(); break;
      case 'notme':
        try { localStorage.removeItem(JOINKEY); } catch(err){}
        TOKEN = ''; B.name = ''; seen = {}; best = {}; joinShown = true; joinMsg = ''; render(); window.scrollTo(0, 0); break;
    }
  });
  app.addEventListener('change', function(e){
    var t = e.target;
    if (t.dataset && t.dataset.match !== undefined){ gstate(S.topic).picks[t.dataset.match] = t.value; render(); }
  });
  app.addEventListener('input', function(e){
    var t = e.target;
    if (t.id === 'dial'){
      var g = gstate(S.topic); g.deg = +t.value;
      var ar = document.getElementById('arrow'); if (ar) ar.setAttribute('transform', 'rotate('+g.deg+' 150 150)');
      var rd = document.getElementById('degread'); if (rd) rd.textContent = g.deg + '° ' + pointOf(g.deg);
    }
  });
  app.addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('joinname'), name = String(inp && inp.value || '').replace(/\s+/g, ' ').trim();
    if (name.length < 2){ joinMsg = 'Type your first and last name.'; render(); return; }
    if (!hasRun()){ joinMsg = 'Saving only works from the class link.'; render(); return; }
    joinBusy = true; joinMsg = ''; render();
    google.script.run
      .withSuccessHandler(function(me){ adopt(me); })
      .withFailureHandler(function(err){ var m = String(err && err.message || err), code = (m.match(/bad-name|full|busy/) || [''])[0]; joinBusy = false; joinMsg = JOIN_ERR[code] || 'Couldn’t save. Check your internet and try again.'; render(); })
      .l_join(name);
  });

  if (TOKEN){
    try { localStorage.setItem(JOINKEY, TOKEN); } catch(e){}
  } else if (B.join && hasRun()){
    var remembered = '';
    try { remembered = localStorage.getItem(JOINKEY) || ''; } catch(e){}
    if (remembered){
      google.script.run
        .withSuccessHandler(function(me){ adopt(me); })
        .withFailureHandler(function(){ try { localStorage.removeItem(JOINKEY); } catch(e){} joinShown = true; render(); })
        .l_whoami(remembered);
    } else joinShown = true;
  }
  render();
})();
</script>
<script>if (!window.__gqRouted) gqStart({"p": "learn"});</script>
