  var X16 = {"L": {"hiv": {"icon": "🎗️", "c": "#9B2C5A", "intro": "God’s good plan for sex and waiting, the short names to remember, and the true facts about HIV, AIDS and other infections.", "cards": [{"id": "hv_plan", "t": "God’s good plan", "p": ["God made us male and female, and He called it “very good” (Genesis 1:31).", "Our bodies and our sexuality are part of God’s good design. They are not dirty or shameful.", "God made sex for a husband and wife who have promised their lives to each other.", "Inside marriage, it brings a couple close and keeps them together.", "Outside God’s plan, it can bring hurt, infections and a baby before you are ready.", "God’s rules about sex come from love. He wants the best for you."], "m": "God’s gift, in God’s timing.", "v": ["Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh.", "Genesis 2:24"]}, {"id": "hv_wait", "t": "Why wait?", "p": ["It protects your body: Waiting is the surest way to avoid HIV, other STIs and pregnancy before you are ready.", "It protects your heart: You don’t get used or hurt, and you don’t carry regrets.", "It protects your future: You stay free to focus on school, friends, your faith and your dreams.", "It’s a gift to your future husband or wife: And to yourself.", "It’s never too late to start: If you’ve made mistakes, God forgives and gives a fresh start (1 John 1:9)."], "m": "Not “no forever”: “yes, at the right time”.", "v": ["What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own?", "1 Corinthians 6:19"]}, {"id": "hv_abbr", "t": "The short names", "p": ["HIV: Human Immunodeficiency Virus: the virus that weakens the body’s defences.", "AIDS: Acquired Immune Deficiency Syndrome: the late stage of HIV if it isn’t treated.", "STI: Sexually Transmitted Infection: an infection passed on through sex. It used to be called STD.", "ART: Antiretroviral Therapy: the daily medicine that keeps HIV under control.", "HPV: Human Papillomavirus: an STI. A vaccine protects against the types that cause most cervical cancer.", "CD4: CD4 cells: white blood cells that lead the body’s defence. HIV attacks them."], "m": "HIV = Human Immunodeficiency Virus. AIDS = Acquired Immune Deficiency Syndrome."}, {"id": "hv_what", "t": "What are HIV and AIDS?", "p": ["Follow what HIV does if it is never treated.", "HIV gets into the blood.", "It attacks the CD4 cells that lead the body’s defence (immune) system.", "Over several years, more and more CD4 cells are lost.", "The body can no longer fight off other illnesses. This late stage is called AIDS.", "With ART, this does not have to happen. Most people who take it never get AIDS.", "HIV and AIDS are not the same thing. Treatment makes the difference."], "m": "HIV is the virus. AIDS is the late stage without treatment."}, {"id": "hv_spread", "t": "How HIV is passed on", "p": ["Through sex: Sex with someone who has HIV. HIV is in semen, vaginal fluids and blood.", "Through blood: Sharing needles, or anything that cuts the skin, like razors or tattoo tools.", "From mother to baby: During pregnancy, birth or breastfeeding. Treatment almost always stops this.", "Only a test can tell: Most people with HIV look and feel well, so you can’t tell by looking."], "m": "Three ways: sex, blood, mother to baby."}, {"id": "hv_not", "t": "How HIV is NOT passed on", "p": ["Hugs and handshakes?: Safe. HIV is not passed on by touching.", "Sharing cups or food?: Safe. HIV is not passed on by saliva on cups, plates or food.", "Toilets and pools?: Safe. HIV can’t spread through toilet seats or swimming water.", "Mosquito bites?: Safe. HIV can’t live or multiply inside mosquitoes."], "m": "Everyday contact is safe.", "v": ["And Jesus, moved with compassion, put forth his hand, and touched him, and saith unto him, I will; be thou clean.", "Mark 1:41"]}, {"id": "hv_sti", "t": "Other STIs", "p": ["HIV is not the only infection passed on through sex.", "Others include chlamydia, gonorrhoea, syphilis, herpes and HPV.", "Many have no signs at first, so people pass them on without knowing.", "Some can be cured with medicine. Others, like herpes, can be treated but not cured.", "The HPV vaccine protects against the types of HPV that cause most cervical cancer.", "Only a test can tell. And waiting protects you from all of them."], "m": "No signs does not mean no infection."}, {"id": "hv_test", "t": "Testing and treatment", "p": ["Get tested: A test is the only way to know. It is quick and private.", "Start ART: Medicine taken every day keeps the virus very low, so the body stays strong.", "Live well: People with HIV who take their medicine can live long, healthy lives.", "Protect babies: Treatment in pregnancy almost always stops HIV passing to the baby."], "m": "Test to know. Treatment works."}, {"id": "hv_strong", "t": "Standing strong", "p": ["Know your answer: “No. I’m waiting.” Practise saying it.", "Choose friends who share your values: They make it easier to stand firm.", "Stay out of risky situations: Being alone together with no adults, or parties with alcohol.", "Ask God for strength: He always makes a way to escape (1 Corinthians 10:13).", "Tell a trusted adult: If anyone pressures you or touches you in a way that is wrong, it is not your fault."], "m": "Decide before the moment, not in it.", "v": ["There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.", "1 Corinthians 10:13"]}, {"id": "hv_care", "t": "Compassion and help", "p": ["Love, not fear: People living with HIV deserve love and respect, not gossip.", "Like Jesus: He touched the man with leprosy that everyone else avoided (Mark 1:41).", "Keep it private: A person’s health is their own business.", "Get answers: A parent, your counsellor, your pastor, or a nurse at a health centre can help in private."], "m": "Kindness, not shame.", "v": ["Bear ye one another’s burdens, and so fulfil the law of Christ.", "Galatians 6:2"]}], "game": {"type": "match", "title": "Match the short names", "help": "Match each short name to what it stands for.", "pairs": [["HIV", "Human Immunodeficiency Virus"], ["AIDS", "Acquired Immune Deficiency Syndrome"], ["STI", "Sexually Transmitted Infection"], ["ART", "Antiretroviral Therapy"], ["HPV", "Human Papillomavirus"], ["CD4", "The cells HIV attacks"]]}}, "visit": {"icon": "🏡", "c": "#B5452C", "intro": "How to visit a shut-in or help a family in need, so your visit really helps.", "cards": [{"id": "vs_why", "t": "Why we serve", "p": ["Jesus spent His days with people others forgot.", "He noticed people in need: the sick, the lonely and the poor.", "He stopped, touched them and helped (Mark 1:41).", "He said that when we help the least of these, we help Him (Matthew 25:40).", "Now we are His hands and feet.", "CO 1: visit a shut-in, adopt a person or family in need, or another outreach your leader approves."], "m": "Serving them is serving Jesus.", "v": ["And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.", "Matthew 25:40"]}, {"id": "vs_plan", "t": "Plan the visit", "p": ["Ask first: Your leader sets a day and time that suits them.", "Go as a group, with an adult: Never visit a stranger’s home on your own.", "Bring something small: Fruit, a card the class made, or a meal if the family needs one.", "Prepare a song and a short Bible promise: Choose a hymn they may know."], "m": "Plan it, then go together."}, {"id": "vs_arrive", "t": "When you arrive", "p": ["Greet everyone by name and smile: Say who you are.", "Sit at their eye level: Standing over someone in a bed or chair feels unfriendly.", "Face them and speak clearly: Many older people hear better when they can see your face.", "Phones away: Give them your full attention."], "m": "Smile, greet, sit low, phones away."}, {"id": "vs_listen", "t": "Listen more than you talk", "p": ["A good question to ask: “What was Guyana like when you were young?”", "They repeat a story: Listen kindly anyway. It matters to them.", "They share something private: Keep it private. Don’t pass it on.", "They are sad or lonely: Sit with them, listen, and offer to pray."], "m": "Two ears, one mouth.", "v": ["Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath:", "James 1:19"]}, {"id": "vs_help", "t": "Help with a real job", "p": ["Clean and tidy: Sweep, wash dishes or weed the yard. Ask before you move anything.", "Run errands: Bring groceries or medicine, with an adult.", "Small repairs: Only with an adult and safe tools.", "Read to them: A Bible passage, the news or a letter."], "m": "Ask first, then help."}, {"id": "vs_close", "t": "Close well, and come back", "p": ["Sing together: Your song can be the highlight of their week.", "Ask if you may pray with them: Keep it short and personal.", "Don’t stay too long: About 30 to 45 minutes is enough for someone who is unwell.", "Follow up: Send a card, call or visit again. Adopting a family means helping more than once."], "m": "Keep it short, keep your promise."}], "game": {"type": "order", "title": "Put the visit in order", "help": "Tap the steps of a good visit in order.", "items": ["Plan it with your leader", "Greet them by name", "Sit at eye level and listen", "Help with a real job", "Sing and pray", "Plan your next visit"]}}, "witness": {"icon": "💬", "c": "#1F6F8B", "intro": "How to share Jesus with other teens: be a real friend, listen, tell your story and invite them.", "cards": [{"id": "wt_friend", "t": "Friend first", "p": ["People listen to their friends. So start there.", "Notice someone: a classmate who sits alone, a teammate, a neighbour.", "Be friendly every day: talk, listen, help.", "Pray for them by name.", "Trust grows. They see how you live.", "When the moment comes, they are ready to hear about Jesus.", "CO 2: talk about witnessing as a class, then put it into practice."], "m": "Be a friend first. Then share.", "v": ["A man that hath friends must shew himself friendly: and there is a friend that sticketh closer than a brother.", "Proverbs 18:24"]}, {"id": "wt_listen", "t": "Listen and talk", "p": ["What do good listeners do?: They look at you, don’t interrupt, and ask questions.", "A good question to ask: “What’s been the hardest thing this week?”", "What not to do: Preach at them, argue, or make fun of what they believe.", "What makes people listen?: Respect and kindness."], "m": "Listen first, speak with grace.", "v": ["Let your speech be alway with grace, seasoned with salt, that ye may know how ye ought to answer every man.", "Colossians 4:6"]}, {"id": "wt_story", "t": "Your story in three parts", "p": ["Before: What your life was like before you knew Jesus well, or a time you struggled.", "How: How Jesus met you: a moment, a prayer, a person.", "Now: What is different now.", "Keep it short and real: About a minute or two. Practise it."], "m": "Before, how, now. About a minute.", "v": ["But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:", "1 Peter 3:15"]}, {"id": "wt_plan", "t": "A plan for one friend", "p": ["Choose one friend: Write their first name in your app.", "Pray for them every day", "Invite them to something fun: Pathfinders, a camp-out, a youth programme or a sports day.", "Share when they ask: Answer honestly. “I don’t know, but I’ll find out” is fine."], "m": "One name, one prayer, one invitation."}, {"id": "wt_barriers", "t": "What gets in the way", "p": ["“I’m scared they’ll laugh.”: Start small: invite, don’t preach.", "“I don’t know enough.”: Share your own story. You are the expert on that.", "“They think church is boring.”: Invite them to something active first, like a camp-out.", "“They were hurt by church people.”: Listen, say you’re sorry it happened, and show them Jesus is different."], "m": "Invite, don’t preach."}, {"id": "wt_invite", "t": "Invite a decision", "p": ["When your friend is interested…", "Ask: “Would you like to know Jesus better?”", "Invite them to a Bible study or a youth programme.", "Offer to pray with them.", "Keep being their friend, whatever they decide.", "The Holy Spirit changes hearts. Your part is to be a friend and invite."], "m": "Invite, don’t pressure.", "v": ["No man can come to me, except the Father which hath sent me draw him: and I will raise him up at the last day.", "John 6:44"]}], "game": {"type": "order", "title": "Friend first", "help": "Tap the steps in order.", "items": ["Notice someone", "Be friendly every day", "Pray for them by name", "Share your story", "Invite them to something", "Keep being their friend"]}}, "choices": {"icon": "🛤️", "c": "#0E5E73", "intro": "Four big choices: your career, your values, dating, and a life partner. Think them through with God.", "cards": [{"id": "ch_gifts", "t": "Your gifts and interests", "p": ["What are gifts?: Things God made you good at: fixing things, caring, numbers, music, speaking…", "What are interests?: Things you enjoy so much you lose track of time.", "What does the world need?: Look for where your gifts and interests meet a real need.", "Ask God to guide you: He promises to direct your paths."], "m": "Gifts + interests + a real need.", "v": ["In all thy ways acknowledge him, and he shall direct thy paths.", "Proverbs 3:6"]}, {"id": "ch_path", "t": "Paths to a career", "p": ["Do your best in school now: Your CSEC subjects open or close doors later.", "Talk to people: Ask a nurse, mechanic, teacher or engineer what their work is really like.", "Try it: Volunteer, shadow someone, or earn an honour in that area.", "Plan the training: University, technical institute, an apprenticeship or a trade."], "m": "Learn, ask, try, train."}, {"id": "ch_test", "t": "Making moral choices", "p": ["Is it right?: Does it go against what God says in the Bible?", "Would I be happy if Jesus were with me?: He is.", "What will it do tomorrow?: To me, and to other people.", "Would I be happy for my family to know?: If you want to hide it, think again."], "m": "Right? Jesus? Tomorrow? Family?"}, {"id": "ch_why", "t": "Why God gives limits", "p": ["God’s commandments are like guard rails on a mountain road.", "Guard rails don’t stop the journey.", "They keep you from going over the edge.", "God gives His commandments because He loves us.", "Living by them brings freedom, not fear.", "We keep them because we love Him."], "m": "Guard rails, not cages.", "v": ["If ye love me, keep my commandments.", "John 14:15"]}, {"id": "ch_dating", "t": "Dating with respect", "p": ["Take your time: There’s no rush. Friendship comes first.", "Go out in groups: It’s safer, and often more fun.", "Set your limits before: Decide your boundaries before you are in the moment.", "“No” means no: Respect the other person’s no, and expect yours to be respected.", "Involve your parents: A good relationship doesn’t need to be hidden."], "m": "Take your time. Set limits before.", "v": ["Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.", "1 Timothy 4:12"]}, {"id": "ch_flags", "t": "Green flags and red flags", "p": ["Green flag: respect: They respect your faith, your family and your “no”.", "Red flag: pressure: They push you to do things you don’t want, or to keep secrets.", "Green flag: kindness: They are kind to everyone, not just to you.", "Red flag: control: They check your phone, choose your friends or get angry easily."], "m": "Respect is green. Pressure is red."}, {"id": "ch_partner", "t": "Choosing a life partner", "p": ["Shared faith: Someone who loves God too.", "Character: Honest, kind, faithful and hardworking. Looks change; character lasts.", "Friendship: Strong marriages are built on deep friendship.", "God’s timing: The right person is worth waiting for."], "m": "Faith, character, friendship, God’s timing.", "v": ["Be ye not unequally yoked together with unbelievers: for what fellowship hath righteousness with unrighteousness? and what communion hath light with darkness?", "2 Corinthians 6:14"]}], "game": {"type": "match", "title": "Career match", "help": "Match each person to a career that fits.", "pairs": [["Loves fixing engines", "Mechanic or mechanical engineer"], ["Cares for people who are sick", "Nurse or doctor"], ["Good with numbers", "Accountant"], ["Loves teaching younger children", "Teacher"], ["Loves animals", "Vet or farmer"], ["Loves building with wood", "Carpenter"]]}}, "fitness": {"icon": "🏅", "c": "#B03A2E", "intro": "Train safely for a fun run, and know the facts about alcohol, tobacco, vaping and drugs.", "cards": [{"id": "ft_why", "t": "Why train?", "p": ["Your body is God’s temple. Exercise keeps it strong.", "Your heart gets stronger and pumps more blood with each beat.", "Your lungs and blood carry oxygen better.", "You sleep better, think more clearly and feel happier.", "Your muscles and bones get stronger.", "Teens need at least 60 minutes of activity a day."], "m": "At least 60 minutes of activity a day.", "v": ["What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own?", "1 Corinthians 6:19"]}, {"id": "ft_plan", "t": "Build a training plan", "p": ["Start where you are: If running is hard, start with walk–run: run 1 minute, walk 2.", "Build slowly: Add a little more each week, not a lot.", "Rest days count: Your body gets stronger while it rests. Take easy days.", "Keep a record: Date, what you did, how long. HF 2 needs it."], "m": "Start easy, build slowly, rest, record."}, {"id": "ft_safe", "t": "Run safely", "p": ["Warm up for 5 minutes: Walk, then jog slowly.", "Drink water: Before, during and after, especially in Guyana’s heat.", "Run when it’s cooler: Early morning or late afternoon.", "Wear good shoes, run with a buddy: And face the traffic if there is no footpath.", "Cool down and stretch: Walk 5 minutes, then stretch gently."], "m": "Warm up, drink up, cool down."}, {"id": "ft_alcohol", "t": "Alcohol", "p": ["What does alcohol do to the brain?: It slows it down, so judgement, balance and reactions get worse.", "Why is it worse for teens?: The brain keeps developing into the mid-20s, and alcohol can harm it.", "Alcohol and the roads: Drinking and driving causes many crashes and deaths.", "The Adventist choice: Adventists choose not to drink alcohol at all."], "m": "Wine is a mocker.", "v": ["Wine is a mocker, strong drink is raging: and whosoever is deceived thereby is not wise.", "Proverbs 20:1"]}, {"id": "ft_smoke", "t": "Tobacco and vaping", "p": ["What’s in cigarettes?: Nicotine, which is addictive, and thousands of chemicals, many of which cause cancer.", "Is vaping safe?: No. Most vapes contain nicotine, which is addictive and harms the growing brain.", "What does smoking do?: It damages the lungs and heart, and causes cancer. Smoke harms people nearby too.", "Smoking and sport: Smokers get out of breath faster: their blood carries less oxygen."], "m": "Nicotine hooks you. Your lungs pay."}, {"id": "ft_drugs", "t": "Drugs, and saying no", "p": ["Marijuana: It can harm memory, attention and learning in teens, and it can be addictive.", "Pills that aren’t yours: Taking someone else’s medicine can be dangerous.", "Ways to say no: “No thanks, I’m in training.” “Not for me.” Then walk away.", "Choose your friends and places: Stay away from places where drugs are used. Tell a trusted adult if you’re worried."], "m": "“No thanks, I’m in training.”"}], "game": {"type": "match", "title": "Training words", "help": "Match each word to what it means.", "pairs": [["Warm-up", "5 minutes of walking and easy jogging"], ["Cool-down", "Walk, then stretch gently"], ["Rest day", "When your body rebuilds and gets stronger"], ["Training record", "Date, what you did, and how long"], ["Nicotine", "The addictive drug in cigarettes and most vapes"], ["Proverbs 20:1", "Wine is a mocker"]]}}, "teach": {"icon": "🧑‍🏫", "c": "#0A6E66", "intro": "How to plan and teach two honour requirements to Juniors, with your staff mentor.", "cards": [{"id": "tc_mentor", "t": "Work with your mentor", "p": ["Choose the honour together: Pick one you know well, or learn it first.", "Read the honour’s requirements: Choose the two you will teach.", "Set the date and the time you have", "Show your plan: Your mentor checks it and helps you improve it."], "m": "Plan it with your mentor.", "v": ["Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.", "Proverbs 27:17"]}, {"id": "tc_plan", "t": "Plan the lesson", "p": ["Aim: What will the Juniors be able to do at the end?", "Materials: Rope, pictures or real objects, enough for everyone.", "Timing: Plan each part in minutes. Juniors focus best in short chunks.", "Make it active: Plan a game or a hands-on activity."], "m": "Aim, materials, minutes, movement."}, {"id": "tc_teach", "t": "Explain, show, try, check", "p": ["Explain: Say what it is and why it matters, in simple words.", "Show: Demonstrate slowly, where everyone can see.", "Let them try: Everyone practises while you walk round and help.", "Check: Each Junior shows you they can do it."], "m": "Explain, show, try, check."}, {"id": "tc_kids", "t": "Teaching Juniors", "p": ["How long can Juniors listen?: Not long. Keep talks short, then switch to doing.", "A Junior looks bored. Now what?: Give them a job: hand out the rope, or be your helper.", "A Junior can’t get it: Stay calm, show again slowly, and praise each try.", "How do you finish?: Review with a quick game and praise what they learned."], "m": "Talk less, do more."}, {"id": "tc_choose", "t": "What to teach", "p": ["Pick requirements that work well for Juniors.", "Hands-on is best: tying a knot, naming leaves, a first-aid step.", "Break it into small steps.", "Use pictures and real objects.", "Plan how they will show you they learned it.", "OL 3: plan and teach at least two requirements of an honour to younger Pathfinders."], "m": "Teach what you know well."}, {"id": "tc_after", "t": "After you teach", "p": ["Write what worked: And what you would change.", "Ask your mentor for feedback", "Record it in your app: The honour, the two requirements, the date and your mentor."], "m": "Ask, learn, record."}], "game": {"type": "order", "title": "Teach it in order", "help": "Tap the steps in order.", "items": ["Choose the honour with your mentor", "Pick two requirements", "Write your plan", "Explain", "Show", "Let them try", "Check"]}}, "parable": {"icon": "🍃", "c": "#4A7A2C", "intro": "How Jesus learned from nature as a child (The Desire of Ages, chapter 7), and how to make your own nature parable.", "cards": [{"id": "pb_child", "t": "Jesus as a child", "p": ["Jesus grew up in Nazareth, a small town in the hills of Galilee.", "His mother was His first teacher. He learned the Scriptures from her.", "He was not taught in the schools of the rabbis.", "He learned from the Scriptures, from nature and from the work of His hands.", "He worked as a carpenter (Mark 6:3).", "The Desire of Ages, chapter 7, “As a Child”, tells this story."], "m": "Wisdom, stature, favour.", "v": ["And Jesus increased in wisdom and stature, and in favour with God and man.", "Luke 2:52"]}, {"id": "pb_nature", "t": "Lessons Jesus saw in nature", "p": ["Seeds in a field: Later He told the parable of the sower (Matthew 13).", "The birds: God feeds them, so He will care for us (Matthew 6:26).", "The lilies: God clothes the flowers beautifully, so don’t worry (Matthew 6:28–30).", "The sheep: A good shepherd knows and protects each one (John 10:11)."], "m": "Jesus taught with what people could see.", "v": ["Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?", "Matthew 6:26"]}, {"id": "pb_what", "t": "What is a parable?", "p": ["An earthly story: About something everyone knows: seeds, sheep, bread, a lost coin.", "With a heavenly meaning: It teaches something true about God.", "One main point: A good parable makes one clear lesson.", "Easy to remember: People remember stories longer than lectures."], "m": "An earthly story with a heavenly meaning."}, {"id": "pb_make", "t": "Make your own parable", "p": ["Observe: Watch something closely: ants, a seed sprouting, a river after rain.", "Find the lesson: What does it show about God, or about living for Him?", "Add a Bible text: Find a verse that says the same thing.", "Tell it: Keep it short, and bring the real thing or a picture."], "m": "Observe, lesson, text, tell."}, {"id": "pb_ideas", "t": "Ideas from around you", "p": ["Ants storing food: Work hard and plan ahead (Proverbs 6:6–8).", "A tiny seed growing tall: God’s kingdom grows from small beginnings (Matthew 13:31–32).", "A plant turning to the sun: We grow when we turn to Jesus, the Light (John 8:12).", "A branch on a vine: We bear fruit when we stay joined to Jesus (John 15:5)."], "m": "Look closely. God’s lessons are everywhere.", "v": ["Go to the ant, thou sluggard; consider her ways, and be wise:", "Proverbs 6:6"]}, {"id": "pb_tell", "t": "Telling it to Juniors", "p": ["Bring the real thing: A seed, a leaf, a shell, or a photo.", "Keep it to 3 to 5 minutes", "Ask a question: “What do you think this teaches us?”", "End with your Bible text: And a short prayer."], "m": "Show it, keep it short, ask."}], "game": {"type": "match", "title": "Nature and its lesson", "help": "Match each thing in nature to its lesson.", "pairs": [["Birds being fed", "God takes care of us"], ["A tiny seed growing tall", "Faith grows from small beginnings"], ["A shepherd and sheep", "Jesus knows and protects us"], ["A plant turning to the sun", "We grow by turning to Jesus"], ["Ants storing food", "Work hard and plan ahead"], ["A branch on a vine", "Stay joined to Jesus to bear fruit"]]}, "read": {"r": "da7", "label": "Read The Desire of Ages, chapter 7, here (with Listen)"}}, "honours": {"icon": "🎖️", "c": "#24407A", "intro": "Choose the right new honours: one in a lifestyle area (LE 1) and one toward a Master award (OD 4).", "cards": [{"id": "ho_what", "t": "What is an honour?", "p": ["Its own requirements: Each honour is a skill with its own list of requirements.", "An instructor: Someone qualified teaches it, checks your work and signs it off.", "A patch: When you finish, you get a patch for your sash.", "New means new: For LE 1 and OD 4 it must be an honour you haven’t earned before."], "m": "Learn it, show it, get the patch."}, {"id": "ho_le1", "t": "LE 1: five lifestyle areas", "p": ["Household Arts: Cooking, Baking, Dressmaking, Laundering, Housekeeping.", "Health and Science: First Aid, Nutrition, Chemistry, Temperance.", "Vocational: Carpentry, Computers, Electricity, Plumbing, Masonry.", "Outdoor Industries: Gardening, Agriculture, Poultry Raising, Beekeeping, Dog Care.", "Outreach Ministries: Christian Storytelling, Bible Evangelism, Personal Evangelism, Christian Visitation."], "m": "Home, science, trade, land, outreach."}, {"id": "ho_od4", "t": "OD 4: toward a Master award", "p": ["What is a Master award?: A big award for earning a set of honours in one area.", "Wilderness Master: Includes Backpacking, Camp Craft, Knot Tying, Orienteering and Tents.", "Other Master awards: Such as Aquatic, Recreation and Sportsman.", "Check with your counsellor: They confirm the honour counts toward the award you choose."], "m": "Many honours, one Master award."}, {"id": "ho_choose", "t": "How to choose", "p": ["Pick something you enjoy: You’ll finish it.", "Find an instructor: Someone in your church or community who knows it.", "Look for overlaps: Orienteering counts for OD 4 and the Wilderness Master.", "Plan your time: Most honours take several weeks."], "m": "Enjoy it, find a teacher, plan time."}, {"id": "ho_lab", "t": "Help in the Learning Lab", "p": ["Some explorers here help with honours.", "Orienteering: OD 4 and the Wilderness Master.", "Nutrition: the Nutrition Honour for HF 3.", "Ecology: the Ecology Honour for NS 2.", "Fire & Camp Cooking: toward Fire Building & Camp Cookery.", "Ask your counsellor which honours your club is teaching this year."], "m": "Use the explorers."}, {"id": "ho_record", "t": "Record it", "p": ["Honour name and date", "Your instructor’s name", "A photo of your work: Add it in your app.", "Ask your counsellor to check: Tap “Done – ask my counsellor to check”."], "m": "Name, date, instructor, photo."}], "game": {"type": "match", "title": "Which area?", "help": "Match each honour to its area.", "pairs": [["Baking", "Household Arts"], ["First Aid", "Health and Science"], ["Carpentry", "Vocational"], ["Poultry Raising", "Outdoor Industries"], ["Christian Storytelling", "Outreach Ministries"], ["Orienteering", "Wilderness Master"]]}}, "temperance": {"icon": "⛓️", "c": "#7A2E4A", "intro": "Temperance by Ellen G. White, pages 102–125: how Christ gives the power to break free from harmful habits. Read the pages, explore, then take the 20-question quiz.", "cards": [{"id": "te_why", "t": "What temperance is for", "p": ["The aim (p. 102): Real change happens when Christ’s grace reshapes a person and brings them close to God.", "From the inside (p. 102): Changing your surroundings is not enough. Christ changes the heart, and the actions follow.", "Body and mind (pp. 102–103): Your body is how your mind and character grow, so harmful habits hurt the mind too.", "Self-control (p. 103): Your will, guided by God, is meant to rule your desires, not the other way round."], "m": "Grace reshapes the character.", "v": ["And every man that striveth for the mastery is temperate in all things. Now they do it to obtain a corruptible crown; but we an incorruptible.", "1 Corinthians 9:25"]}, {"id": "te_no", "t": "Say “No” squarely", "p": ["“I’ll stop by degrees” doesn’t work (p. 103): Planning to quit slowly keeps you in the habit’s power.", "Say no clearly (p. 103): Temptation has no power over someone who says no firmly and holds on to Jesus.", "Ask, then believe (p. 103): It may be a hard battle, but ask God for grace and trust Him to give it.", "Stay close to godly friends (p. 104): Ask people who love God to keep you close until you are stronger."], "m": "A clear no, holding on to Jesus.", "v": ["Submit yourselves therefore to God. Resist the devil, and he will flee from you.", "James 4:7"]}, {"id": "te_grace", "t": "Only Christ’s power", "p": ["Where does the power to change come from?", "Promises made in our own strength can’t break a habit (p. 106).", "The only remedy for sin is the grace and power of Christ (p. 106).", "Jesus met every temptation with “It is written”, so use God’s word too (p. 107).", "When you have failed and feel you can’t pray, that is the very time to pray (p. 107).", "Knowing you are safe in Christ even helps your health (p. 108)."], "m": "Christ is the only remedy.", "v": ["Thy word have I hid in mine heart, that I might not sin against thee.", "Psalm 119:11"]}, {"id": "te_will", "t": "The will is the key", "p": ["What the will is (pp. 112–113): Not your feelings: it is your power to choose and decide.", "We can’t change our hearts (p. 112): But we can choose to give our will to God, and He changes us.", "“I can, I will” (p. 113): Don’t say “I can’t”. God has promised His Holy Spirit to help every real effort.", "The weakest prayer is heard (p. 114): Jesus hears even the feeblest prayer."], "m": "You choose; God gives the power.", "v": ["For it is God which worketh in you both to will and to do of his good pleasure.", "Philippians 2:13"]}, {"id": "te_stay", "t": "Staying free", "p": ["Live by the laws of health: Breaking them can create cravings that lead to the liquor habit (p. 115).", "Keep busy with useful work: It protects against temptation (p. 115).", "Don’t make a show of your past: Lean on Christ, not on praise (p. 116).", "Help others who struggle: Helping them helps you stay strong (pp. 116–117)."], "m": "Live healthily, keep busy, help others.", "v": ["There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.", "1 Corinthians 10:13"]}, {"id": "te_stories", "t": "True stories", "p": ["The man in the old blue coat (p. 109): He prayed and struggled all night and won. Six months later he looked ten years younger.", "A man in Australia (p. 118): He gave up tobacco after hearing about Jesus’ self-denial, then gave his life to God.", "A fisherman (pp. 118–119): God helped him give up tobacco and tea. After a headache, his mind grew clearer.", "The man at Capernaum (pp. 122–123): His own choices had enslaved him, but Jesus set him free. No one is too far gone."], "m": "Real people won with God’s help.", "v": ["Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.", "2 Corinthians 5:17"]}, {"id": "te_help", "t": "Help for the tempted", "p": ["If you are struggling right now…", "Jesus invites the weary to find rest in Him (p. 120).", "He was tempted like us, so He understands (p. 120).", "He healed people who had brought sickness on themselves (p. 121).", "God never forces our minds. We choose who rules us, and Christ can free anyone (p. 123).", "Those forgiven most love Him most (p. 125)."], "m": "Jesus knows, heals and frees.", "v": ["For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin.", "Hebrews 4:15"]}], "game": {"type": "order", "title": "The man in the old blue coat", "help": "Tap what happened, in order (pages 108–109).", "items": ["He heard the call to resist in Jesus’ strength", "He stood up and said he would try", "He went home and prayed all night", "By sunrise he had won the battle", "Six months later he came back, looking younger", "He helped others find Christ"]}, "read": {"r": "te", "label": "Pages 102–125: listen to the recorded reading, or open the pages"}}, "story": {"icon": "🛶", "c": "#1F5E7A", "intro": "How the Adventist message came to Guyana, from a tract on a Georgetown wharf to more than 65,000 members. Then read a book on your own church’s history.", "cards": [{"id": "gy_tract", "t": "A tract on the wharf", "p": ["A ship’s captain: Adventist tracts reportedly left on a Georgetown wharf reached a woman named Alberta Alleyne, who began keeping the Sabbath.", "1885: a call for help: More than 20 Sabbath keepers in British Guiana asked the church in Battle Creek, USA, to send help.", "1886: a tract society: Colporteur Thomas E. Amsterdam organised a tract society with branches in Berbice and Demerara.", "The lesson: God used printed pages and ordinary believers before any minister arrived."], "m": "A tract, a Sabbath, a call for help.", "v": ["So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please, and it shall prosper in the thing whereto I sent it.", "Isaiah 55:11"]}, {"id": "gy_first", "t": "The first ministers", "p": ["1887: G. G. Rupert arrives: The General Conference sent him. He reached Georgetown on 31 January 1887.", "1893–1896: the Kneelands: W. G. Kneeland and his wife Mary served for about three years.", "July 1895: a church is organised: Kneeland baptised six members of the Fleming family and organised a church.", "Philip Giddings: A British Guianese believer who graduated from Battle Creek College in 1895 and led the building of a church in New Amsterdam."], "m": "Rupert 1887, Kneeland 1895.", "v": ["And how shall they preach, except they be sent? as it is written, How beautiful are the feet of them that preach the gospel of peace, and bring glad tidings of good things!", "Romans 10:15"]}, {"id": "gy_davis", "t": "Elder Davis and Mount Roraima", "p": ["Far inland, near Mount Roraima, the people asked to be taught about God.", "Elder Ovid E. Davis went to them in 1910 and again in 1911, by boat and on foot.", "He taught them from the Bible, and many chose to follow Jesus.", "He died there of blackwater fever on 31 July 1911, and Chief Jeremiah buried him.", "For years the people met at his grave on Sabbath to sing. In 1922 Chief Jeremiah walked to Georgetown to ask for a teacher.", "In 1925 W. E. Baxter and C. B. Sutton reached the grave, and in 1927 A. W. and Elizabeth Cott began the Mount Roraima mission.", "By the 1980s about 1,500 Adventists lived among the people now called the Davis Indians."], "m": "A seed that fell and grew.", "v": ["Verily, verily, I say unto you, Except a corn of wheat fall into the ground and die, it abideth alone: but if it die, it bringeth forth much fruit.", "John 12:24"]}, {"id": "gy_dmh", "t": "Davis Memorial Hospital", "p": ["1954: a doctor arrives: Dr E. C. Duerksen took charge of the new medical work in Georgetown.", "1955: a name: The hospital was named after Elder Davis and opened at Bel Air.", "1967: a new building: It opened at its present home on D’Urban Street, Georgetown.", "Today: It is linked with Loma Linda University and is supervised by the Caribbean Union Conference."], "m": "Healing in Elder Davis’s name.", "v": ["Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.", "3 John 1:2"]}, {"id": "gy_grow", "t": "Growing up", "p": ["Schools: Mission schools grew at Bethany, Paruima, Kaikan and Waramadong, with more schools in Georgetown, Wismar and elsewhere.", "1971: a Guyanese leader: Wallace W. Weithers became the first Guyanese president of the Guyana Mission.", "1976: a conference: The Guyana Mission became a self-supporting conference, with Roy I. McGarrell as president.", "2019: 170 churches and 65,160 members in Guyana."], "m": "1971, 1976, and 65,000 members.", "v": ["For who hath despised the day of small things? for they shall rejoice, and shall see the plummet in the hand of Zerubbabel with those seven; they are the eyes of the LORD, which run to and fro through the whole earth. shall rejoice", "Zechariah 4:10"]}, {"id": "gy_today", "t": "Where we belong", "p": ["Your local church is part of a worldwide family.", "Your church belongs to the Guyana Conference.", "The Guyana Conference belongs to the Caribbean Union Conference.", "The union belongs to the Inter-American Division, formed in 1922.", "The division is part of the General Conference, the worldwide church.", "Many Guyanese leaders trained at the church’s college in Trinidad, opened in 1927 and now the University of the Southern Caribbean."], "m": "Local church → conference → union → division.", "v": ["And this gospel of the kingdom shall be preached in all the world for a witness unto all nations; and then shall the end come.", "Matthew 24:14"]}, {"id": "gy_book", "t": "Your church history book", "p": ["When did your church begin?: And where did the first members meet?", "Who started it?: Pastors, families, Bible workers.", "How did it grow?: Buildings, schools, evangelism.", "One story you like: Tell it to your class.", "Ask the oldest member: They may remember things no book has."], "m": "When, who, how, a story, a lesson.", "v": ["We will not hide them from their children, shewing to the generation to come the praises of the LORD, and his strength, and his wonderful works that he hath done.", "Psalm 78:4"]}], "game": {"type": "order", "title": "Put the story in order", "help": "Tap the events from first to last.", "items": ["Sabbath keepers ask Battle Creek for help", "G. G. Rupert arrives in Georgetown", "Kneeland organises a church", "Elder Davis dies at Mount Roraima", "The Cotts begin the Roraima mission", "Guyana becomes a conference"]}}}, "V": {"hiv": {"bg": "<defs><linearGradient id=\"xg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FBE9F0\"/><stop offset=\"1\" stop-color=\"#F3D3E0\"/></linearGradient></defs><rect width=\"400\" height=\"300\" fill=\"url(#xg)\"/><path d=\"M200 40c-26 0-40 22-40 44 0 30 26 56 40 96 14-40 40-66 40-96 0-22-14-44-40-44z\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"16\" stroke-linecap=\"round\" opacity=\".18\"/><path d=\"M168 150L120 260M232 150L280 260\" stroke=\"#C0392B\" stroke-width=\"16\" stroke-linecap=\"round\" opacity=\".18\"/>", "pos": {"hv_plan": [14, 20, "💍", "God’s plan"], "hv_wait": [38, 16, "⏳", "Waiting"], "hv_abbr": [62, 16, "🔤", "Short names"], "hv_what": [86, 20, "🦠", "HIV and AIDS"], "hv_spread": [22, 48, "🩸", "How it spreads"], "hv_not": [50, 44, "🤗", "How it doesn’t"], "hv_sti": [78, 48, "⚠️", "Other STIs"], "hv_test": [22, 78, "💊", "Test and treat"], "hv_strong": [50, 74, "💪", "Stand strong"], "hv_care": [78, 78, "🤝", "Compassion"]}, "find": {"hv_plan": "Sex is God’s gift for marriage", "hv_wait": "Waiting is “yes, at the right time”", "hv_abbr": "HIV, AIDS, STI, ART, HPV, CD4", "hv_what": "The virus, and the late stage", "hv_spread": "Blood, sex, mother to baby", "hv_not": "Hugs, cups and mosquitoes are safe", "hv_sti": "Many have no signs at first", "hv_test": "Test to know; treatment works", "hv_strong": "Decide before the moment", "hv_care": "Kindness, not shame"}}, "visit": {"bg": "<defs><linearGradient id=\"xg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FDF1E6\"/><stop offset=\"1\" stop-color=\"#F2D9C2\"/></linearGradient></defs><rect width=\"400\" height=\"300\" fill=\"url(#xg)\"/><rect x=\"120\" y=\"120\" width=\"160\" height=\"120\" fill=\"#F7E3CF\" stroke=\"#C98A5A\" stroke-width=\"4\"/><path d=\"M104 126L200 60L296 126Z\" fill=\"#C0553A\" opacity=\".55\"/><rect x=\"186\" y=\"180\" width=\"30\" height=\"60\" fill=\"#C98A5A\" opacity=\".6\ l": [86, 30, "🗝️", "The will"], "te_stay": [24, 70, "🌱", "Stay free"], "te_stories": [50, 62, "📜", "Stories"], "te_help": [76, 70, "🫂", "Help"]}, "find": {"te_why": "Christ reshapes the character", "te_no": "Not “a little at a time”", "te_grace": "The only remedy", "te_will": "Choose, and God works", "te_stay": "Health, work, humility, helping", "te_stories": "People who broke free", "te_help": "Jesus understands"}}, "story": {"bg": "<defs><linearGradient id=\"xg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#E5F1F6\"/><stop offset=\"1\" stop-color=\"#CFE4EE\"/></linearGradient></defs><rect width=\"400\" height=\"300\" fill=\"url(#xg)\"/><path d=\"M0 230C60 210 120 250 200 228S330 205 400 226V300H0Z\" fill=\"#6FA6C2\" opacity=\".55\"/><path d=\"M250 120L310 40L370 120Z\" fill=\"#7FA36A\" opacity=\".55\"/><path d=\"M60 214h70l-12 12H72z\" fill=\"#8A5A2B\" opacity=\".7\"/>", "pos": {"gy_tract": [16, 28, "📄", "Tracts"], "gy_first": [40, 20, "⛪", "Ministers"], "gy_davis": [64, 20, "⛰️", "Roraima"], "gy_dmh": [86, 30, "🏥", "Hospital"], "gy_grow": [24, 70, "🌱", "Growth"], "gy_today": [50, 62, "🌎", "Today"], "gy_book": [76, 70, "📘", "Your book"]}, "find": {"gy_tract": "Where it began, in the 1880s", "gy_first": "1887 and 1895", "gy_davis": "1910–1911, the Davis Indians", "gy_dmh": "Named after Elder Davis", "gy_grow": "From mission to conference", "gy_today": "Conference, union, division", "gy_book": "What to look for as you read"}}}, "W": {"hv_plan": ["chain", {"start": "God made us male and female, and He called it “very good” (Genesis 1:31).", "steps": [["🎁", "Our bodies and our sexuality are part of God’s good design. They are not dirty or shameful."], ["💍", "God made sex for a husband and wife who have promised their lives to each other."], ["🛡️", "Inside marriage, it brings a couple close and keeps them together."], ["🙏", "Outside God’s plan, it can bring hurt, infections and a baby before you are ready."]], "end": "God’s rules about sex come from love. He wants the best for you."}], "hv_wait": ["steps", [["🛡️", "It protects your body", "Waiting is the surest way to avoid HIV, other STIs and pregnancy before you are ready."], ["❤️", "It protects your heart", "You don’t get used or hurt, and you don’t carry regrets."], ["🎯", "It protects your future", "You stay free to focus on school, friends, your faith and your dreams."], ["💍", "It’s a gift to your future husband or wife", "And to yourself."], ["🌱", "It’s never too late to start", "If you’ve made mistakes, God forgives and gives a fresh start (1 John 1:9)."]]], "hv_abbr": ["flip", [["🦠", "HIV", "Human Immunodeficiency Virus: the virus that weakens the body’s defences."], ["🩺", "AIDS", "Acquired Immune Deficiency Syndrome: the late stage of HIV if it isn’t treated."], ["⚠️", "STI", "Sexually Transmitted Infection: an infection passed on through sex. It used to be called STD."], ["💊", "ART", "Antiretroviral Therapy: the daily medicine that keeps HIV under control."], ["💉", "HPV", "Human Papillomavirus: an STI. A vaccine protects against the types that cause most cervical cancer."], ["🔬", "CD4", "CD4 cells: white blood cells that lead the body’s defence. HIV attacks them."]]], "hv_what": ["chain", {"start": "Follow what HIV does if it is never treated.", "steps": [["🦠", "HIV gets into the blood."], ["🔬", "It attacks the CD4 cells that lead the body’s defence (immune) system."], ["📉", "Over several years, more and more CD4 cells are lost."], ["🤒", "The body can no longer fight off other illnesses. This late stage is called AIDS."], ["💊", "With ART, this does not have to happen. Most people who take it never get AIDS."]], "end": "HIV and AIDS are not the same thing. Treatment makes the difference."}], "hv_spread": ["flip", [["💑", "Through sex", "Sex with someone who has HIV. HIV is in semen, vaginal fluids and blood."], ["💉", "Through blood", "Sharing needles, or anything that cuts the skin, like razors or tattoo tools."], ["🤰", "From mother to baby", "During pregnancy, birth or breastfeeding. Treatment almost always stops this."], ["🔎", "Only a test can tell", "Most people with HIV look and feel well, so you can’t tell by looking."]]], "hv_not": ["flip", [["🤗", "Hugs and handshakes?", "Safe. HIV is not passed on by touching."], ["🥤", "Sharing cups or food?", "Safe. HIV is not passed on by saliva on cups, plates or food."], ["🚽", "Toilets and pools?", "Safe. HIV can’t spread through toilet seats or swimming water."], ["🦟", "Mosquito bites?", "Safe. HIV can’t live or multiply inside mosquitoes."]]], "hv_sti": ["chain", {"start": "HIV is not the only infection passed on through sex.", "steps": [["📋", "Others include chlamydia, gonorrhoea, syphilis, herpes and HPV."], ["🙈", "Many have no signs at first, so people pass them on without knowing."], ["💊", "Some can be cured with medicine. Others, like herpes, can be treated but not cured."], ["💉", "The HPV vaccine protects against the types of HPV that cause most cervical cancer."]], "end": "Only a test can tell. And waiting protects you from all of them."}], "hv_test": ["steps", [["🧪", "Get tested", "A test is the only way to know. It is quick and private."], ["💊", "Start ART", "Medicine taken every day keeps the virus very low, so the body stays strong."], ["🏃", "Live well", "People with HIV who take their medicine can live long, healthy lives."], ["🤰", "Protect babies", "Treatment in pregnancy almost always stops HIV passing to the baby."]]], "hv_strong": ["check", [["🗣️", "Know your answer", "“No. I’m waiting.” Practise saying it."], ["👥", "Choose friends who share your values", "They make it easier to stand firm."], ["🚪", "Stay out of risky situations", "Being alone together with no adults, or parties with alcohol."], ["🙏", "Ask God for strength", "He always makes a way to escape (1 Corinthians 10:13)."], ["🆘", "Tell a trusted adult", "If anyone pressures you or touches you in a way that is wrong, it is not your fault."]]], "hv_care": ["steps", [["❤️", "Love, not fear", "People living with HIV deserve love and respect, not gossip."], ["✝️", "Like Jesus", "He touched the man with leprosy that everyone else avoided (Mark 1:41)."], ["🤐", "Keep it private", "A person’s health is their own business."], ["🏥", "Get answers", "A parent, your counsellor, your pastor, or a nurse at a health centre can help in private."]]], "vs_why": ["chain", {"start": "Jesus spent His days with people others forgot.", "steps": [["👀", "He noticed people in need: the sick, the lonely and the poor."], ["🤲", "He stopped, touched them and helped (Mark 1:41)."], ["🗣️", "He said that when we help the least of these, we help Him (Matthew 25:40)."], ["🧒", "Now we are His hands and feet."]], "end": "CO 1: visit a shut-in, adopt a person or family in need, or another outreach your leader approves."}], "vs_plan": ["check", [["📞", "Ask first", "Your leader sets a day and time that suits them."], ["👥", "Go as a group, with an adult", "Never visit a stranger’s home on your own."], ["🎁", "Bring something small", "Fruit, a card the class made, or a meal if the family needs one."], ["🎵", "Prepare a song and a short Bible promise", "Choose a hymn they may know."]]], "vs_arrive": ["check", [["🙋", "Greet everyone by name and smile", "Say who you are."], ["🪑", "Sit at their eye level", "Standing over someone in a bed or chair feels unfriendly."], ["🗣️", "Face them and speak clearly", "Many older people hear better when they can see your face."], ["📵", "Phones away", "Give them your full attention."]]], "vs_listen": ["flip", [["❓", "A good question to ask", "“What was Guyana like when you were young?”"], ["😊", "They repeat a story", "Listen kindly anyway. It matters to them."], ["🤐", "They share something private", "Keep it private. Don’t pass it on."], ["😢", "They are sad or lonely", "Sit with them, listen, and offer to pray."]]], "vs_help": ["steps", [["🧹", "Clean and tidy", "Sweep, wash dishes or weed the yard. Ask before you move anything."], ["🛒", "Run errands", "Bring groceries or medicine, with an adult."], ["🔧", "Small repairs", "Only with an adult and safe tools."], ["📖", "Read to them", "A Bible passage, the news or a letter."]]], "vs_close": ["check", [["🎶", "Sing together", "Your song can be the highlight of their week."], ["🙏", "Ask if you may pray with them", "Keep it short and personal."], ["⏱️", "Don’t stay too long", "About 30 to 45 minutes is enough for someone who is unwell."], ["💌", "Follow up", "Send a card, call or visit again. Adopting a family means helping more than once."]]], "wt_friend": ["chain", {"start": "People listen to their friends. So start there.", "steps": [["👋", "Notice someone: a classmate who sits alone, a teammate, a neighbour."], ["😊", "Be friendly every day: talk, listen, help."], ["🙏", "Pray for them by name."], ["🤝", "Trust grows. They see how you live."], ["💬", "When the moment comes, they are ready to hear about Jesus."]], "end": "CO 2: talk about witnessing as a class, then put it into practice."}], "wt_listen": ["flip", [["👂", "What do good listeners do?", "They look at you, don’t interrupt, and ask questions."], ["❓", "A good question to ask", "“What’s been the hardest thing this week?”"], ["🚫", "What not to do", "Preach at them, argue, or make fun of what they believe."], ["😇", "What makes people listen?", "Respect and kindness."]]], "wt_story": ["steps", [["⏪", "Before", "What your life was like before you knew Jesus well, or a time you struggled."], ["✝️", "How", "How Jesus met you: a moment, a prayer, a person."], ["🌱", "Now", "What is different now."], ["⏱️", "Keep it short and real", "About a minute or two. Practise it."]]], "wt_plan": ["check", [["📝", "Choose one friend", "Write their first name in your app."], ["🙏", "Pray for them every day", ""], ["🎈", "Invite them to something fun", "Pathfinders, a camp-out, a youth programme or a sports day."], ["📖", "Share when they ask", "Answer honestly. “I don’t know, but I’ll find out” is fine."]]], "wt_barriers": ["flip", [["😳", "“I’m scared they’ll laugh.”", "Start small: invite, don’t preach."], ["🤷", "“I don’t know enough.”", "Share your own story. You are the expert on that."], ["😒", "“They think church is boring.”", "Invite them to something active first, like a camp-out."], ["💔", "“They were hurt by church people.”", "Listen, say you’re sorry it happened, and show them Jesus is different."]]], "wt_invite": ["chain", {"start": "When your friend is interested…", "steps": [["💬", "Ask: “Would you like to know Jesus better?”"], ["📅", "Invite them to a Bible study or a youth programme."], ["🙏", "Offer to pray with them."], ["🤝", "Keep being their friend, whatever they decide."]], "end": "The Holy Spirit changes hearts. Your part is to be a friend and invite."}], "ch_gifts": ["flip", [["🎨", "What are gifts?", "Things God made you good at: fixing things, caring, numbers, music, speaking…"], ["❤️", "What are interests?", "Things you enjoy so much you lose track of time."], ["🌍", "What does the world need?", "Look for where your gifts and interests meet a real need."], ["🙏", "Ask God to guide you", "He promises to direct your paths."]]], "ch_path": ["steps", [["📚", "Do your best in school now", "Your CSEC subjects open or close doors later."], ["🗣️", "Talk to people", "Ask a nurse, mechanic, teacher or engineer what their work is really like."], ["🛠️", "Try it", "Volunteer, shadow someone, or earn an honour in that area."], ["🎓", "Plan the training", "University, technical institute, an apprenticeship or a trade."]]], "ch_test": ["steps", [["📖", "Is it right?", "Does it go against what God says in the Bible?"], ["✝️", "Would I be happy if Jesus were with me?", "He is."], ["🔮", "What will it do tomorrow?", "To me, and to other people."], ["🏠", "Would I be happy for my family to know?", "If you want to hide it, think again."]]], "ch_why": ["chain", {"start": "God’s commandments are like guard rails on a mountain road.", "steps": [["🛣️", "Guard rails don’t stop the journey."], ["⚠️", "They keep you from going over the edge."], ["❤️", "God gives His commandments because He loves us."], ["🙂", "Living by them brings freedom, not fear."]], "end": "We keep them because we love Him."}], "ch_dating": ["check", [["⏳", "Take your time", "There’s no rush. Friendship comes first."], ["👥", "Go out in groups", "It’s safer, and often more fun."], ["🛑", "Set your limits before", "Decide your boundaries before you are in the moment."], ["🙅", "“No” means no", "Respect the other person’s no, and expect yours to be respected."], ["👨‍👩‍👧", "Involve your parents", "A good relationship doesn’t need to be hidden."]]], "ch_flags": ["flip", [["🟢", "Green flag: respect", "They respect your faith, your family and your “no”."], ["🔴", "Red flag: pressure", "They push you to do things you don’t want, or to keep secrets."], ["🟢", "Green flag: kindness", "They are kind to everyone, not just to you."], ["🔴", "Red flag: control", "They check your phone, choose your friends or get angry easily."]]], "ch_partner": ["steps", [["✝️", "Shared faith", "Someone who loves God too."], ["💎", "Character", "Honest, kind, faithful and hardworking. Looks change; character lasts."], ["🤝", "Friendship", "Strong marriages are built on deep friendship."], ["⌛", "God’s timing", "The right person is worth waiting for."]]], "ft_why": ["chain", {"start": "Your body is God’s temple. Exercise keeps it strong.", "steps": [["💓", "Your heart gets stronger and pumps more blood with each beat."], ["🫁", "Your lungs and blood carry oxygen better."], ["🧠", "You sleep better, think more clearly and feel happier."], ["💪", "Your muscles and bones get stronger."]], "end": "Teens need at least 60 minutes of activity a day."}], "ft_plan": ["steps", [["📅", "Start where you are", "If running is hard, start with walk–run: run 1 minute, walk 2."], ["📈", "Build slowly", "Add a little more each week, not a lot."], ["😴", "Rest days count", "Your body gets stronger while it rests. Take easy days."], ["📝", "Keep a record", "Date, what you did, how long. HF 2 needs it."]]], "ft_safe": ["check", [["🔥", "Warm up for 5 minutes", "Walk, then jog slowly."], ["💧", "Drink water", "Before, during and after, especially in Guyana’s heat."], ["🌅", "Run when it’s cooler", "Early morning or late afternoon."], ["👟", "Wear good shoes, run with a buddy", "And face the traffic if there is no footpath."], ["🧊", "Cool down and stretch", "Walk 5 minutes, then stretch gently."]]], "ft_alcohol": ["flip", [["🧠", "What does alcohol do to the brain?", "It slows it down, so judgement, balance and reactions get worse."], ["🧒", "Why is it worse for teens?", "The brain keeps developing into the mid-20s, and alcohol can harm it."], ["🚗", "Alcohol and the roads", "Drinking and driving causes many crashes and deaths."], ["🙅", "The Adventist choice", "Adventists choose not to drink alcohol at all."]]], "ft_smoke": ["flip", [["🚬", "What’s in cigarettes?", "Nicotine, which is addictive, and thousands of chemicals, many of which cause cancer."], ["💨", "Is vaping safe?", "No. Most vapes contain nicotine, which is addictive and harms the growing brain."], ["🫁", "What does smoking do?", "It damages the lungs and heart, and causes cancer. Smoke harms people nearby too."], ["🏃", "Smoking and sport", "Smokers get out of breath faster: their blood carries less oxygen."]]], "ft_drugs": ["steps", [["🌿", "Marijuana", "It can harm memory, attention and learning in teens, and it can be addictive."], ["💊", "Pills that aren’t yours", "Taking someone else’s medicine can be dangerous."], ["🗣️", "Ways to say no", "“No thanks, I’m in training.” “Not for me.” Then walk away."], ["🤝", "Choose your friends and places", "Stay away from places where drugs are used. Tell a trusted adult if you’re worried."]]], "tc_mentor": ["check", [["🧑‍🏫", "Choose the honour together", "Pick one you know well, or learn it first."], ["📄", "Read the honour’s requirements", "Choose the two you will teach."], ["🗓️", "Set the date and the time you have", ""], ["✅", "Show your plan", "Your mentor checks it and helps you improve it."]]], "tc_plan": ["steps", [["🎯", "Aim", "What will the Juniors be able to do at the end?"], ["🧰", "Materials", "Rope, pictures or real objects, enough for everyone."], ["⏱️", "Timing", "Plan each part in minutes. Juniors focus best in short chunks."], ["🎲", "Make it active", "Plan a game or a hands-on activity."]]], "tc_teach": ["steps", [["🗣️", "Explain", "Say what it is and why it matters, in simple words."], ["👐", "Show", "Demonstrate slowly, where everyone can see."], ["🙌", "Let them try", "Everyone practises while you walk round and help."], ["✔️", "Check", "Each Junior shows you they can do it."]]], "tc_kids": ["flip", [["⏰", "How long can Juniors listen?", "Not long. Keep talks short, then switch to doing."], ["😴", "A Junior looks bored. Now what?", "Give them a job: hand out the rope, or be your helper."], ["😢", "A Junior can’t get it", "Stay calm, show again slowly, and praise each try."], ["🎉", "How do you finish?", "Review with a quick game and praise what they learned."]]], "tc_choose": ["chain", {"start": "Pick requirements that work well for Juniors.", "steps": [["🙌", "Hands-on is best: tying a knot, naming leaves, a first-aid step."], ["🧩", "Break it into small steps."], ["🖼️", "Use pictures and real objects."], ["🏁", "Plan how they will show you they learned it."]], "end": "OL 3: plan and teach at least two requirements of an honour to younger Pathfinders."}], "tc_after": ["check", [["📝", "Write what worked", "And what you would change."], ["🗨️", "Ask your mentor for feedback", ""], ["📋", "Record it in your app", "The honour, the two requirements, the date and your mentor."]]], "pb_child": ["chain", {"start": "Jesus grew up in Nazareth, a small town in the hills of Galilee.", "steps": [["👩", "His mother was His first teacher. He learned the Scriptures from her."], ["📜", "He was not taught in the schools of the rabbis."], ["🌄", "He learned from the Scriptures, from nature and from the work of His hands."], ["🪚", "He worked as a carpenter (Mark 6:3)."]], "end": "The Desire of Ages, chapter 7, “As a Child”, tells this story."}], "pb_nature": ["flip", [["🌾", "Seeds in a field", "Later He told the parable of the sower (Matthew 13)."], ["🐦", "The birds", "God feeds them, so He will care for us (Matthew 6:26)."], ["🌸", "The lilies", "God clothes the flowers beautifully, so don’t worry (Matthew 6:28–30)."], ["🐑", "The sheep", "A good shepherd knows and protects each one (John 10:11)."]]], "pb_what": ["steps", [["🌍", "An earthly story", "About something everyone knows: seeds, sheep, bread, a lost coin."], ["✨", "With a heavenly meaning", "It teaches something true about God."], ["🎯", "One main point", "A good parable makes one clear lesson."], ["🧠", "Easy to remember", "People remember stories longer than lectures."]]], "pb_make": ["steps", [["👀", "Observe", "Watch something closely: ants, a seed sprouting, a river after rain."], ["💡", "Find the lesson", "What does it show about God, or about living for Him?"], ["📖", "Add a Bible text", "Find a verse that says the same thing."], ["🎤", "Tell it", "Keep it short, and bring the real thing or a picture."]]], "pb_ideas": ["flip", [["🐜", "Ants storing food", "Work hard and plan ahead (Proverbs 6:6–8)."], ["🌱", "A tiny seed growing tall", "God’s kingdom grows from small beginnings (Matthew 13:31–32)."], ["🌻", "A plant turning to the sun", "We grow when we turn to Jesus, the Light (John 8:12)."], ["🍇", "A branch on a vine", "We bear fruit when we stay joined to Jesus (John 15:5)."]]], "pb_tell": ["check", [["🖼️", "Bring the real thing", "A seed, a leaf, a shell, or a photo."], ["⏱️", "Keep it to 3 to 5 minutes", ""], ["❓", "Ask a question", "“What do you think this teaches us?”"], ["🙏", "End with your Bible text", "And a short prayer."]]], "ho_what": ["steps", [["📋", "Its own requirements", "Each honour is a skill with its own list of requirements."], ["🧑‍🏫", "An instructor", "Someone qualified teaches it, checks your work and signs it off."], ["🧵", "A patch", "When you finish, you get a patch for your sash."], ["🆕", "New means new", "For LE 1 and OD 4 it must be an honour you haven’t earned before."]]], "ho_le1": ["flip", [["🏠", "Household Arts", "Cooking, Baking, Dressmaking, Laundering, Housekeeping."], ["🔬", "Health and Science", "First Aid, Nutrition, Chemistry, Temperance."], ["🛠️", "Vocational", "Carpentry, Computers, Electricity, Plumbing, Masonry."], ["🌾", "Outdoor Industries", "Gardening, Agriculture, Poultry Raising, Beekeeping, Dog Care."], ["📣", "Outreach Ministries", "Christian Storytelling, Bible Evangelism, Personal Evangelism, Christian Visitation."]]], "ho_od4": ["steps", [["🏅", "What is a Master award?", "A big award for earning a set of honours in one area."], ["🏕️", "Wilderness Master", "Includes Backpacking, Camp Craft, Knot Tying, Orienteering and Tents."], ["🏊", "Other Master awards", "Such as Aquatic, Recreation and Sportsman."], ["✅", "Check with your counsellor", "They confirm the honour counts toward the award you choose."]]], "ho_choose": ["check", [["❤️", "Pick something you enjoy", "You’ll finish it."], ["🧑‍🏫", "Find an instructor", "Someone in your church or community who knows it."], ["🔗", "Look for overlaps", "Orienteering counts for OD 4 and the Wilderness Master."], ["📆", "Plan your time", "Most honours take several weeks."]]], "ho_lab": ["chain", {"start": "Some explorers here help with honours.", "steps": [["🧭", "Orienteering: OD 4 and the Wilderness Master."], ["🥗", "Nutrition: the Nutrition Honour for HF 3."], ["🌿", "Ecology: the Ecology Honour for NS 2."], ["🔥", "Fire & Camp Cooking: toward Fire Building & Camp Cookery."]], "end": "Ask your counsellor which honours your club is teaching this year."}], "ho_record": ["check", [["📝", "Honour name and date", ""], ["✍️", "Your instructor’s name", ""], ["📷", "A photo of your work", "Add it in your app."], ["🙋", "Ask your counsellor to check", "Tap “Done – ask my counsellor to check”."]]], "te_why": ["flip", [["🎯", "The aim (p. 102)", "Real change happens when Christ’s grace reshapes a person and brings them close to God."], ["❤️", "From the inside (p. 102)", "Changing your surroundings is not enough. Christ changes the heart, and the actions follow."], ["🧠", "Body and mind (pp. 102–103)", "Your body is how your mind and character grow, so harmful habits hurt the mind too."], ["👑", "Self-control (p. 103)", "Your will, guided by God, is meant to rule your desires, not the other way round."]]], "te_no": ["steps", [["🐢", "“I’ll stop by degrees” doesn’t work (p. 103)", "Planning to quit slowly keeps you in the habit’s power."], ["🛑", "Say no clearly (p. 103)", "Temptation has no power over someone who says no firmly and holds on to Jesus."], ["🙏", "Ask, then believe (p. 103)", "It may be a hard battle, but ask God for grace and trust Him to give it."], ["🤝", "Stay close to godly friends (p. 104)", "Ask people who love God to keep you close until you are stronger."]]], "te_grace": ["chain", {"start": "Where does the power to change come from?", "steps": [["📝", "Promises made in our own strength can’t break a habit (p. 106)."], ["✝️", "The only remedy for sin is the grace and power of Christ (p. 106)."], ["📖", "Jesus met every temptation with “It is written”, so use God’s word too (p. 107)."], ["🙏", "When you have failed and feel you can’t pray, that is the very time to pray (p. 107)."]], "end": "Knowing you are safe in Christ even helps your health (p. 108)."}], "te_will": ["steps", [["🗝️", "What the will is (pp. 112–113)", "Not your feelings: it is your power to choose and decide."], ["🤲", "We can’t change our hearts (p. 112)", "But we can choose to give our will to God, and He changes us."], ["💪", "“I can, I will” (p. 113)", "Don’t say “I can’t”. God has promised His Holy Spirit to help every real effort."], ["👂", "The weakest prayer is heard (p. 114)", "Jesus hears even the feeblest prayer."]]], "te_stay": ["check", [["🥗", "Live by the laws of health", "Breaking them can create cravings that lead to the liquor habit (p. 115)."], ["🛠️", "Keep busy with useful work", "It protects against temptation (p. 115)."], ["🙇", "Don’t make a show of your past", "Lean on Christ, not on praise (p. 116)."], ["🤝", "Help others who struggle", "Helping them helps you stay strong (pp. 116–117)."]]], "te_stories": ["flip", [["🧥", "The man in the old blue coat (p. 109)", "He prayed and struggled all night and won. Six months later he looked ten years younger."], ["🇦🇺", "A man in Australia (p. 118)", "He gave up tobacco after hearing about Jesus’ self-denial, then gave his life to God."], ["🎣", "A fisherman (pp. 118–119)", "God helped him give up tobacco and tea. After a headache, his mind grew clearer."], ["⛓️", "The man at Capernaum (pp. 122–123)", "His own choices had enslaved him, but Jesus set him free. No one is too far gone."]]], "te_help": ["chain", {"start": "If you are struggling right now…", "steps": [["🫂", "Jesus invites the weary to find rest in Him (p. 120)."], ["🧑‍🤝‍🧑", "He was tempted like us, so He understands (p. 120)."], ["🩹", "He healed people who had brought sickness on themselves (p. 121)."], ["🕊️", "God never forces our minds. We choose who rules us, and Christ can free anyone (p. 123)."]], "end": "Those forgiven most love Him most (p. 125)."}], "gy_tract": ["flip", [["⚓", "A ship’s captain", "Adventist tracts reportedly left on a Georgetown wharf reached a woman named Alberta Alleyne, who began keeping the Sabbath."], ["📮", "1885: a call for help", "More than 20 Sabbath keepers in British Guiana asked the church in Battle Creek, USA, to send help."], ["📚", "1886: a tract society", "Colporteur Thomas E. Amsterdam organised a tract society with branches in Berbice and Demerara."], ["💡", "The lesson", "God used printed pages and ordinary believers before any minister arrived."]]], "gy_first": ["steps", [["🚢", "1887: G. G. Rupert arrives", "The General Conference sent him. He reached Georgetown on 31 January 1887."], ["🙏", "1893–1896: the Kneelands", "W. G. Kneeland and his wife Mary served for about three years."], ["💧", "July 1895: a church is organised", "Kneeland baptised six members of the Fleming family and organised a church."], ["🎓", "Philip Giddings", "A British Guianese believer who graduated from Battle Creek College in 1895 and led the building of a church in New Amsterdam."]]], "gy_davis": ["chain", {"start": "Far inland, near Mount Roraima, the people asked to be taught about God.", "steps": [["🛶", "Elder Ovid E. Davis went to them in 1910 and again in 1911, by boat and on foot."], ["📖", "He taught them from the Bible, and many chose to follow Jesus."], ["🕯️", "He died there of blackwater fever on 31 July 1911, and Chief Jeremiah buried him."], ["🎵", "For years the people met at his grave on Sabbath to sing. In 1922 Chief Jeremiah walked to Georgetown to ask for a teacher."], ["🤝", "In 1925 W. E. Baxter and C. B. Sutton reached the grave, and in 1927 A. W. and Elizabeth Cott began the Mount Roraima mission."]], "end": "By the 1980s about 1,500 Adventists lived among the people now called the Davis Indians."}], "gy_dmh": ["flip", [["🩺", "1954: a doctor arrives", "Dr E. C. Duerksen took charge of the new medical work in Georgetown."], ["🏷️", "1955: a name", "The hospital was named after Elder Davis and opened at Bel Air."], ["🏗️", "1967: a new building", "It opened at its present home on D’Urban Street, Georgetown."], ["🌍", "Today", "It is linked with Loma Linda University and is supervised by the Caribbean Union Conference."]]], "gy_grow": ["steps", [["🏫", "Schools", "Mission schools grew at Bethany, Paruima, Kaikan and Waramadong, with more schools in Georgetown, Wismar and elsewhere."], ["🇬🇾", "1971: a Guyanese leader", "Wallace W. Weithers became the first Guyanese president of the Guyana Mission."], ["💪", "1976: a conference", "The Guyana Mission became a self-supporting conference, with Roy I. McGarrell as president."], ["📈", "2019", "170 churches and 65,160 members in Guyana."]]], "gy_today": ["chain", {"start": "Your local church is part of a worldwide family.", "steps": [["⛪", "Your church belongs to the Guyana Conference."], ["🏝️", "The Guyana Conference belongs to the Caribbean Union Conference."], ["🌎", "The union belongs to the Inter-American Division, formed in 1922."], ["🌐", "The division is part of the General Conference, the worldwide church."]], "end": "Many Guyanese leaders trained at the church’s college in Trinidad, opened in 1927 and now the University of the Southern Caribbean."}], "gy_book": ["check", [["📅", "When did your church begin?", "And where did the first members meet?"], ["👥", "Who started it?", "Pastors, families, Bible workers."], ["🏗️", "How did it grow?", "Buildings, schools, evangelism."], ["📖", "One story you like", "Tell it to your class."], ["🙋", "Ask the oldest member", "They may remember things no book has."]]]}, "G": {"hiv": {"gid": "hiv:know", "icon": "🎗️", "title": "Know it, live it", "hearts": 5, "how": "Three different rounds. 1: a memory game with the short names. 2: myth bubbles float up, so pop the myths and let the facts fly. 3: choose God’s plan in real situations. A wrong answer costs a heart.", "end": ["You know it, and you can live it!", "HIV, AIDS, STI, ART, HPV. Myths and facts. And God’s plan: waiting is worth it."], "rounds": [{"type": "memory", "title": "Short-name memory", "help": "Flip two cards at a time. Match each short name with what it stands for. Remember where the cards are!", "pairs": [["HIV", "Human Immunodeficiency Virus"], ["AIDS", "Acquired Immune Deficiency Syndrome"], ["STI", "Sexually Transmitted Infection"], ["ART", "Antiretroviral Therapy"], ["HPV", "Human Papillomavirus"]]}, {"type": "pop", "title": "Pop the myths", "help": "Bubbles float up. Tap to pop the MYTHS. Let the FACTS float away. Don’t pop a fact, and don’t let a myth escape!", "badLabel": "Myth", "goodLabel": "Fact", "items": [["You can get HIV from a hug.", 1, "Hugging, touching and sharing cups don’t pass on HIV."], ["Sharing needles can pass on HIV.", 0, "HIV is in blood, so anything that cuts the skin is risky."], ["Mosquitoes spread HIV.", 1, "HIV can’t live or multiply inside mosquitoes."], ["You can tell who has HIV by looking.", 1, "Most people with HIV look and feel well. Only a test can tell."], ["HIV and AIDS are the same thing.", 1, "HIV is the virus. AIDS is the late stage if HIV is not treated."], ["Many STIs have no signs at first.", 0, "That’s why testing matters."], ["Daily medicine (ART) keeps people with HIV well.", 0, "People on treatment can live long, healthy lives."], ["You can get HIV from a toilet seat.", 1, "HIV does not spread through toilet seats."], ["Washing after sex stops HIV.", 1, "Washing does not prevent HIV or other STIs."], ["Waiting for marriage protects you from STIs.", 0, "With a faithful partner who has also waited. God’s plan protects your body and heart."]]}, {"type": "path", "title": "God’s plan and waiting", "help": "Real situations. Choose the answer that follows God’s plan.", "stops": [{"icon": "💬", "sit": "Someone you’re dating says, “If you really loved me, you would.”", "opts": [["“If you really loved me, you would respect my no.”", 1], ["Give in so they don’t leave you", 0], ["Say “maybe later” to keep them happy", 0]], "why": "Real love is patient and doesn’t push for its own way (1 Corinthians 13:4–5)."}, {"icon": "👥", "sit": "Your friends say everyone your age is having sex.", "opts": [["Know it isn’t true, and stick to your choice to wait", 1], ["Feel you have to catch up", 0], ["Make up stories so you fit in", 0]], "why": "Not everyone is. God’s plan is worth waiting for."}, {"icon": "🎉", "sit": "You’re invited to a party with no adults and lots of alcohol.", "opts": [["Skip it, and plan something fun with friends", 1], ["Go, and just be careful", 0], ["Go and stay late", 0]], "why": "Alcohol makes it much harder to keep the choices you’ve made."}, {"icon": "🙏", "sit": "You made a mistake and feel God could never forgive you.", "opts": [["Confess it to God and start fresh", 1], ["Give up on waiting, since it’s too late", 0], ["Hide it and pretend everything is fine", 0]], "why": "“If we confess our sins, he is faithful and just to forgive us our sins” (1 John 1:9)."}]}]}, "visit": {"gid": "visit:day", "icon": "🏡", "title": "Visit day", "hearts": 4, "how": "Your class is visiting Sister Grace, who can’t leave her house. Round 1: a quick-tap game, so tap the helpful things as they pop up. Round 2: choose well at every step of the visit.", "end": ["What a visit!", "Plan it, greet warmly, listen, help, sing, pray, and come back again."], "rounds": [{"type": "whack", "title": "Helping hands", "help": "You’re at Sister Grace’s house. Things pop up in the windows. Tap the HELPFUL ones fast. Leave the unhelpful ones alone, or you lose a heart.", "count": 16, "items": [["🍽️", "Wash her dishes (ask first)", 1, ""], ["👂", "Listen to her story", 1, ""], ["🎵", "Sing a hymn with her", 1, ""], ["📖", "Read her a psalm", 1, ""], ["🛍️", "Carry in the groceries", 1, ""], ["🌿", "Water her plants", 1, ""], ["💌", "Give her the class card", 1, ""], ["📱", "Scroll on your phone", 0, "Put the phone away. Give her your full attention."], ["🚪", "Walk in without knocking", 0, "Knock, wait, and greet her by name."], ["🗣️", "Talk only about yourself", 0, "Listen more than you talk."], ["📦", "Move her things without asking", 0, "It’s her home. Ask first."], ["🤫", "Spread her private news", 0, "Keep her business private."]]}, {"type": "path", "title": "Visit Sister Grace", "help": "Choose what to do at each step.", "stops": [{"icon": "📞", "sit": "Your class wants to visit Sister Grace, who can’t leave her house. What do you do first?", "opts": [["Ask your leader to call her and set a time", 1], ["Just turn up when you’re free", 0], ["Go alone after school", 0]], "why": "Plan ahead with your leader, and always go as a group with an adult."}, {"icon": "🚪", "sit": "She opens the door slowly and looks unsure.", "opts": [["Smile, greet her by name and say who you are", 1], ["Walk straight in", 0], ["Wait silently for her to speak", 0]], "why": "A warm greeting puts people at ease."}, {"icon": "🪑", "sit": "She sits down in her chair. Where do you sit?", "opts": [["Pull up a chair at her eye level", 1], ["Stand around her chair", 0], ["Sit across the room on your phone", 0]], "why": "Eye level and full attention show respect."}, {"icon": "👂", "sit": "She starts a long story about growing up in Berbice.", "opts": [["Listen, and ask a question about it", 1], ["Change the subject to your news", 0], ["Check your phone until she finishes", 0]], "why": "Listening is one of the kindest gifts you can give."}, {"icon": "🍽️", "sit": "You notice her sink is full of dishes.", "opts": [["Ask if you may wash them for her", 1], ["Pretend you didn’t see", 0], ["Tell her she should keep it cleaner", 0]], "why": "Ask first, then help with a real job."}, {"icon": "🙏", "sit": "It’s time to go.", "opts": [["Sing a hymn, pray briefly and promise to come back", 1], ["Leave without saying goodbye", 0], ["Stay three more hours", 0]], "why": "Close warmly, keep it short, and follow up."}]}]}, "witness": {"gid": "witness:chat", "icon": "💬", "title": "Chat with a friend", "hearts": 3, "how": "Round 1: Jordan, a friend from school, is messaging you. Pick your replies. Kind, honest replies build the friendship; preaching and put-downs cost a heart. Round 2: put a short testimony together.", "end": ["Jordan is coming to Pathfinders!", "Friend first, listen, tell your story, invite, and keep being a friend."], "rounds": [{"type": "chat", "title": "Chat with Jordan", "help": "Pick the best reply each time.", "who": "Jordan", "avatar": "🧑🏾", "lines": [{"them": "Why do you always go to Pathfinders? Isn’t it boring?", "opts": [["It’s actually fun. We camp, cook on fires and do drill. Want to come and see?", 1, "Camping? Ok, that sounds kind of cool."], ["It’s a church thing. You wouldn’t get it.", 0, "Wow. Ok
