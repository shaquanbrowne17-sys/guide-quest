<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Learning Lab</title>
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@1,7..72,400;1,7..72,500&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --linen:#F5F3EE; --surface:#FFFFFF; --surface2:#ECE8DF; --ink:#1D1B2B; --muted:#5C596D; --line:#DEDAD0;
  --primary-bg:#2B4C8C; --primary-fg:#FFFFFF; --good:#1E7A46; --good-soft:#DDF0E3; --bad:#B3261E; --bad-soft:#FBE4E1;
  --tip:#FBEFCB; --tip-ink:#6B4A00;
  --shadow:0 1px 2px rgba(29,27,43,.06),0 10px 30px rgba(29,27,43,.08);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --scripture:'Literata',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --linen:#13121C; --surface:#1D1C2A; --surface2:#2A2939; --ink:#ECEAF4; --muted:#A8A5BB; --line:#34324A;
    --primary-bg:#9DB5EE; --primary-fg:#13121C; --good:#62D092; --good-soft:#173826; --bad:#FF8F84; --bad-soft:#3A1A17;
    --tip:#352C12; --tip-ink:#F2CB5A; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --linen:#13121C; --surface:#1D1C2A; --surface2:#2A2939; --ink:#ECEAF4; --muted:#A8A5BB; --line:#34324A;
  --primary-bg:#9DB5EE; --primary-fg:#13121C; --good:#62D092; --good-soft:#173826; --bad:#FF8F84; --bad-soft:#3A1A17;
  --tip:#352C12; --tip-ink:#F2CB5A; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--linen)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--primary-bg);font-weight:800}
:focus-visible{outline:3px solid #E9A91C;outline-offset:2px}
.page{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 48px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:44px}
.backlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:800;text-decoration:none;color:var(--ink);background:none;border:none;padding:0 6px 0 0;cursor:pointer}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.linkbtn{background:none;border:none;padding:0;color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer;width:max-content}
.join{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;border:2px solid var(--primary-bg)}
.join .jt{font-family:var(--display);font-size:19px;font-weight:800}
.join p{font-size:15px;color:var(--muted)}
.join form{display:flex;gap:8px;flex-wrap:wrap}
.join input{flex:1 1 200px;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--linen);color:var(--ink);padding:10px 12px;font:16px var(--body)}
.join .err{color:var(--bad);font-weight:700;font-size:14px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:2px solid transparent;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background:var(--primary-bg);color:var(--primary-fg)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-grow{flex:1 1 160px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.hubhead h1{font-size:clamp(32px,7vw,46px);line-height:1}
.hubhead p{color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:400;width:100%}
.tile:hover{border-color:var(--c)}
.ico{width:48px;height:48px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.tile b{font-family:var(--display);font-size:18px;line-height:1.15;display:block}
.tile small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--c, var(--primary-bg));transition:width .4s}
.thead{background:var(--c);color:#FFFFFF;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px}
.thead .ico{background:rgba(255,255,255,.18);width:56px;height:56px;font-size:30px}
.thead h1{font-size:clamp(28px,6vw,38px);line-height:1.05}
.thead .eyebrow{color:rgba(255,255,255,.85)}
.thead p{font-size:16px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px;width:max-content;max-width:100%}
.seg button{min-height:42px;padding:0 16px;border:none;border-radius:10px;background:transparent;font-weight:800;font-size:15px;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.memseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.memseg button{padding:0 8px;font-size:14px}
@media (max-width:480px){.memseg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:clamp(22px,4.4vw,28px);line-height:1.1}
.progress{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.card.open{border-color:var(--c)}
.chead{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;background:none;border:none;text-align:left;cursor:pointer}
.num{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.card.seen .num{background:var(--c);color:#FFFFFF}
.chead b{flex:1;font-family:var(--display);font-size:18px;line-height:1.2}
.chev{transition:transform .2s;color:var(--muted)}
.card.open .chev{transform:rotate(180deg)}
.cbody{padding:0 16px 16px 16px;display:flex;flex-direction:column;gap:12px}
.cbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tipbox{background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.tipbox span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.verse{margin:0;padding:2px 0 2px 14px;border-left:3px solid var(--line)}
.verse p{font-family:var(--scripture);font-style:italic;font-size:16px}
.verse cite{font-style:normal;font-size:13px;font-weight:800;color:var(--muted)}
.help{color:var(--muted);font-size:15px}
.mrow{display:flex;flex-direction:column;gap:5px}
.mrow>span{font-weight:700;font-size:15px}
select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--linen);color:var(--ink);padding:8px 10px;font:15px var(--body)}
select.ok{border-color:var(--good);background:var(--good-soft)}
.fb{font-weight:800;font-size:15px;color:var(--muted)}
.fb.ok{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#FFFFFF}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip.miss{border-style:dashed;border-color:var(--bad)}
.chip.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.olist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.compass{display:flex;flex-direction:column;align-items:center;gap:12px}
.compass svg{width:100%;max-width:300px;height:auto}
.compass input[type=range]{width:100%;max-width:320px;accent-color:var(--c)}
.deg{font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.mem{display:flex;flex-direction:column;gap:10px;font-size:18px;line-height:1.6}
.mem .w{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--c);color:transparent;cursor:pointer;margin:0 1px;user-select:none}
.mem .w.shown{color:var(--ink);border-bottom-color:transparent}
.mem .w.hint{color:var(--muted)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--display);font-size:clamp(20px,4vw,24px);line-height:1.25;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
.feedback b{font-family:var(--display);font-size:18px}
.endscore{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.think{font-size:15px;color:var(--muted)}
.scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:1.5px solid var(--line);background:#FFFFFF}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:0;cursor:pointer;width:76px;color:#1D1B2B}
.hot .dot{position:relative;width:48px;height:48px;border-radius:50%;background:#FFFFFF;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:transform .15s}
.hot .dot img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top}
.hot .dot .ini{font-size:16px}
.hot .lbl{font-size:10.5px;font-weight:800;line-height:1.15;background:rgba(255,255,255,.92);color:#1D1B2B;padding:1px 5px;border-radius:6px;text-align:center;max-width:76px}
.hot.seen .dot::after{content:'✓';position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:#1E7A46;color:#FFFFFF;font-size:11px;display:flex;align-items:center;justify-content:center}
.hot.sel .dot{transform:scale(1.18);border-color:#E9A91C}
.hot.right .dot{border-color:#1E7A46;background:#DDF0E3}
.hot.wrong .dot{border-color:#B3261E;background:#FBE4E1}
.detail{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border:2px solid var(--c, var(--line))}
.detail.hint{border-style:dashed;border-color:var(--line);box-shadow:none;color:var(--muted)}
.detail ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dhead{display:flex;align-items:center;gap:14px}
.dhead h2{font-size:clamp(20px,4.6vw,26px);line-height:1.15}
.big{font-size:46px;line-height:1;flex-shrink:0}
.big img{display:block;width:92px;height:116px;object-fit:cover;object-position:top;border-radius:14px;border:3px solid var(--c)}
.big .ini{display:flex;width:72px;height:72px;border-radius:50%;background:var(--surface2);align-items:center;justify-content:center;font-size:24px}
.dates{font-weight:800;font-size:14px;color:var(--muted)}
.credit{font-size:11px;color:var(--muted)}
.syms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.syms span{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface2);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:800;text-align:center}
.syms i{font-style:normal;font-size:28px;line-height:1.1}
.diag{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.diag svg{width:100%;max-width:360px;height:auto}
.diag figcaption{font-size:13px;font-weight:700;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;font-size:13px;font-weight:700}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:22px;height:16px;border-radius:4px;border:1.5px solid #8A8A8A;flex-shrink:0}
.scene.tall{aspect-ratio:1/1}
.hot .dot svg{width:34px;height:34px}
.taphint{font-size:14px;font-weight:700;color:var(--muted);text-align:center;margin:-4px 0 0}
body.lock{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:60;background:var(--linen);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.sheetin{max-width:640px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px}
.sbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:10px 0;background:var(--linen)}
.sbar .x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.pips{flex:1;display:flex;gap:4px}
.pips i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--c);opacity:.45}
.pips i.cur{background:var(--c)}
.cnt{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.18);background:#FFFFFF}
.stage>svg{display:block;width:100%;height:100%}
.stage .tag{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);color:#1D1B2B;border-radius:999px;padding:6px 16px 6px 8px;font-weight:800;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.stage .tag i{font-style:normal;font-size:24px;line-height:1}
.stage .tag svg{width:28px;height:28px}
.shead h2{font-size:clamp(28px,7.5vw,40px);line-height:1.05}
.shead .lead{margin-top:6px;font-family:var(--scripture);font-style:italic;font-size:clamp(19px,5vw,23px);color:var(--c);font-weight:600}
.shead .kjv{margin-top:4px;font-size:14px;font-weight:700;color:var(--muted)}
.sblock{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sblock ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.45}
.vbox{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.spop{margin:0;border-radius:20px;padding:16px 18px;background:var(--surface2);border-left:6px solid #B08A4A;display:flex;flex-direction:column;gap:8px}
.spop blockquote{margin:0;font-family:var(--scripture);font-size:18px;line-height:1.45}
.spop figcaption{font-size:13px;font-weight:800;color:var(--muted)}
.pst{display:flex;align-items:center;gap:16px;padding:16px;background:linear-gradient(135deg,#F6ECD6,#E6D3AE);aspect-ratio:auto;min-height:200px}
.pframe{flex-shrink:0;width:38%;max-width:180px;aspect-ratio:4/5;border-radius:50% / 44%;overflow:hidden;border:6px solid #8A6A32;box-shadow:0 0 0 3px #E9D8B0,0 8px 20px rgba(0,0,0,.3);background:#CDB894;animation:pfloat 4s ease-in-out infinite}
.pframe img{width:100%;height:100%;object-fit:cover;object-position:top;filter:sepia(.25)}
.pframe .ini{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#5A3A0E}
@keyframes pfloat{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-3px)}}
.pinfo{display:flex;flex-direction:column;gap:4px;color:#3A2A12;min-width:0}
.pinfo .eyebrow{color:#7A5A2A}
.pname{font-family:Georgia,serif;font-size:clamp(22px,6vw,30px);line-height:1.1}
.pyears{font-family:Georgia,serif;font-size:clamp(20px,5.5vw,26px);font-weight:700;color:#7A4A12}
.pkey{margin-top:6px;align-self:flex-start;background:#7A4A12;color:#FFF;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;animation:pop .6s .4s both}
.tline{margin:0;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.tline svg{width:100%;height:auto;display:block}
.tline figcaption{font-size:13px;font-weight:700;color:var(--muted);text-align:center;margin-top:4px}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.face{border:3px solid var(--line);border-radius:18px;padding:6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font-weight:800;font-size:14px}
.face img,.face .ini{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:12px;filter:sepia(.2);background:#CDB894;display:flex;align-items:center;justify-content:center;font-size:28px}
.face.right{border-color:var(--good);background:#DDF0E3;color:#1D1B2B}
.face.wrong{border-color:var(--bad);background:#FBE4E1;color:#1D1B2B}
.bigface{width:min(62%,240px);margin:0 auto;aspect-ratio:4/5;border-radius:50% / 44%;overflow:hidden;border:6px solid #8A6A32;box-shadow:0 0 0 3px #E9D8B0,0 8px 20px rgba(0,0,0,.25);background:#CDB894}
.bigface img{width:100%;height:100%;object-fit:cover;object-position:top;filter:sepia(.25)}
.bigface .ini{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:44px;font-weight:800}
.ophoto{width:34px;height:42px;border-radius:8px;object-fit:cover;object-position:top;flex-shrink:0;filter:sepia(.2)}
.an{transform-box:view-box;transform-origin:0 0}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0deg)}25%{transform:scale(.93,1.08) skewX(4deg)}50%{transform:scale(1.05,.95) skewX(-3deg)}75%{transform:scale(.96,1.1) skewX(2deg)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(6px,-70px);opacity:0}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.5}100%{transform:translate(14px,-60px) scale(1.6);opacity:0}}
@keyframes fall{0%{transform:translate(0,-30px);opacity:0}10%{opacity:1}100%{transform:translate(0,190px);opacity:1}}
@keyframes drip{0%{transform:translate(0,0);opacity:1}80%{opacity:1}100%{transform:translate(0,46px);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.14)}70%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%,55%{transform:translateY(-24px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes rock{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(170px)}}
@keyframes legA{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
@keyframes legB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes jjL{0%,100%{transform:rotate(14deg)}50%{transform:rotate(165deg)}}
@keyframes jjR{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-165deg)}}
@keyframes jlL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(22deg)}}
@keyframes jlR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-115deg)}}
@keyframes pet{0%,100%{transform:rotate(-62deg)}50%{transform:rotate(-82deg)}}
@keyframes water{0%,100%{transform:rotate(-58deg)}50%{transform:rotate(-80deg)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.55)}}
@keyframes drift{0%,100%{transform:translateX(-22px)}50%{transform:translateX(22px)}}
@keyframes slide{to{transform:translateX(-80px)}}
@keyframes grow{0%{transform:scale(.08)}75%,100%{transform:scale(1)}}
@keyframes fill{0%,8%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.75}}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes popl{0%{transform:scale(0);opacity:0}8%{transform:scale(1.15);opacity:1}12%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes seq3{0%,30%{opacity:1}36%,100%{opacity:.18}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.1,1.06)}}
@keyframes zz{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(26px,-54px) scale(1.3);opacity:0}}
@keyframes balance{0%,15%{transform:rotate(-14deg)}45%,100%{transform:rotate(0deg)}}
@keyframes pushin{0%{transform:translate(var(--px),var(--py))}80%,100%{transform:translate(0,0)}}
@keyframes shrink{0%,20%{transform:scale(1)}70%,100%{transform:scale(.08)}}
@keyframes tilt{0%,15%{transform:rotate(0deg)}35%,70%{transform:rotate(-55deg)}90%,100%{transform:rotate(0deg)}}
@keyframes give{0%,25%{transform:translateX(0)}55%,100%{transform:translateX(42px)}}
@keyframes sadon{0%,50%{opacity:1}56%,100%{opacity:0}}
@keyframes happyon{0%,50%{opacity:0}56%,100%{opacity:1}}
@keyframes look{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes steam{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.7}100%{transform:translate(-6px,-40px) scale(1.4);opacity:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.shead .ticon{display:inline-flex;vertical-align:-4px;margin-right:10px;font-size:.9em}
.shead .ticon svg{width:1.1em;height:1.1em}
/* ===== Game kit (version 14): every new game is a dark "game screen" in both themes ===== */
.gk{--g-bg:#121B16;--g-p:#1A2620;--g-p2:#22302A;--g-l:#2E3E35;--g-fg:#EAF1EC;--g-mu:#A3B2A8;--g-mint:#7FD3A2;--g-mint-d:#0F3A24;--g-gold:#E9B649;--g-gold-d:#3B2A06;--g-red:#F08A82;--g-red-d:#3D1714;
  position:relative;overflow:hidden;background:var(--g-bg);color:var(--g-fg);border-radius:22px;padding:12px;font-family:var(--body);min-height:430px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.gk *{box-sizing:border-box}
.gk-hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 17px/1 var(--display);min-height:36px;margin-bottom:8px}
.gk-score{color:var(--g-gold);font-variant-numeric:tabular-nums}
.gk-clock{font-variant-numeric:tabular-nums}
.gk-noheart .gk-hearts{visibility:hidden}
.gk-btn{font:800 15px/1 var(--body);color:var(--g-fg);background:var(--g-p2);border:1px solid var(--g-l);border-radius:14px;padding:12px 14px;cursor:pointer;touch-action:manipulation}
.gk-btn:focus-visible{outline:3px solid var(--g-gold);outline-offset:2px}
.gk-snd{padding:7px 10px;font-size:15px}
.gk-go{background:var(--g-mint);color:#0B2416;border-color:var(--g-mint)}
.gk-stage{position:relative}
.gk-ask{color:var(--g-mu);font-size:15px;margin:0 0 10px;min-height:44px}
.gk-ask b{color:var(--g-fg)}
.gk-toast{position:absolute;left:12px;right:12px;top:46px;z-index:30;pointer-events:none;background:var(--g-red-d);border:1px solid var(--g-red);color:#FFD6D2;border-radius:14px;padding:11px 13px;font-size:14.5px;line-height:1.35;animation:gkIn .2s ease}
.gk-toast.good{background:var(--g-mint-d);border-color:var(--g-mint);color:#D4F5E2}
.gk-over{position:absolute;inset:0;z-index:40;background:rgba(14,21,17,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px;overflow:auto}
.gk-over h3{font:700 23px/1.2 var(--display);margin:0;color:var(--g-fg)}
.gk-over p{margin:0;color:var(--g-mu);font-size:15px;max-width:34ch}
.gk-how{color:var(--g-mu);font-size:15px;max-width:36ch;line-height:1.45}
.gk-how b{color:var(--g-fg)}
.gk-big{font-size:52px;line-height:1}
.gk-play{font-size:17px;padding:14px 26px}
.gk-stars{font:700 50px/1 var(--display);color:var(--g-gold);letter-spacing:6px}
.gk-stars s{color:#3A463F;text-decoration:none}
.gk-pts{color:var(--g-fg)!important;font-weight:800}
.gk-new{color:var(--g-gold)!important;font-weight:800}
.gk-mute{color:var(--g-mu)!important;font-size:13.5px!important}
.gk-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.gk-board{width:100%;max-width:300px;background:var(--g-p);border:1px solid var(--g-l);border-radius:14px;padding:10px 12px;text-align:left}
.gk-board b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--g-gold);margin-bottom:6px}
.gk-board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.gk-board li{display:flex;gap:8px;align-items:center;font-size:14.5px;padding:3px 4px;border-radius:8px}
.gk-board li.me{background:var(--g-gold-d);color:#F6DFA6}
.gk-board .rk{width:26px;text-align:center}.gk-board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gk-board .sc{font-weight:800;font-variant-numeric:tabular-nums}
.gk-piece{display:inline-flex;align-items:center;gap:8px;font:700 15px/1.1 var(--body);color:var(--g-fg);background:#2A3A30;border:1px solid #3C5244;border-radius:14px;padding:11px 13px;cursor:grab;position:relative;z-index:1;transition:transform .25s ease}
.gk-piece .ic{font-size:22px;line-height:1}
.gk-lift{transition:none!important;z-index:20!important;box-shadow:0 10px 24px rgba(0,0,0,.45);cursor:grabbing}
.gk-picked{outline:3px solid var(--g-mint)}
.gk-shake{animation:gkShake .4s}
.gk-hit .gk-hud{animation:gkShake .35s}
.gk-tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;padding:10px;border-radius:16px;background:#0E1612;border:1px solid var(--g-l)}
.gk-glow{animation:gkGlow .7s ease}
.gk-conf{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;z-index:41;animation:gkFall 1.7s linear forwards}
@keyframes gkIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes gkShake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes gkGlow{0%{box-shadow:0 0 0 0 rgba(233,182,73,.85)}100%{box-shadow:0 0 0 16px rgba(233,182,73,0)}}
@keyframes gkFall{to{transform:translateY(620px) rotate(540deg);opacity:.2}}
@keyframes gkBob{50%{transform:translateY(-5px)}}
@keyframes gkPulse{50%{transform:scale(1.08)}}
.gk-panelhead{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.gk-panelhead .eyebrow{color:var(--muted)}
.gk-new-badge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#E9B649;color:#3B2A06;border-radius:999px;padding:3px 8px}
@media (prefers-reduced-motion:reduce){.gk *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ===== Story cards (What to know, one fact per card) ===== */
.stc{background:#16201A;color:#EAF1EC;border:1px solid #2B3A31;border-radius:20px;padding:14px;margin-top:8px}
.st-bars{display:flex;gap:4px;margin-bottom:12px}
.st-bars i{flex:1;height:4px;border-radius:4px;background:#2B3A31;overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:#E9B649;transition:width .35s}
.st-bars i.on b{width:100%}
.st-card{min-height:290px;display:flex}
.st-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:4px;animation:stIn .35s ease}
@keyframes stIn{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:none}}
.st-line{font:700 19px/1.35 var(--body);max-width:30ch;text-wrap:balance;margin:0;color:#EAF1EC}
.st-gold{color:#E9B649}
.st-small{color:#A3B2A8;font-size:14.5px;margin:0;max-width:34ch}
.st-big{font:800 64px/1 var(--display);color:#E9B649;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.st-big.st-mid{font-size:42px}
.st-emo{font-size:58px;line-height:1;animation:gkBob 2s ease-in-out infinite}
.st-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:10px}
.st-b{font:800 15px/1 var(--body);color:#EAF1EC;background:#1D2922;border:1px solid #2B3A31;border-radius:14px;padding:12px 14px;cursor:pointer}
.st-go{background:#7FD3A2;color:#0B2416;border-color:#7FD3A2}
.st-gather{position:relative;width:200px;height:150px}
.st-gather span{position:absolute;left:50%;top:50%;font-size:28px;margin:-18px 0 0 -18px;animation:stGather 2.6s ease-in-out infinite alternate}
.st-gather .hub{font-size:46px;margin:-30px 0 0 -30px;animation:stPulse 2.6s ease-in-out infinite alternate}
@keyframes stGather{from{transform:translate(var(--x),var(--y))}to{transform:translate(calc(var(--x)*.42),calc(var(--y)*.42))}}
@keyframes stPulse{from{transform:scale(.9)}to{transform:scale(1.12)}}
.st-tl{display:flex;align-items:flex-start;justify-content:space-between;width:100%;max-width:330px;position:relative}
.st-tl:before{content:"";position:absolute;left:12%;right:12%;top:13px;height:3px;background:#2B3A31}
.st-tl div{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:33%;font-size:13px;color:#A3B2A8;line-height:1.3}
.st-tl div b{width:28px;height:28px;border-radius:50%;background:#1D2922;border:3px solid #E9B649;display:grid;place-items:center;font-size:13px}
.st-tl div strong{font:800 17px/1 var(--display);color:#EAF1EC}
.st-tl div.hot b{background:#E9B649}
.st-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;width:100%}
.st-tiles div{background:#1D2922;border:1px solid #2B3A31;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;line-height:1.25;color:#EAF1EC}
.st-tiles div span{font-size:30px;animation:gkBob 1.8s ease-in-out infinite}
.st-tiles div:nth-child(2) span{animation-delay:.3s}.st-tiles div:nth-child(3) span{animation-delay:.6s}.st-tiles div:nth-child(4) span{animation-delay:.9s}
.st-vote{font-size:58px;position:relative;height:80px;width:90px;line-height:1.2}
.st-vote i{position:absolute;left:31px;top:-6px;font-style:normal;font-size:26px;animation:stDrop 1.6s ease-in infinite}
@keyframes stDrop{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}80%{transform:translateY(26px);opacity:1}100%{transform:translateY(30px);opacity:0}}
.st-steps{display:flex;align-items:flex-end;gap:6px;height:130px}
.st-steps span{font-size:28px;display:flex;align-items:flex-start;justify-content:center;width:44px;height:calc(36px + var(--i) * 22px);background:#2A2412;border-top:4px solid #E9B649;border-radius:8px 8px 0 0;padding-top:4px;animation:stRise .6s ease backwards;animation-delay:calc(var(--i) * .15s)}
@keyframes stRise{from{height:20px;opacity:0}}
.st-nest{position:relative;width:150px;height:150px}
.st-nest i{position:absolute;left:50%;top:50%;border:2px solid #E9B649;border-radius:50%;font-style:normal;font-size:18px;display:flex;justify-content:center;padding-top:2px;transform:translate(-50%,-50%)}
.st-nest i:nth-child(1){width:150px;height:150px}.st-nest i:nth-child(2){width:120px;height:120px;border-color:#C99A38}.st-nest i:nth-child(3){width:90px;height:90px;border-color:#A97E2C}.st-nest i:nth-child(4){width:62px;height:62px;border-color:#7FD3A2}.st-nest i:nth-child(5){width:34px;height:34px;border-color:#7FD3A2;align-items:center;padding:0}
.st-ch{display:flex;flex-direction:column;gap:8px;width:100%}
.st-opt{text-align:left;padding:14px;font:700 15px/1.2 var(--body);color:#EAF1EC;background:#1D2922;border:1px solid #2B3A31;border-radius:14px;cursor:pointer}
.st-opt.right{background:#0F3A24;border-color:#7FD3A2;color:#7FD3A2}
.st-opt.wrong{background:#3D1714;border-color:#F08A82;color:#F08A82;animation:gkShake .35s}
.st-fb{min-height:22px;font-size:14px;color:#7FD3A2;margin:0}
/* ===== Church ladder game ===== */
.lad{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.lad-row{margin-left:calc(var(--i) * 8%);width:68%}
.lad-slot{min-height:52px;border:2px dashed #3E5246;border-bottom:6px solid #4A3A14;border-radius:14px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:6px 10px;color:#A3B2A8;font-size:13px;transition:background .15s,border-color .15s}
.lad-slot .lvl{display:flex;align-items:center;gap:6px;color:#EAF1EC;font-weight:700;font-size:13.5px}
.lad-slot.hover{border-color:#E9B649;background:#2A2412}
.lad-slot.filled{border-style:solid;border-color:#E9B649;background:#3B2A06;color:#F6DFA6}
.lad-slot .gk-piece{background:transparent;border:0;padding:0;color:#F6DFA6}

/* ===== Fire ===== */
.fr-pic{border-radius:16px;overflow:hidden;border:1px solid var(--g-l);margin-bottom:10px;background:#0E1612}
.fr-pic svg{display:block;width:100%;height:auto}
.fr-gust svg{animation:gkShake .4s}
.fr-flick{animation:frFlick .5s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes frFlick{from{transform:scaleY(.92) skewX(-3deg)}to{transform:scaleY(1.06) skewX(3deg)}}
.fr-wind{animation:frWind 1.6s linear infinite}
@keyframes frWind{from{transform:translateX(-60px)}to{transform:translateX(380px)}}
.fr-q{font-weight:800;margin:0 0 8px;color:var(--g-fg)}
.fr-lays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fr-lay{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px}
.fr-lay svg{width:100%;max-width:150px;height:60px}
.fr-lay.ok{border-color:var(--g-mint);background:var(--g-mint-d)}
.fr-lay.no{border-color:var(--g-red);background:var(--g-red-d)}
.gk-piece.used{opacity:.35}
.fr-bars{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
.fr-bars div{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.fr-bars span{width:84px}
.fr-bars i{flex:1;height:14px;background:#0E1612;border:1px solid var(--g-l);border-radius:8px;overflow:hidden}
.fr-bars b{display:block;height:100%;width:0;background:linear-gradient(90deg,#E8541E,#FFC23C);border-radius:8px}
.fr-bars .fr-b{background:#8DB8F0}
.fr-blow{width:100%;font-size:18px;padding:18px;touch-action:none}
.fr-blow.on{background:#E9B649;border-color:#E9B649;transform:scale(.98)}
.fr-fig{animation:frShiver .25s ease-in-out infinite alternate}
@keyframes frShiver{from{transform:translateX(-1px)}to{transform:translateX(1px)}}
/* ===== Lashings tower ===== */
.lt-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--g-l);margin-bottom:10px}
.lt-svg{display:block;width:100%;height:auto;max-height:46vh}
.lt-tower{transform-origin:150px 312px}
.lt-ring{animation:gkPulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lt-wobble{animation:ltWobble .7s ease}
@keyframes ltWobble{25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
.lt-fall{animation:ltFall 1.1s ease-in forwards!important}
@keyframes ltFall{to{transform:rotate(-70deg) translateY(40px);opacity:.4}}
.lt-sway{animation:ltSway 1.6s ease-in-out}
@keyframes ltSway{25%{transform:rotate(2.5deg)}50%{transform:rotate(-2deg)}75%{transform:rotate(1.2deg)}}
.lt-flag{animation:ltFlag .9s ease-out}
@keyframes ltFlag{from{transform:translateY(60px);opacity:0}}
.lt-gust{animation:frWind 1.3s linear infinite}
.lt-card{flex-direction:column;gap:2px;padding:6px 10px;font-size:13.5px}
.lt-bonus{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.lt-bonus p{margin:0;color:var(--g-fg)}
.lt-bonus .ok{border-color:var(--g-mint);background:var(--g-mint-d)}
.lt-bonus .no{border-color:var(--g-red);background:var(--g-red-d)}
/* ===== Orienteering ===== */
.or-clue{background:var(--g-p);border:1px solid var(--g-l);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.45;margin-bottom:8px;color:var(--g-mu)}
.or-clue b{color:var(--g-fg)}
.or-map{border-radius:12px;overflow:hidden;border:3px solid #E8E2D0;margin:0 auto 10px;max-width:340px}
.or-map svg{display:block;width:100%;height:auto;cursor:pointer}
.or-me{transition:transform .17s ease}
.or-rose{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:300px;margin:0 auto 10px}
.or-dir{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.or-dir b{font-size:16px}.or-dir small{color:var(--g-mu);font-size:12px}
.or-mid{display:grid;place-items:center;font-size:30px}
.or-key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:12.5px;color:var(--g-mu)}
.or-key span{display:flex;align-items:center;gap:6px}
.or-key i{width:16px;height:12px;border-radius:3px;border:1px solid #555;flex:none}
/* ===== Pack camp ===== */
.pk-top{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px}
.pk-count{font-size:13px;color:var(--g-mu);font-weight:700}
.pk-slot{min-height:58px;display:flex;align-items:center;justify-content:center}
.pk-card{font-size:16px;padding:12px 16px;background:#34493B;animation:gkIn .25s ease}
.pk-card .ic{font-size:30px}
.pk-time{width:100%;max-width:300px;height:8px;background:#0E1612;border-radius:6px;overflow:hidden;border:1px solid var(--g-l)}
.pk-time b{display:block;height:100%;width:100%;background:var(--g-gold)}
.pk-area{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px;align-items:stretch}
.pk-bag{position:relative;display:flex;flex-direction:column;gap:5px;background:#4A6A3A;border:3px solid #2E4A23;border-radius:26px 26px 18px 18px;padding:18px 8px 8px}
.pk-strap{position:absolute;left:30%;right:30%;top:-12px;height:16px;border:4px solid #2E4A23;border-bottom:0;border-radius:12px 12px 0 0}
.pk-zone{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:70px;text-align:left;padding:8px;border-radius:12px;border:2px dashed rgba(255,255,255,.35);background:rgba(0,0,0,.18);color:#EAF1EC;cursor:pointer;font:700 12.5px/1.2 var(--body)}
.pk-zone b{font-size:12.5px}
.pk-zone.hover{border-color:var(--g-gold);background:rgba(233,182,73,.25)}
.pk-in{display:flex;flex-wrap:wrap;gap:2px;font-size:18px}
.pk-in i{font-style:normal}
.pk-home{background:#2A2330;border-color:#6A5A78;min-height:100%}
.pk-meter{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--g-mu)}
.pk-meter i{flex:1;height:10px;background:#0E1612;border:1px solid var(--g-l);border-radius:6px;overflow:hidden}
.pk-meter b{display:block;height:100%;width:0;background:var(--g-mint);transition:width .3s}
.pk-meter em{font-style:normal;color:var(--g-fg);min-width:52px;text-align:right}
/* ===== Nutrition runner ===== */
.nu-bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:8px}
.nu-bars div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:18px}
.nu-bars i{width:100%;height:9px;background:#0E1612;border:1px solid var(--g-l);border-radius:6px;overflow:hidden}
.nu-bars b{display:block;height:100%;width:0;background:var(--g-mint);transition:width .25s}
.nu-bars .full b{background:var(--g-gold)}
.nu-road{position:relative;height:380px;border-radius:16px;overflow:hidden;background:#3A3F45;touch-action:none;border:1px solid var(--g-l)}
.nu-lines{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(33.3% - 2px),rgba(255,255,255,.55) calc(33.3% - 2px),rgba(255,255,255,.55) calc(33.3% + 2px),transparent calc(33.3% + 2px),transparent calc(66.6% - 2px),rgba(255,255,255,.55) calc(66.6% - 2px),rgba(255,255,255,.55) calc(66.6% + 2px),transparent calc(66.6% + 2px));-webkit-mask:repeating-linear-gradient(180deg,#000 0 22px,transparent 22px 40px);mask:repeating-linear-gradient(180deg,#000 0 22px,transparent 22px 40px)}
.nu-side{position:absolute;top:30%;font-size:26px;opacity:.6}.nu-side.l{left:-6px}.nu-side.r{right:-6px}
.nu-me{position:absolute;bottom:22px;font-size:42px;transform:translateX(-50%) scaleX(-1);transition:left .12s ease;z-index:3}
.nu-yum{animation:nuYum .3s ease}
@keyframes nuYum{50%{transform:translateX(-50%) scaleX(-1) scale(1.25)}}
.nu-thing{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none}
.nu-thing span{font-size:34px;line-height:1;width:50px;height:50px;display:grid;place-items:center;border-radius:50%;background:rgba(127,211,162,.22);border:2px solid rgba(127,211,162,.7)}
.nu-thing small{font-size:10.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap}
.nu-thing.bad span{background:rgba(240,138,130,.25);border-color:#F08A82}
.nu-thing.full span{background:rgba(160,160,160,.2);border-color:#9AA;filter:grayscale(.7)}
.nu-thing.full small:after{content:" · full";color:#E9B649}
.nu-pad{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--g-mu)}
.nu-pad .gk-btn{font-size:20px;padding:12px 22px}
.pk-fb{margin:0;font-size:14px;line-height:1.35;text-align:center;border-radius:12px;padding:8px 10px;max-width:320px;animation:gkIn .2s ease}
.pk-fb.ok{background:var(--g-mint-d);color:#D4F5E2}.pk-fb.no{background:var(--g-red-d);color:#FFD6D2}
.nu-msg{margin:0 0 8px;min-height:40px;font-size:13.5px;line-height:1.35;color:var(--g-mu);border-radius:10px;padding:6px 9px;background:var(--g-p)}
.nu-msg.ok{color:#D4F5E2;background:var(--g-mint-d)}.nu-msg.no{color:#FFD6D2;background:var(--g-red-d)}
/* ===== Fruit basket ===== */
.fb-verse{font-family:var(--scripture);font-size:14.5px;line-height:1.5;color:var(--g-mu);margin:0 0 6px}
.fb-verse b{color:var(--g-gold)}.fb-verse cite{display:block;font-style:normal;font-family:var(--body);font-size:12px;margin-top:2px}
.fb-blank{color:#4A5C51;letter-spacing:1px}
.fb-want{font-size:15px;margin-bottom:6px;color:var(--g-fg)}
.fb-ic{font-size:20px}
.fb-field{position:relative;height:360px;border-radius:16px;overflow:hidden;background:linear-gradient(#244E7A,#3F7C5A 70%,#5B8A3A);touch-action:none;border:1px solid var(--g-l);cursor:pointer}
.fb-tree{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:110px;opacity:.85;pointer-events:none}
.fb-basket{position:absolute;bottom:8px;transform:translateX(-50%);font-size:46px;transition:left .06s linear;z-index:3;pointer-events:none}
.fb-drop{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:2}
.fb-drop span{font-size:28px;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6)}
.fb-drop small{font-size:10.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap}
.fb-drop.flesh span{background:rgba(60,10,10,.6);border-color:#F08A82}
/* ===== Pioneers ===== */
.pi-line{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;position:relative;padding-left:14px;border-left:3px solid var(--g-gold)}
.pi-slot{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:50px;padding:6px 8px;border:2px dashed #3E5246;border-radius:12px;font-size:13.5px;line-height:1.25;position:relative}
.pi-slot:before{content:"";position:absolute;left:-22px;top:50%;width:11px;height:11px;margin-top:-6px;border-radius:50%;background:var(--g-gold)}
.pi-slot.hover{border-color:var(--g-gold);background:#2A2412}
.pi-slot.filled{border-style:solid;border-color:var(--g-gold);background:var(--g-gold-d)}
.pi-yr{font:800 13px/1.1 var(--display);color:var(--g-gold)}
.pi-ev{color:var(--g-fg)}
.pi-drop{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.pi-face img,.pi-face .ini{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;display:grid;place-items:center;background:#33443A;color:#fff;font-size:12px;border:2px solid #E9B649}
.pi-card{padding:6px 10px;font-size:13px}
.pi-drop .pi-nm{display:none}
.pi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pi-mem{position:relative;min-height:96px;border-radius:14px;border:1px solid var(--g-l);background:#2A3A30;color:var(--g-fg);cursor:pointer;padding:6px;font:700 12px/1.25 var(--body)}
.pi-mem .front{display:none;flex-direction:column;align-items:center;gap:4px}
.pi-mem .back{font-size:30px}
.pi-mem.up .front{display:flex}.pi-mem.up .back{display:none}
.pi-mem.up{background:#33443A;animation:piFlip .25s ease}
.pi-mem.done{background:var(--g-mint-d);border-color:var(--g-mint)}
.pi-mem .pi-face img,.pi-mem .pi-face .ini{width:42px;height:42px}
.pi-fact{font-size:12px}
@keyframes piFlip{from{transform:rotateY(90deg)}to{transform:none}}
/* ===== Ecology ===== */
.ec-meter{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:8px}
.ec-meter i{flex:1;height:12px;background:#0E1612;border:1px solid var(--g-l);border-radius:7px;overflow:hidden}
.ec-meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,#5DADE2,#7FD3A2);transition:width .3s}
.ec-meter.low b{background:#B5651D}
.ec-meter em{font-style:normal;min-width:40px;text-align:right}
.ec-creek{position:relative;height:250px;border-radius:16px;overflow:hidden;background:#5B8A3A;border:1px solid var(--g-l);margin-bottom:8px}
.ec-water{position:absolute;left:0;right:0;top:12px;height:170px;background:repeating-linear-gradient(100deg,#2F6E9E 0 26px,#3A7FB2 26px 52px);animation:ecFlow 4s linear infinite}
@keyframes ecFlow{from{background-position:0 0}to{background-position:104px 0}}
.ec-life{position:absolute;left:0;right:0;bottom:4px;height:56px}
.ec-ani{position:absolute;bottom:6px;font-size:30px;animation:gkBob 1.6s ease-in-out infinite}
.ec-thing{position:absolute;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:grab;z-index:2;transform-origin:center}
.ec-thing span{font-size:30px;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55)}
.ec-thing small{font-size:10.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap}
.ec-thing.gk-picked span{outline:3px solid var(--g-gold)}
.ec-bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ec-bin{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:14px;border:2px solid var(--g-l);background:var(--g-p2);color:var(--g-fg);font:800 12px/1.15 var(--body);cursor:pointer}
.ec-bin span{font-size:26px}
.ec-bin.hover{border-color:var(--g-gold);background:#2A2412}
/* ===== Legion ===== */
.lg-path{position:relative;height:64px;border-radius:14px;background:linear-gradient(#7DB7E8,#CDE6F7 60%,#6B8A3A 60%);margin-bottom:10px;overflow:hidden}
.lg-path:after{content:"";position:absolute;left:0;right:0;bottom:10px;border-bottom:3px dashed rgba(255,255,255,.7)}
.lg-stop{position:absolute;bottom:14px;font-size:22px;filter:grayscale(.6);opacity:.8}
.lg-stop:nth-child(1){left:8%}.lg-stop:nth-child(2){left:24.5%}.lg-stop:nth-child(3){left:41%}.lg-stop:nth-child(4){left:57.5%}.lg-stop:nth-child(5){left:74%}.lg-stop:nth-child(6){left:90.5%}
.lg-stop.won{filter:none;opacity:1}
.lg-me{position:absolute;bottom:20px;font-size:28px;transform:translateX(-30%);transition:left .9s ease;z-index:2;animation:gkBob .5s ease-in-out infinite}
.lg-card{background:var(--g-p);border:1px solid var(--g-l);border-radius:16px;padding:12px;animation:gkIn .25s ease}
.lg-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lg-part{font-size:24px}
.lg-timer{flex:1;height:8px;background:#0E1612;border-radius:6px;overflow:hidden}.lg-timer i{display:block;height:100%;background:var(--g-gold)}
.lg-sit{margin:0 0 10px;font-size:16px;line-height:1.4;color:var(--g-fg);font-weight:600}
.lg-opts{display:flex;flex-direction:column;gap:8px}
.lg-opt{text-align:left;line-height:1.3}
.lg-opt.ok{border-color:var(--g-mint);background:var(--g-mint-d);color:#D4F5E2}
.lg-opt.no{border-color:var(--g-red);background:var(--g-red-d);color:#FFD6D2}
.lg-why{margin:10px 0 0;font-size:14px;line-height:1.4}.lg-why.ok{color:#B9EBCF}.lg-why.no{color:#FFC9C3}
.lg-next{margin-top:10px;width:100%}
.lg-pledge{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.lg-pl{margin:0;font-family:var(--scripture);font-size:14px;color:var(--g-gold);animation:gkIn .3s ease}
.lg-pl.dim{color:var(--g-mu)}

/* ===== What to know: flip cards (nutrition) ===== */
.fl-hint{font-size:13.5px;color:var(--muted);margin:4px 0 8px}
.fl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fl-card{position:relative;min-height:132px;border:0;padding:0;background:none;cursor:pointer;perspective:700px;font:inherit;color:inherit;text-align:center}
.fl-in{position:absolute;inset:0;transition:transform .45s ease;transform-style:preserve-3d}
.fl-card.on .fl-in{transform:rotateY(180deg)}
.fl-front,.fl-back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden;font-size:14.5px;line-height:1.3}
.fl-front{background:#2E6A3E;color:#fff;font-weight:800;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.fl-front i{font-style:normal;font-size:32px}
.fl-back{background:var(--surface);color:var(--ink);border:2px solid #2E6A3E;transform:rotateY(180deg);font-size:14px}
.fl-card:nth-child(2) .fl-front{background:#B5651D}.fl-card:nth-child(3) .fl-front{background:#2B6CA3}.fl-card:nth-child(4) .fl-front{background:#7A3E8E}
.fl-card:nth-child(2) .fl-back{border-color:#B5651D}.fl-card:nth-child(3) .fl-back{border-color:#2B6CA3}.fl-card:nth-child(4) .fl-back{border-color:#7A3E8E}
/* ===== What to know: chat (pioneers) ===== */
.ch-box{background:#E9E2D6;border-radius:18px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.ch-top{display:flex;align-items:center;gap:10px;background:#5B3A1A;color:#fff;padding:9px 12px}
.ch-top small{margin-left:auto;opacity:.8}
.ch-av{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #E9B649}
.ch-top .ini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#7A4A12}
.ch-msgs{display:flex;flex-direction:column;gap:6px;padding:12px}
.ch-me,.ch-them{margin:0;max-width:82%;padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.4;color:#1D1B2B}
.ch-me{align-self:flex-end;background:#D7F5C9;border-bottom-right-radius:4px}
.ch-them{align-self:flex-start;background:#FFFFFF;border-bottom-left-radius:4px}
.ch-them.new{animation:chPop .45s ease}
@keyframes chPop{0%{opacity:0;transform:translateY(6px) scale(.96)}60%{opacity:1}100%{transform:none}}
.ch-ask{display:flex;align-items:center;gap:8px;padding:0 12px 12px;flex-wrap:wrap;color:#5C596D;font-size:13px;font-weight:800}
.ch-q{font:800 14.5px/1.2 var(--body);background:#25683A;color:#fff;border:0;border-radius:999px;padding:10px 14px;cursor:pointer}
.ch-end{margin:0;padding:0 12px 12px;font-size:13.5px;color:#5C596D}
/* ===== What to know: checklist (pack camp) ===== */
.ck-paper{background:#FFF8E1;color:#3B2F1C;border-radius:14px;padding:10px 12px;border:1px solid #E8D9A8;margin-top:6px}
.ck-row+.ck-row{border-top:1px dashed #E0D2A6}
.ck-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-size:14px}
.ck-head span{color:#7A6640;font-weight:700}
.ck-row{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 2px;cursor:pointer;font:inherit;color:inherit}
.ck-box{flex:none;width:26px;height:26px;border:2.5px solid #3A5BA0;border-radius:6px;display:grid;place-items:center;color:#2346A0;font:900 20px/1 var(--display);background:#fff}
.ck-row.on .ck-box{animation:gkPulse .3s ease}
.ck-ic{font-size:22px;line-height:1.1}
.ck-t{display:flex;flex-direction:column;gap:1px;font-size:15px;line-height:1.3}
.ck-t small{color:#7A6640;font-size:13px}
.ck-row.on .ck-t b{text-decoration:line-through;text-decoration-color:#2346A0;text-decoration-thickness:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ch-box{background:#2A2520}}
:root[data-theme="dark"] .ch-box{background:#2A2520}

/* ===== Version 15: slim name pill, Memory Gems, longer What to know ===== */
.mepill{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mepill.save{border-color:var(--primary-bg);color:var(--primary-bg)}
.w2-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;justify-content:space-between}
.w2-lead{font-size:15.5px;line-height:1.45;flex:1 1 220px;margin:0}
.w2-say{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--c, var(--primary-bg));background:var(--surface);color:var(--ink);font:800 14px var(--body);cursor:pointer;white-space:nowrap}
.w2-facts{margin:0;padding-left:20px;flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.ch2{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.ch2-step{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:15.5px;line-height:1.35;border-left:5px solid var(--c, var(--primary-bg))}
.ch2-step.new{animation:w2In .35s ease}
.ch2-ic{font-size:28px;line-height:1;flex:none}
.ch2-arrow{text-align:center;font-weight:900;color:var(--c, var(--primary-bg));font-size:18px;line-height:1.2}
@keyframes w2In{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:none}}
.w2-next{min-height:48px;border-radius:14px;border:0;background:var(--c, var(--primary-bg));color:#fff;font:800 16px var(--body);cursor:pointer;padding:0 18px;margin-top:10px;width:100%}
.w2-next:disabled{opacity:.4}
.w2-again{min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:800 15px var(--body);cursor:pointer;padding:0 16px}
.w2-again:disabled{opacity:.4;cursor:default}
.w2-count{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0}
.w2-end{background:var(--good-soft);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;margin:12px 0 8px}
.stp{margin-top:10px;background:var(--surface2);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.stp-pic{font-size:54px;line-height:1;width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 4px var(--c, var(--primary-bg))}
.stp-n{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.stp-t{font-family:var(--display);font-size:21px;line-height:1.15}
.stp-x{font-size:16px;line-height:1.45;margin:0;max-width:34em}
.stp-dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.stp-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.stp-dots i.was{background:var(--c, var(--primary-bg));opacity:.45}
.stp-dots i.on{background:var(--c, var(--primary-bg));width:22px;border-radius:99px}
.stp-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.stp-nav .w2-next{margin-top:0}
.six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:420px){.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.six-c{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.six-ic{font-size:30px}
.six-c b{font-size:14px}
.six-c small{font-size:12.5px;color:var(--muted)}
.hon{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.hon.ok{border-color:var(--good)}
.hon-q{font-weight:800;font-size:15.5px;margin:0}
.hon-ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.hon-ch{grid-template-columns:1fr}}
.hon-o{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14.5px/1.3 var(--body);cursor:pointer;padding:8px 10px;text-align:left}
.hon-o.right{background:var(--good-soft);border-color:var(--good);font-weight:800}

.gemcat{background:var(--surface);border:1.5px solid var(--line);border-radius:18px}

.gemh{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:56px}

.gemprev{margin:0;font-size:14.5px;color:var(--muted)}

.gemtext{background:var(--surface);border-radius:18px;padding:16px;font-size:19px;line-height:1.75}
.gemdone{background:var(--surface);border-radius:18px;padding:14px;font-size:17px;line-height:1.6;min-height:60px}
.gemnext{color:var(--muted)}
.gempieces{display:flex;flex-wrap:wrap;gap:8px}
.gempc{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1.3 var(--body);cursor:pointer;padding:8px 12px;text-align:left}
.gempc.wrong{border-color:var(--bad);background:var(--bad-soft);animation:gkShake .3s}
.gemlearn{background:var(--surface);border:1.5px dashed #7A4A12;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.gemlearn p{margin:0;font-weight:700}

:root[data-theme="dark"] .gemrow.on{background:#2A2016}
:root[data-theme="dark"] .gemok.pk{background:#3A2A16;color:#F1C58A}

/* ===== Version 16: new explorer games (dark game screen, like the other games) ===== */
.x6-intro{background:var(--g-p);border:1px solid var(--g-l);border-radius:18px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;animation:gkIn .3s ease;margin-top:30px}

.x6-intro .gk-btn{min-width:160px;margin-top:6px}
.x6-rn{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--g-gold)}
.x6-count{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--g-mu);margin-bottom:10px}
.x6-count i{flex:1;height:6px;border-radius:6px;background:#0E1612;overflow:hidden}.x6-count b{display:block;height:100%;background:var(--g-gold)}
.x6-card{background:#FFFDF6;color:#1D1B2B;border-radius:18px;padding:22px 18px;font:700 18px/1.35 var(--body);text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .25s ease, background .2s;animation:gkIn .25s ease;touch-action:pan-y}

.x6-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.x6-two .gk-btn{min-height:54px;font-size:16px}
.x6-l{border-color:#F08A82}.x6-r{border-color:#7FD3A2}
.x6-two .gk-btn.ok{background:var(--g-mint-d);border-color:var(--g-mint)}
.x6-why{margin:10px 0 0;font-size:14.5px;line-height:1.4;min-height:1.4em}.x6-why.ok{color:#B9EBCF}.x6-why.no{color:#FFC9C3}
.x6-next{width:100%;margin-top:10px}
.x6-trail{display:flex;justify-content:space-between;background:linear-gradient(#7DB7E8,#CDE6F7);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.x6-trail span{font-size:22px;filter:grayscale(.8);opacity:.55;transition:all .3s}
.x6-trail span.was{filter:none;opacity:.9}.x6-trail span.on{filter:none;opacity:1;transform:scale(1.3)}
.x6-in{min-height:84px;font-size:17px}
.x6-bins{display:grid;gap:8px;margin-top:12px}
.x6-b2{grid-template-columns:1fr 1fr}.x6-b3{grid-template-columns:repeat(3,1fr)}.x6-b4{grid-template-columns:1fr 1fr}.x6-b5{grid-template-columns:repeat(3,1fr)}
.x6-bin{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--g-p2);border:1.5px dashed var(--g-l);border-radius:14px;padding:10px 6px;color:var(--g-fg);font:inherit;cursor:pointer;min-height:84px;touch-action:manipulation}
.x6-bin span{font-size:26px}.x6-bin b{font-size:13px;line-height:1.2;text-align:center}.x6-bin small{font-size:12px;color:var(--g-gold);font-weight:800}
.x6-bin.ok{border-style:solid;border-color:var(--g-mint);background:var(--g-mint-d)}
.x6-bin.no{border-style:solid;border-color:var(--g-red);background:var(--g-red-d);animation:gkShake .35s}
.x6-abbr{display:flex;justify-content:center;gap:8px;margin:6px 0 12px}
.x6-abbr b{width:54px;height:62px;border-radius:12px;background:var(--g-gold);color:#2A1C00;display:grid;place-items:center;font:900 34px/1 var(--display)}
.x6-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.x6-slot{min-width:70px;padding:8px 10px;border-radius:10px;border:1.5px dashed var(--g-l);color:var(--g-mu);font-weight:800;text-align:center}
.x6-slot.ok{border-style:solid;border-color:var(--g-mint);background:var(--g-mint-d);color:#D4F5E2;animation:gkIn .25s ease}
.x6-ask{text-align:center;color:var(--g-mu);font-weight:700;margin:12px 0 8px;font-size:14.5px}
.x6-bank,.x6-ch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.x6-w.no,.x6-o.no{border-color:var(--g-red);background:var(--g-red-d);animation:gkShake .35s}
.x6-o{text-align:left;line-height:1.3;width:100%}
.x6-o.ok{border-color:var(--g-mint);background:var(--g-mint-d)}
.x6-chat{background:#E9E2D6;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:380px}
.x6-phtop{display:flex;align-items:center;gap:10px;background:#1F6F8B;color:#fff;padding:10px 12px}
.x6-av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:22px}
.x6-meter{margin-left:auto;width:90px;height:8px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}.x6-meter i{display:block;height:100%;width:0;background:#7FD3A2;transition:width .4s}
.x6-msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:12px;max-height:320px;overflow-y:auto}
.x6-bb{margin:0;max-width:84%;padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.4;color:#1D1B2B;animation:chPop .35s ease}
.x6-bb.me{align-self:flex-end;background:#D7F5C9;border-bottom-right-radius:4px}
.x6-bb.them{align-self:flex-start;background:#FFFFFF;border-bottom-left-radius:4px}
.x6-typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9AA;animation:gkBob .8s ease-in-out infinite}
.x6-typing i:nth-child(2){animation-delay:.15s}.x6-typing i:nth-child(3){animation-delay:.3s}
.x6-opts{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.x6-opts .gk-btn{text-align:left;line-height:1.3}
.x6-nat{background:var(--g-p);border:1px solid var(--g-l);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.x6-nat span{font-size:54px;line-height:1}.x6-nat b{font:800 19px/1.2 var(--display)}.x6-nat p{margin:4px 0 0;color:var(--g-gold);font-weight:700}
/* What to know (version 16) */
.x3-fl .fl-card{min-height:156px}
.x3-fl .fl-back{font-size:13.5px;line-height:1.3}
.x3-fl .fl-card:nth-child(5) .fl-front{background:#9B2C5A}.x3-fl .fl-card:nth-child(6) .fl-front{background:#0E5E73}
.x3-fl .fl-card:nth-child(5) .fl-back{border-color:#9B2C5A}.x3-fl .fl-card:nth-child(6) .fl-back{border-color:#0E5E73}
/* Sanctuary film voice button */
.sg-ctl .gk-btn[data-f="voice"]{min-width:118px}

/* ===== Version 16: more kinds of play ===== */
/* memory */
.x6-mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
@media (min-width:560px){.x6-mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.x6-mc{position:relative;height:92px;border:0;padding:0;background:none;cursor:pointer;perspective:600px;touch-action:manipulation;font:inherit}
.x6-mb,.x6-mf{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s ease}
.x6-mb{background:repeating-linear-gradient(45deg,#2E5E45 0 10px,#285440 10px 20px);border:2px solid #3E7A5B;color:#CFE9DA;font:900 30px/1 var(--display)}
.x6-mf{background:#FFFDF6;color:#1D1B2B;font:700 12px/1.2 var(--body);-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere;transform:rotateY(180deg);border:2px solid #E9B649}
.x6-mf.big{font:900 24px/1 var(--display);color:#7A1F4A}
.x6-mc.up .x6-mb{transform:rotateY(-180deg)}.x6-mc.up .x6-mf{transform:none}
.x6-mc.ok .x6-mf{background:#DDF6E6;border-color:var(--g-mint);animation:x6Pulse .5s ease}
@keyframes x6Pulse{50%{transform:scale(1.07)}}
/* pop */
.x6-pop{position:relative}
.x6-legend{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:var(--g-mu);margin-top:8px}
.x6-sky{position:relative;height:380px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.08) 0 30px,transparent 31px),radial-gradient(circle at 80% 60%,rgba(255,255,255,.06) 0 40px,transparent 41px),linear-gradient(#173A52,#0E2233)}
.x6-bub{position:absolute;bottom:-90px;width:64%;min-height:76px;padding:12px 16px;border-radius:40px;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.45),rgba(140,200,255,.22) 45%,rgba(90,150,220,.28));color:#fff;font:800 15px/1.25 var(--body);text-shadow:0 1px 2px rgba(0,0,0,.5);cursor:pointer;touch-action:manipulation;box-shadow:inset 0 -6px 14px rgba(0,0,0,.18)}
.x6-bub.l{left:5%}.x6-bub.r{right:5%}
.x6-bub.popped{animation:x6Burst .4s ease forwards;pointer-events:none}
.x6-bub.oops{border-color:var(--g-red);background:rgba(240,138,130,.35);animation:gkShake .4s}
@keyframes x6Burst{to{transform:scale(1.5);opacity:0}}
/* whack */
.x6-house{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:46px 12px 12px;border-radius:18px;position:relative;background:linear-gradient(#E8C9A6,#D9B48B);border:3px solid #9C6B3E}
.x6-house:before{content:"";position:absolute;left:-3px;right:-3px;top:-34px;height:44px;background:#B5452C;clip-path:polygon(50% 0,100% 100%,0 100%)}
.x6-win{position:relative;height:96px;border-radius:10px;border:4px solid #7A4E28;background:linear-gradient(#5D86A8,#2F5274);overflow:hidden;cursor:pointer;padding:0;touch-action:manipulation;font:inherit}
.x6-win:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - 2px),#7A4E28 calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px));pointer-events:none;transition:opacity .2s}
.x6-pop-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;background:#FFFDF6;color:#1D1B2B;transform:translateY(105%);transition:transform .18s ease}
.x6-pop-in i{font-style:normal;font-size:28px;line-height:1}.x6-pop-in b{font-size:12.5px;line-height:1.15;text-align:center}
.x6-win.up .x6-pop-in{transform:none}.x6-win.up:after{opacity:0}
.x6-win.ok .x6-pop-in{background:#DDF6E6}.x6-win.no .x6-pop-in{background:#FFE1DD;animation:gkShake .3s}
/* stack */
.x6-slots2{display:flex;flex-direction:column;gap:6px}
.x6-slot2{background:var(--g-p);border:1.5px dashed var(--g-l);border-radius:14px;padding:6px 8px;min-height:58px}
.x6-slot2 small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g-gold);margin-bottom:4px}
.x6-slot2.ok{border-style:solid;border-color:var(--g-mint);background:var(--g-mint-d)}
.x6-slot2.no{border-style:solid;border-color:var(--g-red);background:var(--g-red-d);animation:gkShake .35s}
.x6-empty{color:var(--g-mu);font-size:13px}
.x6-pool{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.x6-strip{width:100%;text-align:left;font:700 14px/1.3 var(--body);color:#1D1B2B;background:#FFFDF6;border:0;border-left:6px solid #E9B649;border-radius:10px;padding:9px 11px;cursor:pointer;touch-action:manipulation;animation:gkIn .2s ease}
.x6-strip.in{background:#FFF6DC}
/* planner */
.x6-rules{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.x6-rules span{font-size:12.5px;font-weight:800;color:#D4F5E2;background:var(--g-mint-d);border:1px solid #2F6B4A;border-radius:20px;padding:5px 9px}
.x6-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.x6-day{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:92px;padding:5px 2px;border-radius:12px;border:1.5px dashed var(--g-l);background:var(--g-p);color:var(--g-fg);cursor:pointer;font:inherit;touch-action:manipulation}
.x6-day small{font-size:11px;font-weight:800;color:var(--g-gold)}
.x6-day i{font-style:normal;font-size:22px;line-height:1}.x6-day b{font-size:10.5px;line-height:1.1;text-align:center}
.x6-day em{font-style:normal;color:var(--g-mu);font-size:22px;margin-top:14px}
.x6-day.hard{background:#3B2014;border-style:solid;border-color:#C9714C}.x6-day.easy{background:#13304A;border-style:solid;border-color:#5C9BD1}
.x6-day.rest,.x6-day.sabbath{background:#24203F;border-style:solid;border-color:#8F86D6}
.x6-day.no{border-color:var(--g-red);box-shadow:0 0 0 2px var(--g-red);animation:gkShake .35s}
.x6-tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.x6-tile{display:inline-flex;align-items:center;gap:6px;padding:9px 11px;border-radius:12px;border:1.5px solid var(--g-l);background:var(--g-p2);color:var(--g-fg);font:700 13.5px/1.1 var(--body);cursor:pointer;touch-action:manipulation}
.x6-tile i{font-style:normal;font-size:18px}
.x6-tile.hard{border-color:#C9714C}.x6-tile.easy{border-color:#5C9BD1}.x6-tile.rest,.x6-tile.sabbath{border-color:#8F86D6}
.x6-tile.sel{background:var(--g-gold);color:#2A1C00;border-color:var(--g-gold);transform:translateY(-2px)}
/* defend */
.x6-def{position:relative}
.x6-body{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.x6-lungs{font-size:12.5px;font-weight:800;color:var(--g-mu);letter-spacing:.06em;text-transform:uppercase}
.x6-hp{flex:1;height:12px;border-radius:8px;background:#0E1612;overflow:hidden;border:1px solid var(--g-l)}.x6-hp b{display:block;height:100%;background:linear-gradient(90deg,#F08A82,#7FD3A2);transition:width .3s}
.x6-def.hurt .x6-air{animation:gkShake .35s}
.x6-air{position:relative;height:300px;border-radius:16px;overflow:hidden;background:linear-gradient(90deg,rgba(240,138,130,.25) 0 54px,transparent 54px),linear-gradient(#18323F,#10222B)}
.x6-air:before{content:"🫁";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:34px;opacity:.85}
.x6-thing{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:6px 4px;border-radius:14px;border:2px solid transparent;color:#fff;cursor:pointer;touch-action:manipulation;font:inherit;background:rgba(255,255,255,.08)}
.x6-thing i{font-style:normal;font-size:30px;line-height:1}.x6-thing small{font-size:11.5px;font-weight:800;line-height:1.1;text-align:center}
.x6-thing.zap{animation:x6Burst .35s ease forwards;pointer-events:none}
.x6-thing.oops{border-color:var(--g-red);animation:gkShake .35s}

.x6-bar{display:flex;height:64px;border-radius:12px;overflow:hidden;border:1px solid var(--g-l);background:#0E1612}
.x6-seg{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;padding:0 2px;color:#1D1B2B;animation:gkIn .3s ease;border-right:2px solid #0E1612}
.x6-seg b{font-size:11px;line-height:1.1;text-align:center;overflow:hidden;max-width:100%}.x6-seg small{font-size:10.5px;font-weight:800}
.x6-seg.s0{background:#E9B649}.x6-seg.s1{background:#8DB8F0}.x6-seg.s2{background:#F0A38A}.x6-seg.s3{background:#7FD3A2}.x6-seg.s4{background:#C7A6F0}.x6-seg.s5{background:#F5D77A}
.x6-seg.rest{background:repeating-linear-gradient(45deg,#1A2620 0 8px,#22302A 8px 16px);color:var(--g-mu)}
.x6-tl .x6-o small{color:var(--g-mu);font-weight:600}
.x6-tlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px;font-weight:700;color:var(--g-fg)}

.x6-tlist i{width:12px;height:12px;border-radius:3px;flex:none}
.x6-tlist i.s0{background:#E9B649}.x6-tlist i.s1{background:#8DB8F0}.x6-tlist i.s2{background:#F0A38A}.x6-tlist i.s3{background:#7FD3A2}.x6-tlist i.s4{background:#C7A6F0}.x6-tlist i.s5{background:#F5D77A}
