  function bdLabel(p){ var o = BD_LBL[p[0]] || [14, 6, 'start']; return '<text x="' + (p[3] + o[0]) + '" y="' + (p[4] + o[1]) + '" text-anchor="' + o[2] + '">' + esc(p[1]) + '</text>'; }
  function bdWalk(total){
    var P = BD_MAP.p, full = P[P.length - 1][2], km = total / BD_PER_KM, lap = Math.floor(km / full), k = km - lap * full, at = 0;
    while (at < P.length - 1 && P[at + 1][2] <= k) at++;
    var a = P[at], b = P[Math.min(at + 1, P.length - 1)], f = b[2] > a[2] ? (k - a[2]) / (b[2] - a[2]) : 0, x = a[3] + (b[3] - a[3]) * f, y = a[4] + (b[4] - a[4]) * f;
    var done = P.slice(0, at + 1).map(function(p){ return p[3] + ',' + p[4]; }).join(' ') + ' ' + x.toFixed(1) + ',' + y.toFixed(1);
    var next = P[at + 1], sel = BD.place;
    var svg = '<svg class="bd-map" viewBox="-14 -14 ' + (BD_MAP.w + 28) + ' ' + (BD_MAP.h + 28) + '" role="img" aria-label="Map of Guyana with the class walk"><path class="bd-land" d="' + BD_MAP.d + '"/>'
      + '<polyline class="bd-route" points="' + P.map(function(p){ return p[3] + ',' + p[4]; }).join(' ') + '"/><polyline class="bd-done" points="' + done + '"/>'
      + P.map(function(p, i){ if (p[0] === 'gt2') return ''; var got = i <= at || lap > 0; return '<g class="bd-pin' + (got ? ' got' : '') + (sel === p[0] ? ' sel' : '') + '" data-bdplace="' + p[0] + '" tabindex="0" role="button" aria-label="' + esc(p[1]) + '"><circle cx="' + p[3] + '" cy="' + p[4] + '" r="' + (sel === p[0] ? 13 : 10) + '"/>' + bdLabel(p) + '</g>'; }).join('')
      + '<circle class="bd-me" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="15"/><text class="bd-walker" x="' + x.toFixed(1) + '" y="' + (y + 8).toFixed(1) + '" text-anchor="middle">🚶</text></svg>';
    var h = '<section class="panel bd-walk"><h2>🇬🇾 The class walk across Guyana</h2><p>Everyone’s steps add up. About ' + bdNum(BD_PER_KM) + ' steps make 1 km. The class has walked <b>' + bdNum(Math.floor(km)) + ' km</b> (' + bdNum(total) + ' steps)' + (lap ? ', and finished the whole route ' + lap + ' time' + (lap === 1 ? '' : 's') : '') + '.</p>'
      + (next ? '<p class="bd-next">Next stop: <b>' + esc(next[1]) + '</b>, ' + bdNum(Math.ceil(next[2] - k)) + ' km to go (' + bdNum(Math.ceil((next[2] - k) * BD_PER_KM)) + ' steps).</p>' : '')
      + svg;
    var pl = P.filter(function(p){ return p[0] === sel; })[0];
    if (pl) { var idx = P.indexOf(pl), got = idx <= at || lap > 0; h += '<div class="bd-fact"><b>' + esc(pl[1]) + '</b> · ' + (pl[2] ? bdNum(pl[2]) + ' km along the route' : 'the start') + '<p>' + (got ? esc(BD_FACT[pl[0]]) : '🔒 The class unlocks this place after ' + bdNum(Math.ceil(pl[2] - k)) + ' more km.') + '</p></div>'; }
    else h += '<p class="bd-tip">Tap a place on the map.</p>';
    return h + '<p class="bd-src">Distances are straight lines between the places on the map.</p></section>';
  }

  /* The optional screenshot: shrunk on the phone, saved as an HF 2 photo, then the steps. */
  function bdShot(x){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){

        var img = new Image();
        img.onload = function(){

          var ph = { data: shrink(1600, 0.85), mime: 'image/jpeg', preview: shrink(640, 0.7), caption: 'Steps on ' + bdDay(x.date) + ': ' + bdNum(x.n) };

  /* ---------- reading time, chapters and Memory Gem practice ---------- */
  var RT = { act: Date.now(), key: '', cs: {} };

  function rtAudio(){ var on = false; [].forEach.call(document.querySelectorAll('audio'), function(a){ if (!a.paused && !a.ended) on = true; }); return on; }
  function rtPend(){ try { return JSON.parse(localStorage.getItem('gq-rt') || '{}') || {}; } catch (e) { return {}; } }
  function rtSave(p){ try { localStorage.setItem('gq-rt', JSON.stringify(p)); } catch (e) {} }
  function rtFlush(){
    if (!TOKEN || !hasRun() || RT.sending) return;
    var p = rtPend(), today = bdToday();
    Object.keys(p).forEach(function(k){
      var parts = k.split('|'), min = Math.floor(p[k] / 60);

      if (parts[1] < bdAdd(today, -1)) { delete p[k]; return; }

  app.addEventListener('click', function(e){
    var w = e.target.closest('[data-w]');
    if (w){ var gm = gstate(S.topic); gm.shown[w.getAttribute('data-w')] = true; render(); return; }
    var b = e.target.closest('button'); if (!b) return;
    var d = b.dataset;
    if (d.topic){ goTopic(d.topic); return; }
    if (d.tab){ S.big = false; S.tab = d.tab; if (d.tab === 'challenge' && S.ch && S.ch.done) startChallenge(S.topic); render(); window.scrollTo(0, 0); return; }
    if (d.card){ S.sel = d.card; S.big = true; S.tab = 'learn'; markSeen(S.topic, d.card); render(); return; }
    if (d.face){ var fg = S.face; if (!fg || fg.pick) return; fg.pick = d.face; if (d.face === fg.r[fg.i].id) fg.score++; render(); return; }
    if (d.find){
      var ff = S.find[S.topic]; if (!ff || ff.hit) return;
      if (d.find === ff.order[ff.i]){
        ff.hit = d.find; ff.wrong = ''; if (!ff.missed) ff.score++; render();
        setTimeout(function(){ ff.hit = ''; ff.missed = false; ff.i++; if (S.tab === 'game') render(); }, 700);
      } else { ff.wrong = d.find; ff.missed = true; render(); }
      return;
    }
    if (d.ans !== undefined){ answer(d.ans); return; }
    if (d.order !== undefined){
      var G = L[S.topic].game, g = gstate(S.topic), next = G.items[g.done.length];
      if (d.order === next){ g.done.push(next); g.wrong = ''; } else g.wrong = d.order;
      render(); return;
    }
    if (d.pack !== undefined){ var gp = gstate(S.topic); gp.picked[d.pack] = !gp.picked[d.pack]; gp.checked = false; render(); return; }
    if (d.mem !== undefined){ var gmm = gstate(S.topic); gmm.level = +d.mem; gmm.shown = {}; render(); return; }
    switch (d.act){
      case 'hub': S.read = null; S.topic = ''; S.ch = null; S.big = false; render(); window.scrollTo(0, 0); break;
      case 'findagain': S.find[S.topic] = newFind(S.topic); render(); break;
      case 'close': S.big = false; render(); break;
      case 'facenext': S.face.i++; S.face.pick = ''; render(); break;
      case 'faceagain': S.face = newFace(); render(); break;
      case 'greset': S.game[S.topic] = newGame(S.topic); if (L[S.topic].game.type === 'memorise') S.game[S.topic].level = gstate(S.topic).level; render(); break;
      case 'packcheck': gstate(S.topic).checked = true; render(); break;
      case 'ccheck':
        var gc = gstate(S.topic), tgt = gc.targets[gc.round], diff = Math.abs(((gc.deg - tgt) % 360 + 540) % 360 - 180);
        gc.last = gc.deg; gc.result = diff <= 7 ? 'ok' : 'no'; if (gc.result === 'ok') gc.score++; render(); break;
      case 'cnext': var gn = gstate(S.topic); gn.round++; gn.result = ''; render(); break;
      case 'next':
        S.ch.i++; S.ch.answered = false; S.ch.chosen = null; S.ch.right = false;
        if (S.ch.i >= S.ch.qs.length){ S.ch.done = true; submitScore(); }
        render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
      case 'again': startChallenge(S.topic); render(); break;
      case 'resave': submitScore(); break;
      case 'nojoin': joinShown = false; joinOpen = false; render(); break;
      case 'joinopen': joinOpen = !joinOpen; render(); break;
      case 'notme':
        try { localStorage.removeItem(JOINKEY); } catch(err){}
        TOKEN = ''; B.name = ''; seen = {}; best = {}; joinShown = true; joinMsg = ''; render(); window.scrollTo(0, 0); break;
    }
  });
  app.addEventListener('change', function(e){
    var t = e.target;
    if (t.dataset && t.dataset.match !== undefined){ gstate(S.topic).picks[t.dataset.match] = t.value; render(); }
  });
  app.addEventListener('input', function(e){
    var t = e.target;
    if (t.id === 'dial'){
      var g = gstate(S.topic); g.deg = +t.value;
      var ar = document.getElementById('arrow'); if (ar) ar.setAttribute('transform', 'rotate('+g.deg+' 150 150)');
      var rd = document.getElementById('degread'); if (rd) rd.textContent = g.deg + '° ' + pointOf(g.deg);
    }
  });
  app.addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('joinname'), name = String(inp && inp.value || '').replace(/\s+/g, ' ').trim();
    if (name.length < 2){ joinMsg = 'Type your first and last name.'; render(); return; }
    if (!hasRun()){ joinMsg = 'Saving only works from the class link.'; render(); return; }
    joinBusy = true; joinMsg = ''; render();
    google.script.run
      .withSuccessHandler(function(me){ adopt(me); })
      .withFailureHandler(function(err){ var m = String(err && err.message || err), code = (m.match(/bad-name|full|busy/) || [''])[0]; joinBusy = false; joinMsg = JOIN_ERR[code] || 'Couldn’t save. Check your internet and try again.'; render(); })
      .l_join(name);
  });

  if (TOKEN){
    try { localStorage.setItem(JOINKEY, TOKEN); } catch(e){}
  } else if (B.join && hasRun()){
    var remembered = '';
    try { remembered = localStorage.getItem(JOINKEY) || ''; } catch(e){}
    if (remembered){
      google.script.run
        .withSuccessHandler(function(me){ adopt(me); })
        .withFailureHandler(function(){ try { localStorage.removeItem(JOINKEY); } catch(e){} joinShown = true; render(); })
        .l_whoami(remembered);
    } else joinShown = true;
  }
  render();
})();
</script>
<script>if (!window.__gqRouted) gqStart({"p": "learn"});</script>
