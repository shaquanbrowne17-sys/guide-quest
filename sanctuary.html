<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanctuary Explorer</title>
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@1,7..72,400;1,7..72,500&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}
body{margin:0}
/* Layout: a top-down map of the wilderness sanctuary is the hero; the reading panel sits beside it (desktop) or slides up over it (phone). */
:root{
  --linen:#F5F3EE; --surface:#FFFFFF; --surface2:#ECE8DF; --ink:#1D1B2B; --muted:#5C596D; --line:#DEDAD0;
  --primary-bg:#2B4C8C; --primary-fg:#FFFFFF; --scarlet:#B3202A;
  --court-ink:#8A4F22; --court-soft:#F3E3D3; --holy-ink:#8F6A08; --holy-soft:#F7EDCF; --most-ink:#2B4C8C; --most-soft:#E1E8F5;
  --good:#1E7A46; --good-soft:#DDF0E3; --bad:#B3261E; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(29,27,43,.06),0 10px 30px rgba(29,27,43,.08);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --scripture:'Literata',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --linen:#13121C; --surface:#1D1C2A; --surface2:#2A2939; --ink:#ECEAF4; --muted:#A8A5BB; --line:#34324A;
    --primary-bg:#9DB5EE; --primary-fg:#13121C; --scarlet:#FF8A8A;
    --court-ink:#E6A673; --court-soft:#36261A; --holy-ink:#E9C25A; --holy-soft:#352C12; --most-ink:#A7BDF0; --most-soft:#1D2648;
    --good:#62D092; --good-soft:#173826; --bad:#FF8F84; --bad-soft:#3A1A17;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --linen:#13121C; --surface:#1D1C2A; --surface2:#2A2939; --ink:#ECEAF4; --muted:#A8A5BB; --line:#34324A;
  --primary-bg:#9DB5EE; --primary-fg:#13121C; --scarlet:#FF8A8A;
  --court-ink:#E6A673; --court-soft:#36261A; --holy-ink:#E9C25A; --holy-soft:#352C12; --most-ink:#A7BDF0; --most-soft:#1D2648;
  --good:#62D092; --good-soft:#173826; --bad:#FF8F84; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--linen);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--scarlet);outline-offset:2px}
.page{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
body.sheet-open .page{padding-block-end:64vh}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.head h1{font-size:clamp(30px,6vw,44px);line-height:1;font-weight:800}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.me a{color:var(--primary-bg);font-weight:800}
.head .sub{font-family:var(--scripture);font-style:italic;color:var(--muted);font-size:15px;margin-top:6px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{min-height:42px;padding:0 18px;border:none;border-radius:10px;background:transparent;font-weight:800;font-size:15px;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:820px){
  .layout{grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:28px}
  .mapcol{position:sticky;top:calc(12px + env(safe-area-inset-top, 0px))}
}
.mapcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.mapframe{border-radius:22px;overflow:hidden;background:#E2D0A8;box-shadow:var(--shadow);line-height:0}
.mapframe svg{display:block;width:100%;height:auto;max-height:78vh}
.mapnote{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.seen{border-color:currentColor}
.chip.c-court{color:var(--court-ink)} .chip.c-holy{color:var(--holy-ink)} .chip.c-most{color:var(--most-ink)}
.chip.c-court .dot{background:var(--court-ink)} .chip.c-holy .dot{background:var(--holy-ink)} .chip.c-most .dot{background:var(--most-ink)}
.chip svg{flex-shrink:0}

/* map parts */
.part{cursor:pointer;outline:none}
.part .hit{fill:transparent}
.part:hover .hit{fill:rgba(255,255,255,.12)}
.part .ring{pointer-events:none;fill:none;stroke:#B3202A;stroke-width:5;stroke-dasharray:10 8;opacity:0;transition:opacity .2s}
.part.is-sel .ring,.part:focus-visible .ring{opacity:1}
.part:focus-visible .ring{stroke:#2B4C8C}
.part.is-correct .ring{opacity:1;stroke:#1E7A46;stroke-dasharray:none;stroke-width:7}
.part.is-wrong .ring{opacity:1;stroke:#B3261E;stroke-dasharray:none;stroke-width:7}
.zone{cursor:pointer}
.zone .zfill{transition:stroke .2s}
.zone.is-sel .zfill{stroke:#B3202A;stroke-width:6}
.lbl{font-family:'Figtree',sans-serif;font-weight:800;font-size:21px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.lbl.dk{fill:#3B2A12;stroke:#F2E7CC;stroke-width:5}
.lbl.lt{fill:#FFFFFF;stroke:rgba(0,0,0,.35);stroke-width:4}
.slbl{font-family:'Figtree',sans-serif;font-weight:800;font-size:16px;letter-spacing:3px;pointer-events:none}
.no-labels .lbl{display:none}
.smoke{animation:drift 3.2s ease-in-out infinite;transform-origin:300px 360px}
@keyframes drift{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:.95;transform:translateY(-4px)}}
.marker{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.smoke,.marker{animation:none}}

/* panel */
.panel{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:clamp(24px,4.4vw,30px);line-height:1.1;font-weight:800}
.panel h3{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cardtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardtop .sp{flex:1}
.sec{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.sec-court{background:var(--court-soft);color:var(--court-ink)}
.sec-holy{background:var(--holy-soft);color:var(--holy-ink)}
.sec-most{background:var(--most-soft);color:var(--most-ink)}
.sec-between{background:var(--surface2);color:var(--ink)}
.stepno{font-size:13px;font-weight:700;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.facts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.facts li::marker{color:var(--muted)}
.points{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.points.court{background:var(--court-soft)} .points.holy{background:var(--holy-soft)} .points.most{background:var(--most-soft)} .points.between{background:var(--surface2)}
.points b{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.points.court b{color:var(--court-ink)} .points.holy b{color:var(--holy-ink)} .points.most b{color:var(--most-ink)} .points.between b{color:var(--ink)}
.points p{font-size:17px;font-weight:600;line-height:1.45}
.verse{margin:0;padding:4px 0 4px 16px;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:4px}
.verse p{font-family:var(--scripture);font-style:italic;font-size:17px;line-height:1.5}
.verse cite{font-style:normal;font-size:13px;font-weight:800;color:var(--muted)}
.life{font-size:15px}
.life b{font-weight:800}
.think{font-size:15px;color:var(--muted)}
.think b{color:var(--ink)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:2px solid transparent;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--primary-bg);color:var(--primary-fg)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-grow{flex:1 1 160px}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav .btn{flex:1 1 140px}
.progress{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.bar{display:block;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--scarlet);transition:width .4s}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.room{border:none;border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:76px}
.room b{font-family:var(--display);font-size:16px;line-height:1.15}
.room span{font-size:12.5px;font-weight:600}
.room.court{background:var(--court-soft);color:var(--court-ink)} .room.holy{background:var(--holy-soft);color:var(--holy-ink)} .room.most{background:var(--most-soft);color:var(--most-ink)}
@media (max-width:420px){.rooms{grid-template-columns:minmax(0,1fr)}.room{min-height:0}}
.intro-verse{margin:0;display:flex;flex-direction:column;gap:4px}
.intro-verse p{font-family:var(--scripture);font-style:italic;font-size:19px;line-height:1.45}
.intro-verse cite{font-style:normal;font-size:13px;font-weight:800;color:var(--muted)}

/* challenge */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.pill{padding:4px 10px;border-radius:999px;background:var(--surface2);font-variant-numeric:tabular-nums}
.pill.hot{background:var(--holy-soft);color:var(--holy-ink)}
.qtext{font-family:var(--display);font-size:clamp(20px,4vw,24px);line-height:1.25;font-weight:700}
.qverse{font-family:var(--scripture);font-style:italic;font-size:18px;line-height:1.45}
.tapnote{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--scarlet);font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--primary-bg)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-family:var(--display);font-size:18px}
.feedback.ok b{color:var(--good)} .feedback.no b{color:var(--bad)}
.stars{display:flex;gap:6px}
.endscore{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.qbar{height:6px}
.join{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;border:2px solid var(--primary-bg)}
.join .jt{font-family:var(--display);font-size:19px;font-weight:800}
.join p{font-size:15px;color:var(--muted)}
.join form{display:flex;gap:8px;flex-wrap:wrap}
.join input{flex:1 1 200px;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--linen);color:var(--ink);padding:10px 12px;font:16px var(--body)}
.join input:focus{outline:none;border-color:var(--primary-bg)}
.join .err{color:var(--bad);font-weight:700;font-size:14px}
.join .tip{font-size:13px}
.linkbtn{background:none;border:none;padding:0;color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer;width:max-content}

/* phone sheet */
@media (max-width:819px){
  .layout.challenge .panel{order:-1}
  .panel.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:62vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .panel.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 2px}
}
</style>
<style>
.gq-load{max-width:420px;margin:18vh auto 0;padding:24px;text-align:center;font:16px/1.5 Figtree,system-ui,sans-serif;color:#526057;display:flex;flex-direction:column;align-items:center;gap:10px}
.gq-load b{font-size:20px;color:#17231C}
.gq-load button{min-height:44px;padding:0 20px;border-radius:12px;border:none;background:#1F4D3A;color:#fff;font:800 15px Figtree,system-ui,sans-serif;cursor:pointer}
.gq-spin{width:34px;height:34px;border-radius:50%;border:4px solid #D2D9CA;border-top-color:#1F4D3A;animation:gqspin 0.9s linear infinite}
@keyframes gqspin{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){.gq-load{color:#A7B4AA}.gq-load b{color:#E9EFE6}.gq-load button{background:#86CFA0;color:#0E1612}.gq-spin{border-color:#2E3D34;border-top-color:#86CFA0}}
</style>
</head>
<body>
<script src="gq.js"></script>


<div class="page">
  <header class="head">
    <div>
      <div class="eyebrow">Pathfinder Guide class · SD 2</div>
      <h1>Sanctuary Explorer</h1>
      <p class="sub">“Thy way, O God, is in the sanctuary.” Psalm 77:13</p>
    </div>
    <div class="seg" role="tablist" aria-label="Mode">
      <button id="tab-explore" role="tab" aria-selected="true" data-mode="explore">Explore</button>
      <button id="tab-challenge" role="tab" aria-selected="false" data-mode="challenge">Challenge</button>
    </div>
  </header>
  <div id="whoami" hidden></div>
  <div id="join" class="join" hidden></div>

  <div class="layout" id="layout">
    <div class="mapcol">
      <div class="mapframe">
        <svg id="map" viewBox="0 0 600 1000" role="group" aria-label="Top-down map of the sanctuary. The gate faces east, at the bottom.">
          <defs>
            <pattern id="weave" width="16" height="16" patternUnits="userSpaceOnUse">
              <rect width="4" height="16" fill="#2B4C8C"/><rect x="4" width="4" height="16" fill="#6B2D6B"/><rect x="8" width="4" height="16" fill="#B3202A"/><rect x="12" width="4" height="16" fill="#F7F4EA"/>
            </pattern>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFF6D6" stop-opacity=".75"/>
              <stop offset="55%" stop-color="#FFE7A0" stop-opacity=".22"/>
              <stop offset="100%" stop-color="#FFE7A0" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect x="0" y="0" width="600" height="1000" fill="#E2D0A8"/>

          <!-- Courtyard (zone) -->
          <g class="zone" data-id="court" aria-label="Courtyard">
            <rect class="zfill" x="30" y="30" width="540" height="940" fill="#F2E7CC" stroke="none"/>
          </g>
          <text class="slbl" x="96" y="720" fill="#8C7444" transform="rotate(-90 96 720)">COURTYARD</text>

          <!-- Linen fence -->
          <g class="part" data-id="fence" tabindex="0" role="button" aria-label="White linen fence">
            <rect x="30" y="30" width="540" height="940" fill="none" stroke="transparent" stroke-width="36" class="hit" style="fill:none;pointer-events:stroke"/>
            <rect x="30" y="30" width="540" height="940" fill="none" stroke="#FFFDF6" stroke-width="9"/>
            <rect x="24.5" y="24.5" width="551" height="951" fill="none" stroke="#C3B086" stroke-width="1.5"/>
            <g id="posts" fill="#B9B3A4"></g>
            <text class="lbl dk" x="548" y="500" text-anchor="middle" transform="rotate(90 548 500)" style="font-size:17px;letter-spacing:2px">LINEN FENCE</text>
            <rect class="ring" x="30" y="30" width="540" height="940" rx="4"/>
          </g>

          <!-- Tent: Holy Place + Most Holy Place zones -->
          <g class="zone" data-id="most" aria-label="Most Holy Place">
            <rect class="zfill" x="185" y="85" width="230" height="235" fill="#1F2754"/>
          </g>
          <circle cx="300" cy="195" r="110" fill="url(#glow)" pointer-events="none"/>
          <g class="zone" data-id="holy" aria-label="Holy Place">
            <rect class="zfill" x="185" y="325" width="230" height="315" fill="#3A2F1C"/>
          </g>
          <path d="M180 640 V80 H420 V640" fill="none" stroke="#D9A520" stroke-width="10" pointer-events="none"/>
          <rect x="180" y="634" width="240" height="12" fill="url(#weave)" pointer-events="none"/>
          <text class="slbl" x="300" y="116" text-anchor="middle" fill="#C9D3F2">MOST HOLY PLACE</text>
          <text class="slbl" x="300" y="618" text-anchor="middle" fill="#E9D49A">HOLY PLACE</text>

          <!-- Path line (walk-through) -->
          <g id="pathlayer" pointer-events="none"></g>

          <!-- Gate -->
          <g class="part" data-id="gate" tabindex="0" role="button" aria-label="The gate">
            <rect class="hit" x="186" y="925" width="228" height="70"/>
            <rect x="200" y="962" width="200" height="16" fill="url(#weave)" stroke="#5A2A5A" stroke-width="1.5"/>
            <circle cx="200" cy="970" r="7" fill="#B9B3A4"/><circle cx="400" cy="970" r="7" fill="#B9B3A4"/>
            <text class="lbl dk" x="300" y="948" text-anchor="middle">Gate</text>
            <rect class="ring" x="190" y="928" width="220" height="62" rx="12"/>
          </g>

          <!-- Altar of burnt offering -->
          <g class="part" data-id="altar" tabindex="0" role="button" aria-label="Altar of burnt offering">
            <rect class="hit" x="228" y="778" width="190" height="134"/>
            <rect x="258" y="803" width="84" height="84" rx="3" fill="#A35F2A" stroke="#6E3D17" stroke-width="2"/>
            <rect x="272" y="817" width="56" height="56" fill="#4E2E14"/>
            <path d="M286 817V873M300 817V873M314 817V873M272 831H328M272 845H328M272 859H328" stroke="#7A4A22" stroke-width="2"/>
            <rect x="251" y="796" width="17" height="17" rx="3" fill="#C9844A"/><rect x="332" y="796" width="17" height="17" rx="3" fill="#C9844A"/>
            <rect x="251" y="877" width="17" height="17" rx="3" fill="#C9844A"/><rect x="332" y="877" width="17" height="17" rx="3" fill="#C9844A"/>
            <path d="M300 820C312 834 319 846 311 859C306 867 293 867 289 859C283 848 290 840 296 831C296 842 302 846 305 840C307 834 304 827 300 820Z" fill="#F28C28"/>
            <path d="M300 842C306 849 308 855 304 860C301 864 296 863 295 858C294 853 297 849 300 842Z" fill="#FFD15C"/>
            <text class="lbl dk" x="360" y="852" text-anchor="start">Altar</text>
            <circle class="ring" cx="300" cy="845" r="66"/>
          </g>

          <!-- Laver -->
          <g class="part" data-id="laver" tabindex="0" role="button" aria-label="The laver">

  /* ---------- challenge ---------- */
  var BANK = Array.isArray(B.questions) ? B.questions.filter(function(q){ return q && q.q && Array.isArray(q.opts) && q.opts[q.correct]; }) : [];
  var TAPPABLE = ['gate','altar','laver','lampstand','table','incense','veil','ark'];
  var ROOMABLE = ['gate','fence','altar','laver','lampstand','table','incense','ark'];
  var ITEM_IDS = Object.keys(ITEMS);
  function makeQuestions(){
    var qs = [];
    shuffle(TAPPABLE).slice(0,3).forEach(function(id){ qs.push({ type:'tap', item:id }); });
    if (BANK.length){
      shuffle(BANK).slice(0,7).forEach(function(b){
        qs.push({ type:'bank', b:b, order: shuffle([0,1,2,3].filter(function(i){ return !!b.opts[i]; })) });
      });
    } else {
      shuffle(ROOMABLE).slice(0,3).forEach(function(id){ qs.push({ type:'room', item:id, opts:['court','holy','most'] }); });
      shuffle(ITEM_IDS).slice(0,2).forEach(function(id){
        qs.push({ type:'meaning', item:id, opts: shuffle([id].concat(shuffle(ITEM_IDS.filter(function(x){ return x !== id; })).slice(0,3))) });
      });
      shuffle(ITEM_IDS).slice(0,2).forEach(function(id){
        qs.push({ type:'verse', item:id, opts: shuffle([id].concat(shuffle(ITEM_IDS.filter(function(x){ return x !== id; })).slice(0,3))) });
      });
    }
    return shuffle(qs);
  }
  function startChallenge(){
    S.ch = { qs: makeQuestions(), i:0, score:0, streak:0, answered:false, chosen:null, right:false, done:false, log:[], save:'' };
  }
  function logAnswer(q, choice, right){
    var skip = choice === '__skip', e;
    if (q.type === 'tap'){
      e = { type:'tap', qid:'tap-'+q.item, q:'Tap where the '+ITEMS[q.item].name.replace(/^The /,'')+' was', chosen: skip ? 'Skipped' : (ITEMS[choice] ? ITEMS[choice].name : String(choice)), correct: ITEMS[q.item].name, right: right };
    } else if (q.type === 'bank'){
      e = { type:'bank', qid:q.b.id, q:q.b.q, chosenIndex: skip ? -1 : Number(choice), chosen: skip ? 'Skipped' : (q.b.opts[Number(choice)] || ''), correct: q.b.opts[q.b.correct], right: right };
    } else {
      var it = ITEMS[q.item];
      e = { type:'tap', qid:q.type+'-'+q.item, q:q.type === 'room' ? 'Which part was the '+it.name+' in?' : q.type === 'meaning' ? 'What does the '+it.name+' point to?' : 'Which part goes with '+it.verse.r+'?', chosen: String(choice), correct: q.type === 'room' ? SEC_LABEL[it.sec] : it.name, right: right };
    }
    S.ch.log.push(e);
  }
  function answer(choice){
    var ch = S.ch, q = ch.qs[ch.i];
    if (ch.answered) return;
    var right;
    if (q.type === 'tap') right = choice === q.item;
    else if (q.type === 'bank') right = String(choice) === String(q.b.correct);
    else if (q.type === 'room') right = choice === (ITEMS[q.item].sec);
    else right = choice === q.item;
    ch.answered = true; ch.chosen = choice; ch.right = right;
    if (right){ ch.score++; ch.streak++; } else ch.streak = 0;
    logAnswer(q, choice, right);
    render();
    if (isPhone() && q.type !== 'tap') setTimeout(function(){ var fb = document.getElementById('feedback'); if (fb) fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); }, 30);
  }
  function submitScore(){
    var ch = S.ch;
    if (!TOKEN || !hasRun()) return;
    ch.save = 'saving'; render();
    google.script.run
      .withSuccessHandler(function(res){ ch.save = 'saved'; if (res && res.best > best) best = res.best; if (S.ch === ch) render(); })
      .withFailureHandler(function(){ ch.save = 'error'; if (S.ch === ch) render(); })
      .s_submit(TOKEN, { answers: ch.log });
  }
  function nextQuestion(){
    var ch = S.ch;
    ch.i++; ch.answered = false; ch.chosen = null; ch.right = false;
    if (ch.i >= ch.qs.length){
      ch.done = true;
      if (ch.score > best){ best = ch.score; try { localStorage.setItem('sanctuary-best' + LSK, String(best)); } catch(e){} }
      submitScore();
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function challengeHTML(){
    var ch = S.ch, total = ch.qs.length;
    if (ch.done){
      var sc = ch.score, pct = total ? sc / total : 0, stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;
      var title = sc === total ? 'High priest level' : pct >= 0.8 ? 'Faithful priest' : pct >= 0.5 ? 'Levite in training' : 'Keep exploring';
      var msg = sc === total ? 'Perfect. You know God’s house inside and out.' : pct >= 0.8 ? 'Excellent work. Just a couple to review.' : pct >= 0.5 ? 'Good start. Explore the parts you missed, then try again.' : 'Walk through the sanctuary once more, then come back.';
      var saveLine = '';
      if (TOKEN){
        saveLine = ch.save === 'saving' ? '<p class="think">Saving your score…</p>'
          : ch.save === 'saved' ? '<p class="think" style="color:var(--good)"><b style="color:var(--good)">Saved.</b> Your counsellor can see this score.</p>'
          : ch.save === 'error' ? '<p class="think" style="color:var(--bad)">Couldn’t save your score. Check your internet. <button class="btn btn-ghost" data-act="resave" style="min-height:40px;margin-top:6px">Try again</button></p>' : '';
      } else if (B.join){
        saveLine = '<p class="think"><b>Want your counsellor to see this score?</b> Type your name in the box at the top and it saves straight away.</p>';
      }
      return '<span class="eyebrow">Challenge complete</span>'
        + '<div class="stars" style="color:var(--line)">'+STAR(stars>=1)+STAR(stars>=2)+STAR(stars>=3)+'</div>'
        + '<div class="endscore">'+sc+'<span style="font-size:24px;color:var(--muted)"> / '+total+'</span></div>'
        + '<h2>'+title+'</h2><p>'+msg+'</p>' + saveLine
        + '<p class="think">Your best score: <b>'+best+'</b></p>'
        + '<div class="btnrow"><button class="btn btn-primary btn-grow" data-act="again">Play again</button><button class="btn btn-ghost btn-grow" data-mode="explore">Back to exploring</button></div>';
    }
    var q = ch.qs[ch.i], it = q.item ? ITEMS[q.item] : null, h = '';
    h += '<div class="qhead"><span class="eyebrow">Question '+(ch.i+1)+' of '+total+'</span><span class="score"><span class="pill">Score '+ch.score+'</span>'+(ch.streak >= 2 ? '<span class="pill hot">'+ch.streak+' in a row</span>' : '')+'</span></div>';
    h += '<span class="bar qbar"><span style="width:'+Math.round(100*ch.i/total)+'%"></span></span>';
    var dis = ch.answered ? ' disabled' : '';
    if (q.type === 'tap'){
      h += '<p class="qtext">Tap where the '+esc(it.name.replace(/^The /,'').toLowerCase().replace('ark of the covenant','Ark of the Covenant'))+' was.</p>';
      if (!ch.answered) h += '<p class="tapnote">'+TAP+(isPhone() ? 'Tap the right spot on the map below' : 'Tap the right spot on the map')+'</p><button class="btn btn-ghost" data-act="skip">I’m not sure, show me</button>';
    } else if (q.type === 'bank'){
      h += '<p class="qtext">'+esc(q.b.q)+'</p><div class="opts">';
      h += q.order.map(function(oi, k){
        var cls = ''; if (ch.answered){ if (oi === q.b.correct) cls = ' right'; else if (String(oi) === String(ch.chosen)) cls = ' wrong'; }
        return '<button class="opt'+cls+'" data-ans="'+oi+'"'+dis+'><span class="k">'+'ABCD'[k]+'</span>'+esc(q.b.opts[oi])+'</button>';
      }).join('') + '</div>';
    } else if (q.type === 'room'){
      h += '<p class="qtext">Which part of the sanctuary was the '+esc(it.name.replace(/^The /,'').replace('White Linen Fence','white linen fence'))+' in?</p><div class="opts">';
      h += q.opts.map(function(o){
        var cls = ''; if (ch.answered){ if (o === it.sec) cls = ' right'; else if (o === ch.chosen) cls = ' wrong'; }
        return '<button class="opt'+cls+'" data-ans="'+o+'"'+dis+'><span class="sec sec-'+o+'">'+esc(SEC_LABEL[o])+'</span></button>';
      }).join('') + '</div>';
    } else if (q.type === 'meaning'){
      h += '<p class="qtext">What does the '+esc(it.name.replace(/^The /,''))+' point to?</p><div class="opts">';
      h += q.opts.map(function(o, k){
        var cls = ''; if (ch.answered){ if (o === q.item) cls = ' right'; else if (o === ch.chosen) cls = ' wrong'; }
        return '<button class="opt'+cls+'" data-ans="'+o+'"'+dis+'><span class="k">'+'ABCD'[k]+'</span>'+esc(ITEMS[o].short)+'</button>';
      }).join('') + '</div>';
    } else {
      h += '<p class="qtext">Which part of the sanctuary goes with this verse?</p><p class="qverse">“'+esc(it.verse.t)+'”<br><span style="font-family:var(--body);font-style:normal;font-size:13px;font-weight:800;color:var(--muted)">'+esc(it.verse.r)+'</span></p><div class="opts">';
      h += q.opts.map(function(o, k){
        var cls = ''; if (ch.answered){ if (o === q.item) cls = ' right'; else if (o === ch.chosen) cls = ' wrong'; }
        return '<button class="opt'+cls+'" data-ans="'+o+'"'+dis+'><span class="k">'+'ABCD'[k]+'</span>'+esc(ITEMS[o].name)+'</button>';
      }).join('') + '</div>';
    }
    if (ch.answered){
      var head = ch.right ? 'Correct!' : (ch.chosen === '__skip' ? 'Here it is.' : 'Not quite.'), body = '';
      if (q.type === 'bank'){
        body = (ch.right ? '' : '<p>The answer is: <b>'+esc(q.b.opts[q.b.correct])+'</b></p>') + (q.b.why ? '<p style="font-size:15px">'+esc(q.b.why)+'</p>' : '');
      } else {
        var line = q.type === 'room' ? it.name + ' was in the ' + SEC_LABEL[it.sec] + '.'
          : q.type === 'tap' ? 'It’s circled on the map in green.'
          : it.name + ': ' + it.short + '.';
        body = '<p>'+esc(line)+'</p><p style="font-size:15px">'+esc(it.points)+'</p>';
      }
      h += '<div class="feedback '+(ch.right?'ok':'no')+'" id="feedback"><b>'+head+'</b>'+body+'</div>';
      h += '<button class="btn btn-primary" data-act="next">'+(ch.i + 1 < total ? 'Next question' : 'See my score')+'</button>';
    }
    return h;
  }

  /* ---------- render ---------- */
  function render(){
    document.getElementById('tab-explore').setAttribute('aria-selected', S.mode === 'explore');
    document.getElementById('tab-challenge').setAttribute('aria-selected', S.mode === 'challenge');
    layout.classList.toggle('challenge', S.mode === 'challenge');
    var sheet = S.mode === 'explore' && !!S.sel;
    panel.classList.toggle('sheet', sheet && isPhone());
    document.body.classList.toggle('sheet-open', sheet && isPhone());
    if (S.mode === 'challenge') panel.innerHTML = challengeHTML();
    else panel.innerHTML = S.sel ? cardHTML(S.sel) : introHTML();
    paintChips();
    paintMap();
  }

  /* ---------- events ---------- */
  function onMapPick(id){
    if (S.mode === 'explore'){ select(id, S.walking && PATH.indexOf(id) > -1); return; }
    var ch = S.ch; if (!ch || ch.done) return;
    var q = ch.qs[ch.i];
    if (q.type === 'tap' && !ch.answered && TAPPABLE.concat(['fence']).indexOf(id) > -1) answer(id);
  }
  map.addEventListener('click', function(e){
    var el = e.target.closest('.part, .zone');
    if (!el) return;
    var id = el.getAttribute('data-id');
    if (S.mode === 'challenge' && el.classList.contains('zone')) return;
    onMapPick(id);
  });
  map.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest('.part'); if (!el) return;
    e.preventDefault(); onMapPick(el.getAttribute('data-id'));
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b || map.contains(b)) return;
    var d = b.dataset;
    if (d.mode){
      S.mode = d.mode; S.sel = null; S.walking = false;
      if (S.mode === 'challenge' && (!S.ch || S.ch.done)) startChallenge();
      render(); window.scrollTo({ top:0, behavior:'smooth' }); return;
    }
    if (d.go){ select(d.go, !!d.walk); return; }
    if (d.ans){ answer(d.ans); return; }
    switch (d.act){
      case 'walk': select('court', true); break;
      case 'walkfrom': select(d.id, true); break;
      case 'finishwalk': S.walking = false; S.sel = null; render(); window.scrollTo({ top:0, behavior:'smooth' }); break;
      case 'close': S.sel = null; S.walking = false; render(); break;
      case 'skip': var sq = S.ch.qs[S.ch.i]; S.ch.answered = true; S.ch.chosen = '__skip'; S.ch.right = false; S.ch.streak = 0; logAnswer(sq, '__skip', false); render(); break;
      case 'next': nextQuestion(); break;
      case 'again': startChallenge(); render(); window.scrollTo({ top:0, behavior:'smooth' }); break;
      case 'resave': submitScore(); break;
      case 'nojoin': joinBox.hidden = true; break;
      case 'notme':
        try { localStorage.removeItem(JOINKEY); } catch(err){}
        TOKEN = ''; LSK = ''; B.name = ''; visited = {}; best = 0;
        document.getElementById('whoami').hidden = true;
        showJoin(''); render(); window.scrollTo({ top:0, behavior:'smooth' }); break;
    }
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && S.mode === 'explore' && S.sel){ S.sel = null; S.walking = false; render(); } });
  var wasPhone = isPhone();
  window.addEventListener('resize', function(){ var now = isPhone(); if (now !== wasPhone){ wasPhone = now; render(); } });

  /* ---------- class link: type your name once ---------- */
  var JOINKEY = 'gq-sanct-me';
  var joinBox = document.getElementById('join');
  function showWho(){
    if (!B.name) return;
    var who = document.getElementById('whoami');
    who.className = 'me';
    who.innerHTML = '<span>Hi, <b>'+esc(B.name)+'</b>. Your progress and challenge scores are saved for your counsellor.</span>'
      + (B.back ? '<a href="'+esc(B.back)+'">'+esc(B.backLabel || 'Back to my missions')+'</a>' : B.base ? '<a href="'+esc(B.base)+'?t='+esc(TOKEN)+'">Back to my missions</a>' : '')
      + (B.base && !/[?&]p=learn/.test(B.back || '') ? '<a href="'+esc(B.base)+'?t='+esc(TOKEN)+'&p=learn">More explorers</a>' : '')
      + (B.join ? '<button class="linkbtn" data-act="notme">Not '+esc(String(B.name).split(' ')[0])+'?</button>' : '');
    who.hidden = false;
  }
  function adopt(me){
    TOKEN = me.token; LSK = '-' + TOKEN.slice(0, 10); B.name = me.name;
    try { localStorage.setItem(JOINKEY, TOKEN); } catch(e){}
    (Array.isArray(me.visited) ? me.visited : []).forEach(function(id){ if (ALL.indexOf(id) > -1) visited[id] = true; });
    best = Math.max(best, Number(me.best) || 0);
    joinBox.hidden = true;
    saveVisited();
    showWho();
    if (S.ch && S.ch.done && !S.ch.save) submitScore();
    render();
  }
  function showJoin(msg){
    joinBox.innerHTML = '<b class="jt">Save your progress for your counsellor</b>'
      + '<p>Type your full name once. This phone will remember you after that.</p>'
      + '<form id="joinform" autocomplete="off"><input id="joinname" maxlength="60" placeholder="e.g. Ann Smith" aria-label="Your full name"><button class="btn btn-primary" type="submit">Start</button></form>'
      + (msg ? '<p class="err" role="alert">'+esc(msg)+'</p>' : '')
      + '<button class="linkbtn" data-act="nojoin">Just look around without saving</button>'
      + '<p class="tip">Tip: put this page on your home screen so it opens like an app. Android (Chrome): tap ⋮ then <b>Add to Home screen</b>. iPhone (Safari): tap Share then <b>Add to Home Screen</b>.</p>';
    joinBox.hidden = false;
  }
  var JOIN_ERR = {'bad-name':'Type your first and last name.','full':'The class list is full. Ask your counsellor.','busy':'Lots of people joined just now. Try again in a few minutes.'};
  joinBox.addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('joinname'), name = String(inp && inp.value || '').replace(/\s+/g, ' ').trim();
    if (name.length < 2){ showJoin('Type your first and last name.'); return; }
    if (!hasRun()){ showJoin('Saving only works from the class link.'); return; }
    var btn = joinBox.querySelector('button[type=submit]'); if (btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
    google.script.run
      .withSuccessHandler(function(me){ adopt(me); })
      .withFailureHandler(function(err){ var m = String(err && err.message || err), code = (m.match(/bad-name|full|busy/) || [''])[0]; showJoin(JOIN_ERR[code] || 'Couldn’t save. Check your internet and try again.'); })
      .s_join(name);
  });
  if (TOKEN){
    try { localStorage.setItem(JOINKEY, TOKEN); } catch(e){}
    showWho();
  } else if (B.join && hasRun()){
    var remembered = '';
    try { remembered = localStorage.getItem(JOINKEY) || ''; } catch(e){}
    if (remembered){
      google.script.run
        .withSuccessHandler(function(me){ adopt(me); })
        .withFailureHandler(function(){ try { localStorage.removeItem(JOINKEY); } catch(e){} showJoin(''); })
        .s_whoami(remembered);
    } else showJoin('');
  }
  render();
})();
</script>

<script>if (!window.__gqRouted) gqStart({"p": "s"});</script>
</body>
</html>
